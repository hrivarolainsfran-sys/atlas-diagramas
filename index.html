<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}body{margin:0}</style>
<title>Atlas de Diagramas IB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&family=STIX+Two+Text:ital,wght@0,500;1,500&display=swap">
<style>
/* Layout: índice fijo a la izquierda (se pliega en móvil) + lámina de dibujo técnico sobre papel milimetrado a la derecha */
:root{
  --paper:#F6F8FB; --sheet:#FFFFFF; --grid:#DFE7F1; --grid-strong:#C9D6E6;
  --ink:#14213D; --ink-2:#3C4A66; --muted:#6B7891; --rule:#D5DDE8;
  --navy:#1B2F5B; --navy-ink:#FFFFFF; --gold:#B8862B; --gold-soft:#F6EBD3;
  --warn-bg:#FFF4E5; --warn-bd:#E2A13B; --warn-ink:#6A3F00;
  --ns-bg:#EEF1F5; --ns-bd:#9AA6B8;
  --k-d:#1F4E9E; --k-s:#C0392B; --k-da:#12305F; --k-oalp:#B3261E; --k-oacp:#C96A0A;
  --k-exp:#1E8E3E; --k-con:#C62828; --k-n:#14213D; --k-v:#6B3FA0;
  --f-ec:rgba(240,186,30,.50); --f-ep:rgba(39,174,96,.36); --f-dwl:rgba(47,128,237,.40);
  --f-gov:rgba(142,68,173,.30); --f-gray:rgba(110,124,150,.22); --f-red:rgba(198,40,40,.22);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-math:"STIX Two Text","Cambria","Times New Roman",serif;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1524; --sheet:#141D30; --grid:#1D2A42; --grid-strong:#263652;
  --ink:#E7EDF7; --ink-2:#B9C4D8; --muted:#8B98B0; --rule:#2A3853;
  --navy:#2B4A86; --navy-ink:#FFFFFF; --gold:#E0B25A; --gold-soft:#3A2F17;
  --warn-bg:#33240C; --warn-bd:#C98A2A; --warn-ink:#FFDDA6;
  --ns-bg:#1B2436; --ns-bd:#56637C;
  --k-d:#7EA9F2; --k-s:#F28B7F; --k-da:#9CC0FF; --k-oalp:#FF8A80; --k-oacp:#F5B04C;
  --k-exp:#5FD38A; --k-con:#FF7B7B; --k-n:#E7EDF7; --k-v:#C39BF0;
  --f-ec:rgba(240,186,30,.38); --f-ep:rgba(60,200,120,.30); --f-dwl:rgba(90,160,255,.38);
  --f-gov:rgba(180,120,230,.30); --f-gray:rgba(160,175,200,.20); --f-red:rgba(255,110,110,.22);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0E1524; --sheet:#141D30; --grid:#1D2A42; --grid-strong:#263652;
  --ink:#E7EDF7; --ink-2:#B9C4D8; --muted:#8B98B0; --rule:#2A3853;
  --navy:#2B4A86; --navy-ink:#FFFFFF; --gold:#E0B25A; --gold-soft:#3A2F17;
  --warn-bg:#33240C; --warn-bd:#C98A2A; --warn-ink:#FFDDA6;
  --ns-bg:#1B2436; --ns-bd:#56637C;
  --k-d:#7EA9F2; --k-s:#F28B7F; --k-da:#9CC0FF; --k-oalp:#FF8A80; --k-oacp:#F5B04C;
  --k-exp:#5FD38A; --k-con:#FF7B7B; --k-n:#E7EDF7; --k-v:#C39BF0;
  --f-ec:rgba(240,186,30,.38); --f-ep:rgba(60,200,120,.30); --f-dwl:rgba(90,160,255,.38);
  --f-gov:rgba(180,120,230,.30); --f-gray:rgba(160,175,200,.20); --f-red:rgba(255,110,110,.22);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.55}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- barra superior ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:var(--navy-ink);
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 16px}
.brand{display:flex;flex-direction:column;line-height:1.05;margin-right:auto;min-width:0}
.brand b{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.02em}
.brand span{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.units{display:flex;gap:4px;background:rgba(255,255,255,.10);padding:3px;border-radius:8px;flex-wrap:wrap}
.units button{border:0;background:transparent;color:var(--navy-ink);padding:6px 12px;border-radius:6px;cursor:pointer;
  font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.02em;white-space:nowrap}
.units button .n{font-family:var(--f-body);font-size:11px;opacity:.75;margin-left:5px;font-variant-numeric:tabular-nums}
.units button[aria-pressed="true"]{background:var(--sheet);color:var(--ink)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:var(--navy-ink);
  border-radius:6px;padding:6px 10px;width:190px;max-width:100%}
.search::placeholder{color:rgba(255,255,255,.65)}
.tog{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:13.5px;user-select:none;
  border:1px solid rgba(255,255,255,.25);border-radius:6px;padding:5px 10px}
.tog input{accent-color:var(--gold)}
.menu-btn{display:none;border:1px solid rgba(255,255,255,.3);background:transparent;color:var(--navy-ink);border-radius:6px;padding:5px 10px;cursor:pointer}

/* ---------- estructura ---------- */
.wrap{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:calc(100% - 60px)}
aside{border-right:1px solid var(--rule);background:var(--sheet);padding-block:14px 30px;padding-inline:12px;
  position:sticky;top:60px;align-self:start;max-height:calc(100vh - 60px);overflow:auto}
.grp{margin-bottom:12px}
.grp h3{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);margin:10px 6px 4px;display:flex;gap:8px}
.grp h3 .c{color:var(--gold);font-variant-numeric:tabular-nums}
.item{display:flex;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:5px;cursor:pointer;
  font-size:14px;line-height:1.3;color:var(--ink-2)}
.item:hover{background:var(--paper)}
.item[aria-current="true"]{background:var(--gold-soft);color:var(--ink);font-weight:700}
.item .code{font-family:var(--f-display);font-weight:600;color:var(--muted);min-width:38px;font-variant-numeric:tabular-nums}
.side-foot{border-top:1px solid var(--rule);margin-top:14px;padding-top:10px}
.empty{color:var(--muted);padding:8px;font-size:14px}

main{padding-block:22px 60px;padding-inline:clamp(16px,3.5vw,44px);min-width:0}
.sheet{max-width:1060px;margin:0 auto}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,4vw,40px);line-height:1.05;margin:4px 0 8px;text-wrap:balance;letter-spacing:.005em}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;margin-bottom:16px}
.chip{font-size:12.5px;border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:3px 10px;color:var(--ink-2)}
.chip.ex{border-color:var(--gold);color:var(--ink)}

/* ---------- lámina del diagrama ---------- */
.figure{background:var(--sheet);border:1px solid var(--grid-strong);border-radius:var(--r);padding:12px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:16px 16px;background-position:-1px -1px}
.panels{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.pan{flex:1 1 300px;max-width:470px;min-width:0;background:var(--sheet);border-radius:4px}
.pan.wide{max-width:none;flex-basis:100%}
.pan svg{display:block;width:100%;height:auto}
.pan .pt{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.04em;text-align:center;color:var(--ink-2);padding-top:6px}
.cap{font-size:13.5px;color:var(--ink-2);margin:10px 4px 0;line-height:1.45}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 4px 0;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;border:1px solid var(--rule)}

/* svg */
svg text{font-family:var(--f-math)}
.ax{stroke:var(--ink);stroke-width:1.6;fill:none}
.gd{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4;fill:none}
.cv{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.cv.dash{stroke-dasharray:7 5}
.cv.thin{stroke-width:1.5}
.k-d{stroke:var(--k-d)} .k-s{stroke:var(--k-s)} .k-da{stroke:var(--k-da)} .k-oalp{stroke:var(--k-oalp)}
.k-oacp{stroke:var(--k-oacp)} .k-exp{stroke:var(--k-exp)} .k-con{stroke:var(--k-con)} .k-n{stroke:var(--k-n)} .k-v{stroke:var(--k-v)}
.t-d{fill:var(--k-d)} .t-s{fill:var(--k-s)} .t-da{fill:var(--k-da)} .t-oalp{fill:var(--k-oalp)} .t-oacp{fill:var(--k-oacp)}
.t-exp{fill:var(--k-exp)} .t-con{fill:var(--k-con)} .t-n{fill:var(--k-n)} .t-v{fill:var(--k-v)}
.f-ec{fill:var(--f-ec)} .f-ep{fill:var(--f-ep)} .f-dwl{fill:var(--f-dwl)} .f-gov{fill:var(--f-gov)} .f-gray{fill:var(--f-gray)} .f-red{fill:var(--f-red)}
.ar{fill:none;stroke-width:1.8} .ah{stroke:none}
.ar.k-n{stroke:var(--ink-2)} .ah.t-n{fill:var(--ink-2)}
.lb{font-size:16px;font-style:italic;font-weight:500}
.al{font-size:13px;font-weight:500;fill:var(--ink)}
.tk{font-size:13px;fill:var(--ink);font-style:italic}
.axl{font-size:13px;fill:var(--ink-2);font-family:var(--f-body)!important}
.nt{font-size:12.5px;fill:var(--ink-2);font-family:var(--f-body)!important}
.dot{fill:var(--ink)} .pl{font-size:14px;font-weight:500;fill:var(--ink)}
.node{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.4}
.node.hl{fill:var(--gold-soft);stroke:var(--gold)}
.node.alt{fill:var(--paper);stroke:var(--muted);stroke-dasharray:5 4}
.nodet{font-family:var(--f-body)!important;font-size:13px;fill:var(--ink)}
.edgel{font-family:var(--f-body)!important;font-size:11.5px;fill:var(--ink-2)}
.lb,.al,.tk,.pl,.nt,.edgel{paint-order:stroke;stroke:var(--sheet);stroke-width:4px;stroke-linejoin:round}
.practice .lb,.practice .al,.practice .tk,.practice .pl,.practice .nt,.practice .edgel{visibility:hidden}
.practice-note{display:none;font-size:13px;color:var(--warn-ink);background:var(--warn-bg);border:1px solid var(--warn-bd);border-radius:5px;padding:6px 10px;margin:0 4px 10px}
.practice .practice-note{display:block}

/* ---------- bloques de análisis ---------- */
.blocks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}
.blk{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;min-width:0}
.blk.full{grid-column:1/-1}
.blk h2{font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:.04em;text-transform:uppercase;margin:0 0 8px;color:var(--navy)}
:root[data-theme="dark"] .blk h2{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .blk h2{color:var(--ink)}}
.blk ul,.blk ol{margin:0;padding-left:20px;display:grid;gap:5px}
.blk p{margin:0 0 6px}
table.ax-t{width:100%;border-collapse:collapse;font-size:14.5px}
table.ax-t th,table.ax-t td{border:1px solid var(--rule);padding:6px 9px;text-align:left;vertical-align:top}
table.ax-t th{background:var(--paper);font-weight:700;width:30%}
.warn{background:var(--warn-bg);border:1px solid var(--warn-bd);color:var(--warn-ink)}
.warn h2{color:var(--warn-ink)!important}
.ns{background:var(--ns-bg);border:1px dashed var(--ns-bd);border-radius:5px;padding:10px 12px;margin-top:10px;font-size:14px}
.ns b.tag{display:block;font-family:var(--f-display);letter-spacing:.06em;text-transform:uppercase;font-size:14px;color:var(--muted);margin-bottom:4px}
.formula{font-family:var(--f-math);font-size:16px;background:var(--paper);border-radius:4px;padding:3px 8px;display:inline-block;margin:2px 0}
ol.chain{counter-reset:c;list-style:none;padding-left:0}
ol.chain li{counter-increment:c;display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start}
ol.chain li::before{content:counter(c);font-family:var(--f-display);font-weight:700;color:var(--navy-ink);background:var(--navy);
  border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-size:14px}
.check label{display:flex;gap:9px;align-items:flex-start;cursor:pointer;padding:3px 0}
.check input{margin-top:4px;accent-color:var(--k-exp)}
.check .score{font-size:13px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
sub{font-size:72%}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.nav button{border:1px solid var(--rule);background:var(--sheet);border-radius:6px;padding:9px 14px;cursor:pointer;max-width:48%;text-align:left;font-size:14px}
.nav button:hover{border-color:var(--gold)}
.nav button small{display:block;color:var(--muted);font-size:12px}
.tbl-wrap{overflow-x:auto}
table.mx{border-collapse:collapse;width:100%;font-size:14.5px;min-width:560px}
table.mx th,table.mx td{border:1px solid var(--rule);padding:7px 10px;text-align:left;vertical-align:top}
table.mx th{background:var(--navy);color:var(--navy-ink);font-weight:700}
table.mx td a,.lnk{color:var(--k-d);cursor:pointer;text-decoration:underline;background:none;border:0;padding:0}
.intro{max-width:70ch}

@media (max-width:860px){
  .menu-btn{display:inline-block}
  .wrap{grid-template-columns:1fr}
  aside{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--rule)}
  aside.closed{display:none}
  .blocks{grid-template-columns:1fr}
  .search{width:150px}
  .top{position:static;gap:8px 10px}
  .units{width:100%;flex-wrap:nowrap;overflow-x:auto}
  .units button{font-size:15px;padding:5px 9px}
  .pan.wide{overflow-x:auto}
  .pan.wide svg{min-width:600px}
}
@media (prefers-reduced-motion:no-preference){.item,.units button,.nav button{transition:background .15s,border-color .15s}}

/* ---------- práctica por ficha ---------- */
.prac .pseg{display:flex;flex-wrap:wrap;gap:4px;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:3px;margin-bottom:12px}
.prac .pseg button{border:0;background:transparent;padding:7px 12px;border-radius:6px;font-weight:700;font-size:14px;color:var(--ink-2);cursor:pointer}
.prac .pseg button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink)}
.pq{margin:0 0 10px;font-size:15.5px}
.pfig{margin-bottom:12px}
.practice .pfig .lb,.practice .pfig .al,.practice .pfig .tk,.practice .pfig .pl,.practice .pfig .nt,.practice .pfig .edgel{visibility:visible}
.blank{cursor:pointer}
.blank circle{fill:var(--gold-soft);stroke:var(--gold);stroke-width:1.6}
.blank text{font-family:var(--f-body)!important;font-size:11.5px;font-weight:700;fill:var(--ink)}
.blank.on circle{fill:var(--gold);stroke:var(--ink);stroke-width:2}
.pfig text.lb,.pfig text.tk,.pfig text.pl,.pfig text.al{cursor:pointer}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.chipb{border:1.5px solid var(--rule);background:var(--paper);border-radius:6px;padding:5px 11px;font-family:var(--f-math);font-style:italic;font-size:15px;cursor:pointer;color:var(--ink)}
.chipb:hover{border-color:var(--gold)}
.prow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.pbtn{display:inline-block;border:1px solid var(--rule);background:var(--sheet);border-radius:6px;padding:8px 13px;font-weight:700;font-size:14px;color:var(--ink);text-decoration:none;cursor:pointer;line-height:1.3}
.pbtn:hover{border-color:var(--gold)}
.pbtn.primary{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.pbtn:disabled{opacity:.45;cursor:not-allowed}
.plinks{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--rule)}
.pfb{border-radius:6px;padding:10px 12px;margin-top:8px;font-size:14.5px}
.pfb.ok{background:var(--f-ep);border:1px solid var(--k-exp)}
.pfb.no{background:var(--f-red);border:1px solid var(--k-con)}
.pfb.info{background:var(--paper);border:1px solid var(--rule)}
.pnote{color:var(--muted);font-size:13.5px;margin:4px 0}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ph{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.clist{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.cord{counter-reset:o}
.cord li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px;align-items:start;counter-increment:o}
.cord li::before{content:counter(o);font-family:var(--f-display);font-weight:700;color:var(--gold);padding-top:6px}
.cord li.pnote{display:block}.cord li.pnote::before{content:none}
.cstep{text-align:left;border:1.5px solid var(--rule);background:var(--paper);border-radius:6px;padding:7px 10px;font-size:14px;line-height:1.35;cursor:pointer;color:var(--ink);width:100%}
.cstep:hover{border-color:var(--gold)}
.cstep.right,.popt.right{border-color:var(--k-exp);background:var(--f-ep)}
.cstep.wrong,.popt.wrong{border-color:var(--k-con);background:var(--f-red)}
.prac .opts{display:grid;gap:7px}
.popt{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;text-align:left;border:1.5px solid var(--rule);background:var(--paper);border-radius:6px;padding:8px 10px;font-size:14.5px;cursor:pointer;color:var(--ink)}
.popt .l{font-family:var(--f-display);font-weight:700;font-size:16px}
.popt:disabled{cursor:default}
.tlink{text-decoration:none;color:var(--navy-ink);font-weight:700}
.chip.go{cursor:pointer;background:var(--gold-soft);border-color:var(--gold);color:var(--ink);font-weight:700}
@media (max-width:860px){.cgrid{grid-template-columns:1fr}}
</style>
<style>
.sw-f-ec{background:var(--f-ec)} .sw-f-ep{background:var(--f-ep)} .sw-f-dwl{background:var(--f-dwl)}
.sw-f-gov{background:var(--f-gov)} .sw-f-gray{background:var(--f-gray)} .sw-f-red{background:var(--f-red)}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>Atlas de Diagramas</b><span>Economía IB</span></div>
  <div class="units" id="units" role="group" aria-label="Unidad del programa"></div>
  <div class="tools">
    <input class="search" id="q" type="search" placeholder="Buscar diagrama…" aria-label="Buscar diagrama" autocomplete="off">
    <label class="tog" for="prac"><input type="checkbox" id="prac"> Modo práctica</label>
    <a class="tog tlink" href="https://hrivarolainsfran-sys.github.io/atlas-diagramas/taller/">Taller de práctica →</a>
    <button class="menu-btn" id="menu" type="button">Índice</button>
  </div>
</header>
<div class="wrap"><aside id="idx"></aside><main id="main"></main></div>
<script>
/* ================= Motor geométrico y de dibujo ================= */
const G = {
  L: (a, b) => ({ a, b }),
  at(l, x) { const [x1, y1] = l.a, [x2, y2] = l.b; return y1 + (y2 - y1) * (x - x1) / (x2 - x1); },
  atY(l, y) { const [x1, y1] = l.a, [x2, y2] = l.b; return x1 + (x2 - x1) * (y - y1) / (y2 - y1); },
  I(l1, l2) {
    const [x1, y1] = l1.a, [x2, y2] = l1.b, [x3, y3] = l2.a, [x4, y4] = l2.b;
    const d = (x1 - x2) * (y3 - y4) - (y1 - y2) * (x3 - x4);
    const t = ((x1 - x3) * (y3 - y4) - (y1 - y3) * (x3 - x4)) / d;
    return [x1 + t * (x2 - x1), y1 + t * (y2 - y1)];
  },
  sh(l, dx, dy = 0) { return { a: [l.a[0] + dx, l.a[1] + dy], b: [l.b[0] + dx, l.b[1] + dy] }; },
  arc(r, n = 60) { const o = []; for (let i = 0; i <= n; i++) { const a = Math.PI / 2 * (1 - i / n); o.push([r * Math.cos(a), r * Math.sin(a)]); } return o; },
  samp(f, x0, x1, n = 60) { const o = []; for (let i = 0; i <= n; i++) { const x = x0 + (x1 - x0) * i / n; o.push([x, f(x)]); } return o; },
  sampY(g, y0, y1, n = 60) { const o = []; for (let i = 0; i <= n; i++) { const y = y0 + (y1 - y0) * i / n; o.push([g(y), y]); } return o; }
};

const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function svgT(s) {
  return esc(s).replace(/_\{([^}]*)\}|_([A-Za-z0-9áéíóúñ]+)/g, (m, a, b) => `<tspan baseline-shift="sub" font-size="72%">${a || b}</tspan>`);
}
function ht(s) {
  return String(s)
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/`([^`]+)`/g, '<span class="formula">$1</span>')
    .replace(/_\{([^}]*)\}|_([A-Za-z0-9áéíóúñ]+)/g, (m, a, b) => `<sub>${a || b}</sub>`);
}
const r1 = v => Math.round(v * 10) / 10;

function head(x1, y1, x2, y2, cls) {
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L, s = 10, w = 4.6;
  const bx = x2 - ux * s, by = y2 - uy * s;
  return `<polygon class="ah ${cls}" points="${r1(x2)},${r1(y2)} ${r1(bx - uy * w)},${r1(by + ux * w)} ${r1(bx + uy * w)},${r1(by - ux * w)}"/>`;
}
function crPath(P) {
  let d = `M${r1(P[0][0])},${r1(P[0][1])}`;
  for (let i = 0; i < P.length - 1; i++) {
    const p0 = P[i - 1] || P[i], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${r1(c1[0])},${r1(c1[1])} ${r1(c2[0])},${r1(c2[1])} ${r1(p2[0])},${r1(p2[1])}`;
  }
  return d;
}
const tcls = k => 't-' + (k || 'k-n').replace('k-', '');

/* ---- Panel cartesiano ----
 sp: { y, x, xmax, ymax, W, areas[{pts,c,t,n,at}], guides[{p,xl,yl,noX,noY}], lines[{l,k,dash,t,tp,at}],
       paths[{pts,smooth,k,dash,t,tp}], arrows[{a,b,k}], spans[{a,b,t,below}], pts[{p,t,dx,dy}], notes[{p,t,a,k}] } */
function panel(sp) {
  const PX = 64, PY = 284, W = sp.W || 300, H = 250, vbH = 334;
  const xm = sp.xmax || 10, ym = sp.ymax || 10;
  const X = x => PX + x * W / xm, Y = y => PY - y * H / ym;
  const tw = t => String(t).replace(/[_{}]/g, '').length * 8.4;
  let vbW = PX + W + (sp.rm || 52);
  (sp.lines || []).forEach(l => { if (l.t && !l.tp) { const q = l.at === 'a' ? l.l.a : l.l.b; vbW = Math.max(vbW, X(q[0]) + 10 + tw(l.t)); } });
  (sp.paths || []).forEach(p => { if (p.t && !p.tp) { const q = p.pts[p.pts.length - 1]; vbW = Math.max(vbW, X(q[0]) + 10 + tw(p.t)); } });
  vbW = Math.ceil(vbW);
  const o = [];
  (sp.areas || []).forEach(a => o.push(`<polygon class="${a.c || 'f-gray'}" points="${a.pts.map(p => r1(X(p[0])) + ',' + r1(Y(p[1]))).join(' ')}"/>`));
  (sp.guides || []).forEach(g => {
    const [x, y] = g.p, x0 = g.x0 != null ? g.x0 : 0, y0 = g.y0 != null ? g.y0 : 0;
    if (!g.noY) o.push(`<line class="gd" x1="${r1(X(x0))}" y1="${r1(Y(y))}" x2="${r1(X(x))}" y2="${r1(Y(y))}"/>`);
    if (!g.noX) o.push(`<line class="gd" x1="${r1(X(x))}" y1="${r1(Y(y0))}" x2="${r1(X(x))}" y2="${r1(Y(y))}"/>`);
    if (g.yl) o.push(`<text class="tk" x="${PX - 6}" y="${r1(Y(y) + 4.5 + (g.ty || 0))}" text-anchor="end">${svgT(g.yl)}</text>`);
    if (g.xl) o.push(`<text class="tk" x="${r1(X(x))}" y="${PY + 18}" text-anchor="middle">${svgT(g.xl)}</text>`);
  });
  if (!sp.noAxes) {
    o.push(`<path class="ax" d="M${PX},${PY - H - 6} L${PX},${PY} L${PX + W + 6},${PY}"/>`);
    o.push(`<text class="tk" x="${PX - 7}" y="${PY + 15}" text-anchor="end">0</text>`);
  }
  if (sp.y) o.push(`<text class="axl" x="${PX - 4}" y="${PY - H - 14}" text-anchor="start">${svgT(sp.y)}</text>`);
  if (sp.x) o.push(`<text class="axl" x="${PX + W + 8}" y="${PY + 38}" text-anchor="end">${svgT(sp.x)}</text>`);
  (sp.paths || []).forEach(p => {
    const P = p.pts.map(q => [X(q[0]), Y(q[1])]);
    const d = p.smooth ? crPath(P) : 'M' + P.map(q => r1(q[0]) + ',' + r1(q[1])).join(' L');
    o.push(`<path class="cv ${p.k || 'k-n'}${p.dash ? ' dash' : ''}${p.thin ? ' thin' : ''}" d="${d}"/>`);
    if (p.t) { const q = p.tp || p.pts[p.pts.length - 1]; o.push(`<text class="lb ${tcls(p.k)}" x="${r1(X(q[0]) + (p.tp ? 0 : 6))}" y="${r1(Y(q[1]) + (p.tp ? 0 : 5))}" text-anchor="${p.ta || 'start'}">${svgT(p.t)}</text>`); }
  });
  (sp.lines || []).forEach(l => {
    const s = l.l;
    o.push(`<line class="cv ${l.k || 'k-n'}${l.dash ? ' dash' : ''}${l.thin ? ' thin' : ''}" x1="${r1(X(s.a[0]))}" y1="${r1(Y(s.a[1]))}" x2="${r1(X(s.b[0]))}" y2="${r1(Y(s.b[1]))}"/>`);
    if (l.t) {
      let x, y, ta = l.ta || 'start';
      if (l.tp) { x = X(l.tp[0]); y = Y(l.tp[1]); }
      else { const q = l.at === 'a' ? s.a : s.b; x = X(q[0]) + 6; y = Y(q[1]) + (l.at === 'a' ? -4 : 5); }
      o.push(`<text class="lb ${tcls(l.k)}" x="${r1(x)}" y="${r1(y)}" text-anchor="${ta}">${svgT(l.t)}</text>`);
    }
  });
  (sp.spans || []).forEach(s => {
    const x1 = X(s.a[0]), y1 = Y(s.a[1]), x2 = X(s.b[0]), y2 = Y(s.b[1]);
    o.push(`<line class="ar k-n" x1="${r1(x1)}" y1="${r1(y1)}" x2="${r1(x2)}" y2="${r1(y2)}"/>`);
    o.push(head(x2, y2, x1, y1, 't-n').replace('ah t-n', 'ah t-n')); o.push(head(x1, y1, x2, y2, 't-n'));
    const vert = Math.abs(x2 - x1) < 2;
    const mx = (x1 + x2) / 2 + (vert ? (s.left ? -8 : 8) : 0), my = (y1 + y2) / 2 + (vert ? 4 : (s.below ? 17 : -8));
    if (s.t) o.push(`<text class="nt" x="${r1(mx)}" y="${r1(my)}" text-anchor="${vert ? (s.left ? 'end' : 'start') : 'middle'}">${svgT(s.t)}</text>`);
  });
  (sp.arrows || []).forEach(a => {
    const x1 = X(a.a[0]), y1 = Y(a.a[1]), x2 = X(a.b[0]), y2 = Y(a.b[1]);
    const L = Math.hypot(x2 - x1, y2 - y1), ex = x2 - (x2 - x1) / L * 8, ey = y2 - (y2 - y1) / L * 8;
    o.push(`<line class="ar ${a.k || 'k-n'}" x1="${r1(x1)}" y1="${r1(y1)}" x2="${r1(ex)}" y2="${r1(ey)}"/>`);
    o.push(head(x1, y1, x2, y2, tcls(a.k)));
  });
  (sp.areas || []).forEach(a => {
    if (!a.t) return;
    const c = a.at || [a.pts.reduce((s, p) => s + p[0], 0) / a.pts.length, a.pts.reduce((s, p) => s + p[1], 0) / a.pts.length];
    o.push(`<text class="al" x="${r1(X(c[0]))}" y="${r1(Y(c[1]) + 4)}" text-anchor="middle">${svgT(a.t)}</text>`);
  });
  (sp.pts || []).forEach(p => {
    o.push(`<circle class="dot" cx="${r1(X(p.p[0]))}" cy="${r1(Y(p.p[1]))}" r="3.4"/>`);
    if (p.t) o.push(`<text class="pl" x="${r1(X(p.p[0]) + (p.dx != null ? p.dx : 6))}" y="${r1(Y(p.p[1]) + (p.dy != null ? p.dy : -7))}" text-anchor="${p.a || 'start'}">${svgT(p.t)}</text>`);
  });
  (sp.notes || []).forEach(n => o.push(`<text class="${n.k ? 'lb ' + tcls(n.k) : 'nt'}" x="${r1(X(n.p[0]))}" y="${r1(Y(n.p[1]))}" text-anchor="${n.a || 'middle'}">${svgT(n.t)}</text>`));
  return `<svg viewBox="0 0 ${vbW} ${vbH}" role="img" aria-label="${esc(sp.aria || sp.t || 'Diagrama')}">${o.join('')}</svg>`;
}

/* ---- Diagrama de flujo (flujo circular, ciclo de la pobreza) ---- */
function flow(F) {
  const N = {}; F.nodes.forEach(n => N[n.id] = n);
  const bd = (n, tx, ty) => {
    const cx = n.x, cy = n.y, dx = tx - cx, dy = ty - cy;
    const t = Math.min((n.w / 2 + 3) / Math.abs(dx || 1e-6), (n.h / 2 + 3) / Math.abs(dy || 1e-6));
    return [cx + dx * t, cy + dy * t];
  };
  const o = [];
  (F.edges || []).forEach(e => {
    const A = N[e.f], B = N[e.t];
    const c = e.via;
    const s = bd(A, c ? c[0] : B.x, c ? c[1] : B.y), t = bd(B, c ? c[0] : A.x, c ? c[1] : A.y);
    const cls = e.k || 'k-n';
    if (c) {
      const L = Math.hypot(t[0] - c[0], t[1] - c[1]), ex = t[0] - (t[0] - c[0]) / L * 8, ey = t[1] - (t[1] - c[1]) / L * 8;
      o.push(`<path class="ar ${cls}" d="M${r1(s[0])},${r1(s[1])} Q${c[0]},${c[1]} ${r1(ex)},${r1(ey)}"/>`);
      o.push(head(c[0], c[1], t[0], t[1], tcls(cls)));
    } else {
      const L = Math.hypot(t[0] - s[0], t[1] - s[1]), ex = t[0] - (t[0] - s[0]) / L * 8, ey = t[1] - (t[1] - s[1]) / L * 8;
      o.push(`<line class="ar ${cls}" x1="${r1(s[0])}" y1="${r1(s[1])}" x2="${r1(ex)}" y2="${r1(ey)}"/>`);
      o.push(head(s[0], s[1], t[0], t[1], tcls(cls)));
    }
    if (e.l) {
      const m = e.lp || (c ? [0.25 * s[0] + 0.5 * c[0] + 0.25 * t[0], 0.25 * s[1] + 0.5 * c[1] + 0.25 * t[1]] : [(s[0] + t[0]) / 2, (s[1] + t[1]) / 2]);
      e.l.split('\n').forEach((ln, i) => o.push(`<text class="edgel" x="${r1(m[0])}" y="${r1(m[1] + i * 13)}" text-anchor="${e.la || 'middle'}">${svgT(ln)}</text>`));
    }
  });
  F.nodes.forEach(n => {
    o.push(`<rect class="node ${n.c || ''}" x="${n.x - n.w / 2}" y="${n.y - n.h / 2}" width="${n.w}" height="${n.h}" rx="${n.rx != null ? n.rx : 6}"/>`);
    const L = n.t.split('\n'), y0 = n.y - (L.length - 1) * 7.5 + 4.5;
    L.forEach((ln, i) => o.push(`<text class="nodet" x="${n.x}" y="${r1(y0 + i * 15)}" text-anchor="middle"${i === 0 && n.bold !== false ? ' font-weight="700"' : ''}>${svgT(ln)}</text>`));
  });
  (F.notes || []).forEach(n => o.push(`<text class="nt" x="${n.p[0]}" y="${n.p[1]}" text-anchor="${n.a || 'middle'}">${svgT(n.t)}</text>`));
  return `<svg viewBox="0 0 ${F.w} ${F.h}" role="img" aria-label="${esc(F.aria || 'Diagrama de flujo')}">${o.join('')}</svg>`;
}

const LEG_NAMES = { 'f-ec': 'Amarillo', 'f-ep': 'Verde', 'f-dwl': 'Azul', 'f-gov': 'Violeta', 'f-gray': 'Gris', 'f-red': 'Rojo' };
function renderFig(fig) {
  const panels = fig.flow ? [{ flow: fig.flow, wide: true }] : fig.panels;
  const leg = new Map();
  const html = panels.map(p => {
    if (p.flow) return `<div class="pan wide">${p.t ? `<div class="pt">${esc(p.t)}</div>` : ''}${flow(p.flow)}</div>`;
    (p.areas || []).forEach(a => { if (a.n) leg.set(a.c + '|' + a.n, a); });
    return `<div class="pan${p.wide ? ' wide' : ''}">${p.t ? `<div class="pt">${ht(p.t)}</div>` : ''}${panel(p)}</div>`;
  }).join('');
  const lg = [...leg.values()].map(a => `<span><i class="sw-${a.c}"></i>${ht(a.n)}</span>`).join('');
  return { html, lg };

function clipL(m, b, x0 = 0.2, x1 = 9.7, y0 = 0.6, y1 = 9.4) {
  let xa = x0, xb = x1;
  if (m !== 0) { const p = (y0 - b) / m, q = (y1 - b) / m; xa = Math.max(xa, Math.min(p, q)); xb = Math.min(xb, Math.max(p, q)); }
  return G.L([xa, m * xa + b], [xb, m * xb + b]);
}
const DA = c => clipL(-1, c);          // NGP = c − Y
const OACP = c => clipL(1, c);         // NGP = Y + c
const OALP = x => G.L([x, 0.4], [x, 9.4]);
const kY = P => 8 - 4 * Math.exp(-(P - 3) / 1.3);   // OA keynesiana: Y en función del NGP
const KAS = (s = 0) => [[0.4, 3], [4 + s, 3]].concat(G.sampY(P => kY(P) + s, 3, 9.4, 50).slice(1));
function kInt(c, s = 0) {
  if (c - 3 <= 4 + s) return [c - 3, 3];
  let lo = 3, hi = 9.4;
  for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; if (kY(m) + s - (c - m) > 0) hi = m; else lo = m; }
  return [c - lo, lo];
}

    render: () => `<p class="intro">Estos diagramas y cálculos están marcados como <b>solo NS</b> en la guía oficial y la Prueba 2 de NM los excluye. Si aparecen en un libro o en un artículo, no hace falta estudiarlos para el examen de NM.</p>
      <div class="tbl-wrap"><table class="mx"><thead><tr><th style="width:120px">Subtema</th><th>Diagrama o cálculo solo NS</th></tr></thead><tbody>${NS_LIST.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</tbody></table></div>` }
];
/* ================= Aplicación ================= */
const UNITS = {
  micro: { n: 'Microeconomía', s: 'Unidades 1 y 2' },
  macro: { n: 'Macroeconomía', s: 'Unidad 3' },
  global: { n: 'Economía Global', s: 'Unidad 4' }
};
const ALL = [...MICRO, ...MACRO, ...GLOBAL, ...EXTRA];
(() => { // códigos por subtema: 2.7 A, 2.7 B…
  const cnt = {};
  ALL.forEach(f => { if (f.type) { f.code = f.code || f.st; return; } cnt[f.st] = (cnt[f.st] || 0) + 1; f.code = f.st + ' ' + String.fromCharCode(64 + cnt[f.st]); });
})();
const BY = Object.fromEntries(ALL.map(f => [f.id, f]));
const S = { unit: 'micro', id: null, q: '', practice: false };
const $ = s => document.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
};
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

function listFor(unit) { return ALL.filter(f => f.u === unit); }
function matches(f, q) {
  if (!q) return true;
  const hay = norm([f.t, f.st, f.stn, f.code, ...(f.curvas || []), ...(f.err || [])].join(' '));
  return norm(q).split(/\s+/).every(w => hay.includes(w));
}

function renderUnits() {
  $('#units').innerHTML = Object.entries(UNITS).map(([k, u]) =>
    `<button type="button" data-u="${k}" aria-pressed="${S.unit === k}">${u.n}<span class="n">${listFor(k).filter(f => !f.type).length}</span></button>`).join('');
}

function renderIndex() {
  const q = S.q.trim();
  const pool = q ? ALL.filter(f => matches(f, q)) : listFor(S.unit);
  const groups = new Map();
  pool.forEach(f => { const key = (q ? UNITS[f.u] ? UNITS[f.u].n + ' · ' : '' : '') + f.st + '|' + f.stn; if (!groups.has(key)) groups.set(key, []); groups.get(key).push(f); });
  let h = '';
  if (!pool.length) h = `<p class="empty">No hay fichas que coincidan con «${esc(q)}». Probá con otra palabra, por ejemplo «subvención» o «brecha».</p>`;
  groups.forEach((items, key) => {
    const [st, stn] = key.split('|');
    h += `<div class="grp"><h3><span class="c">${esc(st)}</span><span>${esc(stn)}</span></h3>` +
      items.map(f => `<button type="button" class="item" data-id="${f.id}" aria-current="${f.id === S.id}"><span class="code">${esc(f.type ? '▤' : f.code.split(' ')[1])}</span><span>${esc(f.t)}</span></button>`).join('') + '</div>';
  });
  h += `<div class="side-foot"><button type="button" class="item" data-id="ns-ref" aria-current="${S.id === 'ns-ref'}"><span class="code">NS</span><span>Diagramas solo NS (no evaluables en NM)</span></button>
  <p class="empty">Con <b>Modo práctica</b> se ocultan rótulos, ejes y letras: dibujá el diagrama completo en tu cuaderno y compará.</p></div>`;
  $('#idx').innerHTML = h;
}

function block(title, inner, cls = '') { return inner ? `<section class="blk ${cls}"><h2>${title}</h2>${inner}</section>` : ''; }
const ul = a => a && a.length ? `<ul>${a.map(x => `<li>${ht(x)}</li>`).join('')}</ul>` : '';

const CHECK = [
  'El diagrama corresponde al modelo económico analizado.',
  'Los ejes están rotulados con variable y unidad.',
  'Las curvas relevantes están identificadas con su notación.',
  'El equilibrio inicial (precio y cantidad) está indicado.',
  'Los desplazamientos están representados con flechas y en la dirección correcta.',
  'El nuevo equilibrio está claramente señalado.'
];

/* ================= Práctica por ficha (generada desde los datos de cada diagrama) ================= */
const TALLER = 'https://hrivarolainsfran-sys.github.io/atlas-diagramas/taller/';
const LAB_OF = {
  cpp: 'cpp', 'cpp-costo': 'cpp', 'cpp-crecimiento': 'cpp',
  demanda: 'shifts', 'demanda-mov': 'shifts', oferta: 'shifts', 'oferta-mov': 'shifts', equilibrio: 'shifts', 'equilibrio-cambio': 'shifts',
  'epd-rel': 'ped', 'epd-it': 'ped',
  'precio-max': 'ceil', 'precio-min': 'ceil', 'salario-minimo': 'ceil',
  'impuesto-especifico': 'tax', 'impuesto-advalorem': 'tax', subvencion: 'tax', incidencia: 'tax',
  'ext-neg-prod': 'ext', 'ext-neg-cons': 'ext', 'ext-pos-prod': 'ext', 'ext-pos-cons': 'ext', 'impuesto-pigou': 'ext', 'subvencion-ext': 'ext',
  da: 'adas', 'da-desplaz': 'adas', oacp: 'adas', 'oacp-desplaz': 'adas', 'oalp-desplaz': 'adas', 'equilibrio-macro': 'adas', 'da-aumento-y': 'adas', 'oalp-aumento': 'adas', 'inflacion-demanda': 'adas', 'inflacion-costos': 'adas', 'politica-monetaria': 'adas', 'politica-fiscal': 'adas', 'politicas-oferta': 'adas',
  lorenz: 'lorenz', importaciones: 'tariff', arancel: 'tariff', 'tc-flotante': 'fx'
};
const LAB_NAME = { cpp: 'Curva de posibilidades de producción', shifts: '¿Qué curva se mueve?', ped: 'EPD e ingreso total', tax: 'Impuestos y subsidios', ceil: 'Precios máximos y mínimos', ext: 'Externalidades', adas: 'Demanda y oferta agregadas', lorenz: 'Curva de Lorenz y Gini', tariff: 'Arancel', fx: 'Mercado del guaraní' };
const TALLER_ST = ['1.1', '1.2', '2.1', '2.2', '2.3', '2.5', '2.6', '2.7', '2.8', '2.9', '3.1', '3.2', '3.3', '3.4', '3.5', '3.6', '3.7', '4.1', '4.2', '4.4', '4.5', '4.6', '4.7', '4.8', '4.9', '4.10'];
const shuf = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const plain = s => String(s).replace(/\*\*([^*]+)\*\*/g, '$1').replace(/`([^`]+)`/g, '$1');
const areaDesc = n => { let s = plain(n).replace(/^\s*[A-Za-z0-9áéíóú₀-₉ ,+y]{1,14}:\s*/, ''); return s.charAt(0).toUpperCase() + s.slice(1); };
function fichaAreas(f) {
  if (!f.fig || f.fig.flow || !f.fig.panels) return [];
  const seen = new Set(), out = [];
  f.fig.panels.forEach(p => (p.areas || []).forEach(a => { if (!a.t || !a.n) return; const d = areaDesc(a.n); const k = a.t + '|' + d; if (!seen.has(k)) { seen.add(k); out.push({ t: a.t, d }); } }));
  return out;
}
let AREA_POOL = null;
const areaPool = () => AREA_POOL || (AREA_POOL = [...new Set(ALL.flatMap(f => fichaAreas(f).map(a => a.d)))]);
const PR = { mode: 'rot' };

function practiceBlock(f) {
  if (f.type === 'page' || !f.fig) return '';
  const lab = LAB_OF[f.id], hasA = fichaAreas(f).length > 0, hasC = (f.cad || []).length > 2;
  const st = TALLER_ST.includes(f.st) ? f.st : null;
  const modes = [['rot', 'Rotular el diagrama']].concat(hasC ? [['cad', 'Ordenar la cadena causal']] : []).concat(hasA ? [['are', '¿Qué representa cada área?']] : []);
  if (!modes.some(m => m[0] === PR.mode)) PR.mode = 'rot';
  return `<section class="blk full prac" id="practicar"><h2>Practica este diagrama</h2>
    <div class="pseg" role="group" aria-label="Tipo de práctica">${modes.map(([k, l]) => `<button type="button" data-pm="${k}" aria-pressed="${k === PR.mode}">${l}</button>`).join('')}</div>
    <div id="pbody"></div>
    <div class="plinks">${lab ? `<a class="pbtn primary" href="${TALLER}#lab-${lab}">Laboratorio interactivo: ${LAB_NAME[lab]}</a>` : ''}${st ? `<a class="pbtn" href="${TALLER}#t${st.replace('.', '-')}">Ejercicios del subtema ${st} en el Taller</a>` : ''}</div>
  </section>`;
}

function mountPractice(f) {
  const body = document.getElementById('pbody'); if (!body) return;
  document.querySelectorAll('[data-pm]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.pm === PR.mode)));
  ({ rot: pracRot, cad: pracCad, are: pracAre })[PR.mode](f, body);
}

/* ---- Rotular ---- */
function pracRot(f, body) {
  body.innerHTML = `<p class="pq">Toca un número del diagrama y luego el rótulo que va en ese lugar. Los ejes ya están nombrados.</p>
    <div class="figure pfig"><div class="panels">${renderFig(f.fig).html}</div></div>
    <div class="bank" id="bank"></div>
    <div class="prow"><button type="button" class="pbtn primary" id="pchk">Comprobar</button><button type="button" class="pbtn" id="pshow">Ver respuestas</button><button type="button" class="pbtn" id="prst">Reiniciar</button></div><div id="pfb"></div>`;
  const fig = body.querySelector('.pfig');
  let els = [...fig.querySelectorAll('text.lb, text.tk, text.pl, text.al, text.nodet[font-weight="700"]')].filter(t => t.textContent.trim() && t.textContent.trim() !== '0');
  const toHtml = t => t.innerHTML.replace(/<tspan[^>]*>/g, '<sub>').replace(/<\/tspan>/g, '</sub>');
  const items = els.map((t, i) => ({ el: t, key: t.textContent.trim(), html: toHtml(t), orig: t.innerHTML, ans: null }));
  const bank = []; const seenK = new Set();
  items.forEach(it => { if (!seenK.has(it.key)) { seenK.add(it.key); bank.push({ key: it.key, html: it.html, svg: it.orig }); } });
  let sel = null, checked = false;
  items.forEach((it, i) => {
    let bb; try { bb = it.el.getBBox(); } catch (e) { bb = null; }
    const cx = bb && bb.width ? bb.x + bb.width / 2 : +it.el.getAttribute('x'), cy = bb && bb.height ? bb.y + bb.height / 2 : +it.el.getAttribute('y') - 4;
    it.el.style.visibility = 'hidden';
    const svg = it.el.ownerSVGElement;
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g'); g.setAttribute('class', 'blank'); g.setAttribute('tabindex', '0'); g.setAttribute('role', 'button');
    g.innerHTML = `<circle cx="${cx}" cy="${cy}" r="10"></circle><text x="${cx}" y="${cy + 4}" text-anchor="middle">${i + 1}</text>`;
    svg.appendChild(g); it.g = g;
    const pickBlank = () => { if (checked) return; sel = i; draw(); };
    g.addEventListener('click', pickBlank); g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pickBlank(); } });
    it.el.addEventListener('click', pickBlank);
  });
  const bankEl = body.querySelector('#bank');
  bankEl.innerHTML = shuf(bank).map((b, k) => `<button type="button" class="chipb" data-bk="${esc(b.key)}">${b.html}</button>`).join('');
  bankEl.querySelectorAll('.chipb').forEach(c => c.addEventListener('click', () => {
    if (checked || sel === null) return;
    const b = bank.find(x => x.key === c.dataset.bk); items[sel].ans = b;
    const nx = items.findIndex((it, k) => k > sel && !it.ans); sel = nx >= 0 ? nx : items.findIndex(it => !it.ans); if (sel < 0) sel = null; draw();
  }));
  function draw() {
    items.forEach((it, i) => {
      it.g.classList.toggle('on', sel === i);
      if (it.ans) { it.el.innerHTML = it.ans.svg; it.el.style.visibility = 'visible'; it.el.style.fill = checked ? (it.ans.key === it.key ? 'var(--k-exp)' : 'var(--k-con)') : 'var(--gold)'; it.g.style.display = sel === i ? '' : 'none'; }
      else { it.el.style.visibility = 'hidden'; it.g.style.display = ''; }
    });
    const done = items.filter(it => it.ans).length;
    body.querySelector('#pchk').disabled = checked || done === 0;
    if (!checked) body.querySelector('#pfb').innerHTML = `<p class="pnote">${done} de ${items.length} rótulos ubicados${sel !== null ? ` · elegido el número ${sel + 1}` : ''}.</p>`;
  }
  body.querySelector('#pchk').onclick = () => {
    checked = true; sel = null; draw();
    const ok = items.filter(it => it.ans && it.ans.key === it.key).length;
    body.querySelector('#pfb').innerHTML = `<div class="pfb ${ok === items.length ? 'ok' : 'no'}"><b>${ok} de ${items.length} rótulos correctos.</b> ${ok === items.length ? 'El diagrama está completo y bien rotulado.' : 'En rojo están los que no corresponden. Usa “Ver respuestas” o “Reiniciar”.'}</div>`;
  };
  body.querySelector('#pshow').onclick = () => { checked = true; sel = null; items.forEach(it => { it.el.innerHTML = it.orig; it.el.style.visibility = 'visible'; it.el.style.fill = (it.ans && it.ans.key === it.key) ? 'var(--k-exp)' : ''; it.g.style.display = 'none'; }); body.querySelector('#pchk').disabled = true; body.querySelector('#pfb').innerHTML = '<div class="pfb info">Respuestas a la vista. En verde, los que ya habías ubicado bien.</div>'; };
  body.querySelector('#prst').onclick = () => pracRot(f, body);
  sel = 0; draw();
}

/* ---- Cadena causal ---- */
function pracCad(f, body) {
  const steps = f.cad.map((s, i) => ({ i, s }));
  let pool = shuf(steps), pick = [], checked = false;
  while (pool.length > 1 && pool.every((s, k) => s.i === k)) pool = shuf(steps);
  function draw() {
    body.innerHTML = `<p class="pq">Toca los pasos en el orden correcto de la explicación. Toca un paso de tu orden para devolverlo.</p>
      <div class="cgrid"><div><h3 class="ph">Pasos disponibles</h3><div class="clist" id="cpool">${pool.map(s => `<button type="button" class="cstep" data-cs="${s.i}">${ht(s.s)}</button>`).join('') || '<p class="pnote">Todos los pasos están ordenados.</p>'}</div></div>
      <div><h3 class="ph">Tu orden</h3><ol class="clist cord" id="cord">${pick.map((s, k) => `<li><button type="button" class="cstep ${checked ? (s.i === k ? 'right' : 'wrong') : ''}" data-cp="${k}">${ht(s.s)}</button></li>`).join('') || '<li class="pnote">Todavía vacío.</li>'}</ol></div></div>
      <div class="prow"><button type="button" class="pbtn primary" id="cchk" ${pool.length || checked ? 'disabled' : ''}>Comprobar</button><button type="button" class="pbtn" id="crst">Reiniciar</button></div><div id="cfb"></div>`;
    body.querySelectorAll('[data-cs]').forEach(b => b.onclick = () => { if (checked) return; const s = pool.find(x => x.i === +b.dataset.cs); pool = pool.filter(x => x !== s); pick.push(s); draw(); });
    body.querySelectorAll('[data-cp]').forEach(b => b.onclick = () => { if (checked) return; const s = pick[+b.dataset.cp]; pick = pick.filter(x => x !== s); pool.push(s); draw(); });
    body.querySelector('#crst').onclick = () => pracCad(f, body);
    body.querySelector('#cchk').onclick = () => {
      checked = true; draw();
      const ok = pick.filter((s, k) => s.i === k).length;
      body.querySelector('#cfb').innerHTML = `<div class="pfb ${ok === steps.length ? 'ok' : 'no'}"><b>${ok} de ${steps.length} pasos en su lugar.</b>${ok === steps.length ? ' La cadena causal está completa.' : `<ol class="chain" style="margin-top:8px">${steps.map(s => `<li><span>${ht(s.s)}</span></li>`).join('')}</ol>`}</div>`;
    };
  }
  draw();
}

/* ---- Áreas ---- */
function pracAre(f, body) {
  const areas = shuf(fichaAreas(f));
  let i = 0, ok = 0;
  function q() {
    if (i >= areas.length) {
      body.innerHTML = `<div class="pfb ${ok === areas.length ? 'ok' : 'info'}"><b>${ok} de ${areas.length} áreas identificadas.</b> ${ok === areas.length ? 'Muy bien.' : 'Repasa el bloque “Áreas y sombreados” de esta ficha.'}</div><div class="prow"><button type="button" class="pbtn primary" id="aagain">Repetir</button></div>`;
      body.querySelector('#aagain').onclick = () => pracAre(f, body); return;
    }
    const a = areas[i];
    const own = fichaAreas(f).map(x => x.d).filter(d => d !== a.d);
    const others = shuf(areaPool().filter(d => d !== a.d && !own.includes(d)));
    const final = shuf([a.d].concat(shuf([...new Set(own)]).slice(0, 2), others).filter((d, k, arr) => arr.indexOf(d) === k).slice(0, 4));
    body.innerHTML = `<p class="pq">Pregunta ${i + 1} de ${areas.length}. ¿Qué representa el área <b>${ht(a.t)}</b>?</p>
      <div class="figure pfig"><div class="panels">${renderFig(f.fig).html}</div></div>
      <div class="opts">${final.map((d, k) => `<button type="button" class="popt" data-ok="${d === a.d ? 1 : 0}"><span class="l">${'ABCD'[k]}</span><span>${esc(d)}</span></button>`).join('')}</div><div id="afb"></div>`;
    body.querySelectorAll('.popt').forEach(b => b.onclick = () => {
      const r = b.dataset.ok === '1'; if (r) ok++;
      body.querySelectorAll('.popt').forEach(x => { x.disabled = true; if (x.dataset.ok === '1') x.classList.add('right'); }); if (!r) b.classList.add('wrong');
      body.querySelector('#afb').innerHTML = `<div class="pfb ${r ? 'ok' : 'no'}"><b>${r ? 'Correcto.' : 'No es correcto.'}</b> El área ${ht(a.t)} es: ${esc(a.d)}.</div><div class="prow"><button type="button" class="pbtn primary" id="anext">${i === areas.length - 1 ? 'Ver resultado' : 'Siguiente'}</button></div>`;
      body.querySelector('#anext').onclick = () => { i++; q(); };
    });
  }
  q();
}

document.addEventListener('click', e => {

function renderFicha(f) {
  const u = UNITS[f.u];
  let h = `<div class="sheet"><div class="eyebrow">${u ? u.n : 'Referencia'} · ${esc(f.st)} ${esc(f.stn)}</div><h1>${ht(f.t)}</h1>`;

    h += (f.render ? f.render() : f.html) + navHtml(f) + '</div>';

  h += `<div class="meta"><span class="chip">Ficha ${esc(f.code)}</span>${f.pr ? `<span class="chip ex">Aparece en: ${esc(f.pr)}</span>` : ''}<button type="button" class="chip go" data-scroll="practicar">Practicar este diagrama ↓</button></div>`;
  const fig = renderFig(f.fig);

    ${block('Cadena causal para la explicación', f.cad && f.cad.length ? `<ol class="chain">${f.cad.map(x => `<li><span>${ht(x)}</span></li>`).join('')}</ol>` : '')}
    ${block('⚠ Errores típicos de examen', ul(f.err), 'warn full')}

  mountPractice(f);

function navHtml(f) {
  const list = listFor(f.u);
  const i = list.indexOf(f);

  const p = list[i - 1], n = list[i + 1];
  return `<div class="nav">${p ? `<button type="button" data-id="${p.id}"><small>← Anterior · ${esc(p.code)}</small>${esc(p.t)}</button>` : '<span></span>'}${n ? `<button type="button" data-id="${n.id}" style="text-align:right"><small>${esc(n.code)} · Siguiente →</small>${esc(n.t)}</button>` : '<span></span>'}</div>`;
}

function go(id, push = true) {
  const f = BY[id] || listFor(S.unit)[0];
  S.id = f.id;
  if (f.u && UNITS[f.u]) S.unit = f.u;
  renderUnits(); renderIndex(); renderFicha(f);
  if (push) { try { history.replaceState(null, '', '#' + f.id); } catch (e) { } }
  store.set('atlas-last', f.id);
  window.scrollTo({ top: 0 });
  if (window.matchMedia('(max-width:860px)').matches) $('#idx').classList.add('closed');
}

document.addEventListener('click', e => {
  const u = e.target.closest('[data-u]');
  if (u) { S.unit = u.dataset.u; S.q = ''; $('#q').value = ''; go(listFor(S.unit)[0].id); return; }
  const b = e.target.closest('[data-id]');
  if (b) { go(b.dataset.id); return; }
  if (e.target.closest('#menu')) $('#idx').classList.toggle('closed');
});
document.addEventListener('change', e => {
  if (e.target.id === 'prac') { S.practice = e.target.checked; document.body.classList.toggle('practice', S.practice); store.set('atlas-prac', S.practice); }
  if (e.target.dataset.ck != null) {
    const k = 'atlas-ck-' + S.id, a = store.get(k, []);
    a[+e.target.dataset.ck] = e.target.checked; store.set(k, a);
    const sc = $('#ck-score'); if (sc) sc.textContent = a.filter(Boolean).length + ' de 6 criterios cumplidos';
  }
});
$('#q').addEventListener('input', e => { S.q = e.target.value; renderIndex(); $('#idx').classList.remove('closed'); });
window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (BY[id] && id !== S.id) go(id, false); });

S.practice = store.get('atlas-prac', false);
$('#prac').checked = S.practice; document.body.classList.toggle('practice', S.practice);
go(BY[location.hash.slice(1)] ? location.hash.slice(1) : (BY[store.get('atlas-last', '')] ? store.get('atlas-last', '') : MICRO[0].id), true);
</script>
</body>
</html>
