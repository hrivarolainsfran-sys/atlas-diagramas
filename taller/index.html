    const P = Plot(svg, { yl: 'Precio (miles de Gs.)', xl: 'Entradas por día' });
    const q = 100 - P0, ped = P0 / (100 - P0);
    P.rect(0, 0, q, P0, 'a-tr');
    P.line(D, 'c-d', 'D');
    P.text(34, 74, 'Elástica (EPD > 1)', 'pl'); P.text(62, 34, 'Inelástica (EPD < 1)', 'pl');
    P.dot(50, 50, 'EPD = 1', 6, -8);
    P.guide(q, P0, fmt(q), fmt(P0));
    P.dot(q, P0, '');
    $('#prv', pan).textContent = gs(P0 * 1000);
    $('#r1', pan).textContent = gs(P0 * 1000); $('#r2', pan).textContent = fmt(q);
    $('#r3', pan).textContent = gs(P0 * q * 1000); $('#r4', pan).textContent = fmt(ped, 2) + (ped > 1.0001 ? ' (elástica)' : ped < 0.9999 ? ' (inelástica)' : ' (unitaria)');
    if (prev !== null && prev !== P0) {
      const tr0 = prev * (100 - prev), tr1 = P0 * (100 - P0);
      const dir = P0 > prev ? 'Subir' : 'Bajar';
      const res = tr1 > tr0 ? 'aumenta' : tr1 < tr0 ? 'disminuye' : 'no cambia';
      const zone = (Math.min(prev, P0) >= 50) ? 'tramo elástico' : (Math.max(prev, P0) <= 50) ? 'tramo inelástico' : 'cruce del punto unitario';
      $('#msg', pan).innerHTML = `<div class="fb ${tr1 >= tr0 ? 'ok' : 'no'}">${dir} el precio de ${gs(prev * 1000)} a ${gs(P0 * 1000)}: el ingreso total <b>${res}</b> (de ${gs(tr0 * 1000)} a ${gs(tr1 * 1000)}), en el ${zone}.</div>`;
    } else if (prev === null) $('#msg', pan).innerHTML = '<div class="fb info">Baja el precio de a 5 desde arriba. Mientras la demanda sea elástica, bajar el precio aumenta el ingreso total. Pasado el punto medio, ya no.</div>';
    // gráfico de ingreso total
    const t = $('#trs', pan); t.innerHTML = '';
    const L = 52, W = 338, T = 12, H = 110, X = qq => L + qq / 100 * W, Y = v => T + H - v / 2500 * H;
    el('path', { d: `M${L},${T - 4} L${L},${T + H} L${L + W + 4},${T + H}`, class: 'ax' }, t);
    let d = ''; for (let i = 0; i <= 100; i += 2) d += (i ? 'L' : 'M') + X(i) + ',' + Y(i * (100 - i));
    el('path', { d, class: 'cv c-gold' }, t);
    el('circle', { cx: X(q), cy: Y(q * P0), r: 5, class: 'pt' }, t);
    const a = el('text', { x: L + 6, y: T + 6, class: 'axl' }, t); a.textContent = 'Ingreso total';
    const b = el('text', { x: L + W, y: T + H + 22, class: 'axl', 'text-anchor': 'end' }, t); b.textContent = 'Cantidad';
    const c = el('text', { x: X(50), y: Y(2500) + 14, class: 'tk', 'text-anchor': 'middle' }, t); c.textContent = 'máximo con EPD = 1';
  }
  const set = v => { prev = P0; P0 = Math.max(10, Math.min(90, v)); $('#pr', pan).value = P0; draw(); };
  $('#pr', pan).oninput = e => set(+e.target.value);
  $('#dn', pan).onclick = () => set(P0 - 5); $('#up', pan).onclick = () => set(P0 + 5);
  draw();
}

/* ---- impuestos y subsidios ---- */
function labTax(svg, pan, leg) {
  const S = { type: 'esp', amt: 15, bd: 1, bs: 1 };
  const EL = [['0.4', 'Elástica'], ['1', 'Intermedia'], ['2.5', 'Inelástica']];
  pan.innerHTML = `
    <div class="ctl"><span class="lbl">Medida</span>${segBtns('ty', [['esp', 'Impuesto específico'], ['adv', 'Impuesto ad valorem'], ['sub', 'Subsidio']], 'esp')}</div>
    <div class="ctl"><label for="am" id="aml"></label><input type="range" id="am" min="0" max="30" step="1" value="15"></div>
    <div class="ctl"><span class="lbl">Demanda</span>${segBtns('bd', EL, '1')}</div>
    <div class="ctl"><span class="lbl">Oferta</span>${segBtns('bs', EL, '1')}</div>
    <table class="readout" id="ro"></table><div id="note"></div>`;
  bindSeg(pan, 'ty', v => { S.type = v; const r = $('#am', pan); if (v === 'adv') { r.max = 60; r.step = 5; S.amt = 30; } else { r.max = 30; r.step = 1; S.amt = 15; } r.value = S.amt; draw(); });
  bindSeg(pan, 'bd', v => { S.bd = +v; draw(); }); bindSeg(pan, 'bs', v => { S.bs = +v; draw(); });
  $('#am', pan).oninput = e => { S.amt = +e.target.value; draw(); };
  function draw() {
    const D = { a: 50 + 50 * S.bd, b: -S.bd }, O = { a: 50 - 50 * S.bs, b: S.bs };
    const P = Plot(svg, { yl: 'Precio (miles de Gs.)', xl: 'Cantidad (miles)' });
    const q0 = 50, p0 = 50;
    let rows = [], note = '';
    $('#aml', pan).textContent = S.type === 'adv' ? `Tasa del impuesto: ${S.amt}%` : S.type === 'sub' ? `Subsidio por unidad: ${gs(S.amt * 1000)}` : `Impuesto por unidad: ${gs(S.amt * 1000)}`;
    if (S.type !== 'sub') {
      let O1, qt, pc, pp;
      if (S.type === 'esp') { O1 = { a: O.a + S.amt, b: O.b }; }
      else { const r = S.amt / 100; O1 = { a: O.a * (1 + r), b: O.b * (1 + r) }; }
      [qt, pc] = cross(D, O1); pp = lineAt(O, qt);
      const t = pc - pp;
      if (S.amt > 0) {
        P.rect(0, p0, qt, pc, 'a-con'); P.rect(0, pp, qt, p0, 'a-pro');
        P.poly([[qt, pc], [qt, pp], [q0, p0]], 'a-dwl');
      }
      P.line(D, 'c-d', 'D'); P.line(O, 'c-s', 'O'); if (S.amt > 0) P.line(O1, 'c-s', S.type === 'esp' ? 'O + impuesto' : 'O + IVA', 'end', 0);
      P.guide(q0, p0, 'Q₀', 'P₀');
      if (S.amt > 0) { P.guide(qt, pc, 'Q₁', 'Pc', { qdx: -6, pdy: -2 }); P.guide(qt, pp, null, 'Pp', { pdy: 6 }); P.dot(qt, pc, ''); }
      P.dot(q0, p0, '');
      const ci = (pc - p0) * qt, pi = (p0 - pp) * qt, rev = t * qt, dwl = t * (q0 - qt) / 2;
      const share = t > 0 ? (pc - p0) / t : 0;
      rows = [['Precio que paga el consumidor', gs(pc * 1000)], ['Precio que recibe el productor', gs(pp * 1000)], ['Cantidad', fmt(qt, 1) + ' mil'], [sw('--f-con') + 'Incidencia consumidor', fmt(ci, 0) + ' M Gs.'], [sw('--f-pro') + 'Incidencia productor', fmt(pi, 0) + ' M Gs.'], ['Recaudación total', fmt(rev, 0) + ' M Gs.'], [sw('--f-dwl') + 'Pérdida de bienestar', fmt(dwl, 0) + ' M Gs.']];
      if (S.amt > 0) note = S.bd === S.bs ? `Con elasticidades iguales, el impuesto se reparte por mitades (${fmt(share * 100, 0)}% el consumidor).` : `El consumidor paga el <b>${fmt(share * 100, 0)}%</b> del impuesto por unidad. La carga recae más sobre el lado <b>${S.bd > S.bs ? 'de la demanda (más inelástica)' : 'de la oferta (más inelástica)'}</b>.`;
    } else {
      const O1 = { a: O.a - S.amt, b: O.b };
      const [qs, pc] = cross(D, O1), pp = pc + S.amt;
      if (S.amt > 0) {
        P.rect(0, pc, qs, pp, 'a-gov');
        P.poly([[0, p0], [q0, p0], [qs, pc], [0, pc]], 'a-con');
        P.poly([[0, pp], [qs, pp], [q0, p0], [0, p0]], 'a-pro');
        P.poly([[q0, p0], [qs, pp], [qs, pc]], 'a-dwl');
      }
      P.line(D, 'c-d', 'D'); P.line(O, 'c-s', 'O'); if (S.amt > 0) P.line(O1, 'c-s', 'O + subsidio');
      P.guide(q0, p0, 'Q₀', 'P₀');
      if (S.amt > 0) { P.guide(qs, pp, null, 'Pp', { pdy: -2 }); P.guide(qs, pc, 'Q₁', 'Pc', { pdy: 6, qdx: 6 }); P.dot(qs, pc, ''); }
      P.dot(q0, p0, '');
      const cg = (p0 - pc) * (q0 + qs) / 2, pg = (pp - p0) * (q0 + qs) / 2, gov = S.amt * qs, dwl = S.amt * (qs - q0) / 2;
      rows = [['Precio que paga el consumidor', gs(pc * 1000)], ['Precio que recibe el productor (con subsidio)', gs(pp * 1000)], ['Cantidad', fmt(qs, 1) + ' mil'], [sw('--f-con') + 'Ganancia de excedente del consumidor', fmt(cg, 0) + ' M Gs.'], [sw('--f-pro') + 'Ganancia de excedente del productor', fmt(pg, 0) + ' M Gs.'], [sw('--f-gov') + 'Costo para el gobierno', fmt(gov, 0) + ' M Gs.'], [sw('--f-dwl') + 'Pérdida de bienestar', fmt(dwl, 0) + ' M Gs.']];
      if (S.amt > 0) note = `El gobierno gasta ${fmt(gov, 0)} M Gs. Consumidores y productores ganan juntos ${fmt(cg + pg, 0)} M Gs.; la diferencia es la pérdida de bienestar. Gana más el lado <b>${S.bd > S.bs ? 'de la demanda (más inelástica)' : S.bd < S.bs ? 'de la oferta (más inelástica)' : 'que sea más inelástico (aquí, en partes iguales)'}</b>.`;
    }
    $('#ro', pan).innerHTML = rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('');
    $('#note', pan).innerHTML = note ? `<div class="fb info">${note}</div>` : '';
    leg.innerHTML = S.type === 'sub' ? `<span>${sw('--f-con')}Ganancia consumidor</span><span>${sw('--f-pro')}Ganancia productor</span><span>${sw('--f-gov')}Gasto del gobierno (rectángulo)</span><span>${sw('--f-dwl')}Pérdida de bienestar</span>` : `<span>${sw('--f-con')}Incidencia consumidor</span><span>${sw('--f-pro')}Incidencia productor</span><span>${sw('--f-dwl')}Pérdida de bienestar</span><span>Recaudación = amarillo + verde</span>`;
  }
  draw();
}

/* ---- controles de precios ---- */
function labCeil(svg, pan, leg) {
  const S = { mode: 'max', p: 35 };
  const D = { a: 90, b: -0.8 }, O = { a: 10, b: 0.8 };
  pan.innerHTML = `
    <div class="ctl"><span class="lbl">Medida</span>${segBtns('md', [['max', 'Precio máximo (alquileres)'], ['min', 'Precio mínimo (salario mínimo)']], 'max')}</div>
    <div class="ctl"><label for="pv" id="pvl"></label><input type="range" id="pv" min="15" max="85" step="1" value="35"></div>
    <table class="readout" id="ro"></table><div id="note"></div>`;
  bindSeg(pan, 'md', v => { S.mode = v; S.p = v === 'max' ? 35 : 65; $('#pv', pan).value = S.p; draw(); });
  $('#pv', pan).oninput = e => { S.p = +e.target.value; draw(); };
  function draw() {
    const lab = S.mode === 'min';
    const P = Plot(svg, lab ? { yl: 'Salario', xl: 'Cantidad de trabajo' } : { yl: 'Alquiler mensual', xl: 'Departamentos' });
    const q0 = 50, p0 = 50, qd = qAt(D, S.p), qs = qAt(O, S.p);
    const binding = S.mode === 'max' ? S.p < p0 : S.p > p0;
    const qt = binding ? Math.min(qd, qs) : q0;
    if (binding) P.poly([[qt, lineAt(D, qt)], [qt, lineAt(O, qt)], [q0, p0]], 'a-dwl');
    P.line(D, 'c-d', lab ? 'D trabajo (empresas)' : 'D'); P.line(O, 'c-s', lab ? 'O trabajo (personas)' : 'O');
    P.hline(S.p, 'c-gold', S.mode === 'max' ? 'Precio máximo' : 'Salario mínimo');
    P.guide(q0, p0, 'Q₀', 'P₀', { pdy: S.p > p0 ? 8 : -2 }); P.dot(q0, p0, '');
    if (binding) {
      el('line', { x1: P.X(qd), y1: P.Y(S.p), x2: P.X(qd), y2: P.T + P.H, class: 'gd' }, P.gG);
      el('line', { x1: P.X(qs), y1: P.Y(S.p), x2: P.X(qs), y2: P.T + P.H, class: 'gd' }, P.gG);
      P.text(qd, -0.1, lab ? 'Qd' : 'Qd', 'tk', 'middle').setAttribute('y', P.T + P.H + 16);
      P.text(qs, -0.1, lab ? 'Qo' : 'Qo', 'tk', 'middle').setAttribute('y', P.T + P.H + 16);
      const yb = S.mode === 'max' ? S.p - 6 : S.p + 4;
      P.arrow(Math.min(qd, qs) + 1, yb, Math.max(qd, qs) - 1, yb);
      P.text((qd + qs) / 2, yb + (S.mode === 'max' ? -3 : 3), S.mode === 'max' ? 'escasez' : (lab ? 'desempleo' : 'excedente'), 'pl', 'middle');
    }
    $('#pvl', pan).textContent = (S.mode === 'max' ? 'Precio máximo: ' : 'Salario mínimo: ') + gs(S.p * (lab ? 50000 : 40000));
    const unit = lab ? 'mil trabajadores' : 'cientos';
    $('#ro', pan).innerHTML = [['Precio de equilibrio', gs(p0 * (lab ? 50000 : 40000))], ['Cantidad demandada', fmt(qd, 1) + ' ' + unit], ['Cantidad ofrecida', fmt(qs, 1) + ' ' + unit], [S.mode === 'max' ? 'Escasez (Qd − Qo)' : (lab ? 'Desempleo (Qo − Qd)' : 'Excedente'), binding ? fmt(Math.abs(qd - qs), 1) + ' ' + unit : '—'], ['Cantidad intercambiada', fmt(qt, 1) + ' ' + unit]].map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('');
    $('#note', pan).innerHTML = `<div class="fb ${binding ? 'info' : 'no'}">${!binding ? `<b class="h">No vinculante</b>${S.mode === 'max' ? 'El tope está por encima del equilibrio: el mercado ya cobra menos, así que no cambia nada.' : 'El piso está por debajo del equilibrio: el mercado ya paga más, así que no cambia nada.'}` : S.mode === 'max' ? 'Ganan quienes consiguen alquilar más barato; pierden quienes quedan sin vivienda y los propietarios. Riesgos: listas de espera, alquileres “por debajo de la mesa” y menos mantenimiento. El triángulo azul es la pérdida de bienestar.' : 'Ganan quienes conservan el empleo con un salario mayor; pierden quienes quedan sin trabajo. El efecto real depende de la elasticidad de la demanda de trabajo y de cuánto supera el salario mínimo al de equilibrio.'}</div>`;
    leg.innerHTML = `<span><span class="sw" style="background:var(--gold)"></span>${S.mode === 'max' ? 'Precio máximo' : 'Salario mínimo'}</span><span>${sw('--f-dwl')}Pérdida de bienestar</span>`;
  }
  draw();
}

/* ---- externalidades ---- */
const EXT_T = [
  { n: 'Negativa de producción', ex: 'Una curtiembre vierte residuos en un arroyo.', fix: 'Impuesto sobre la contaminación (pigouviano), permisos negociables o regulación de emisiones.', res: 'sobreasignación', curve: 'CMS por encima de CMP' },
  { n: 'Negativa de consumo', ex: 'Fumar en una parada de colectivo.', fix: 'Impuesto selectivo, prohibición de fumar en lugares públicos, campañas de información.', res: 'sobreasignación', curve: 'BMS por debajo de BMP' },
  { n: 'Positiva de producción', ex: 'Un apicultor cuyas abejas polinizan los cultivos vecinos.', fix: 'Subsidio a los productores o provisión directa.', res: 'subasignación', curve: 'CMS por debajo de CMP' },
  { n: 'Positiva de consumo', ex: 'Vacunarse contra la influenza.', fix: 'Subsidio, provisión gratuita, campañas de información u obligatoriedad.', res: 'subasignación', curve: 'BMS por encima de BMP' }
];
const EXT_CASES = [
  ['Una curtiembre vierte residuos en un arroyo de Limpio.', 0], ['Quema de pastizales para limpiar campos.', 0], ['Una fábrica de cemento genera polvo sobre las casas vecinas.', 0],
  ['Fumar en una parada de colectivo.', 1], ['Escuchar música a todo volumen en la calle de madrugada.', 1], ['Tirar botellas plásticas al arroyo después de tomar una gaseosa.', 1],
  ['Un apicultor cuyas abejas polinizan los cultivos vecinos.', 2], ['Una empresa capacita técnicos que luego trabajan en otras firmas.', 2], ['Una fábrica construye un camino que también usan los vecinos.', 2],
  ['Vacunarse contra la influenza.', 3], ['Completar la educación secundaria.', 3], ['Eliminar criaderos de mosquitos del dengue en el patio.', 3]
];
function labExt(svg, pan, leg) {
  const S = { k: 0, fix: false, ch: null, chAns: null };
  const st = PROG.labs.ext = PROG.labs.ext || { ok: 0, n: 0 };
  pan.innerHTML = `
    <div class="ctl"><span class="lbl">Tipo de externalidad</span>${segBtns('ek', EXT_T.map((t, k) => [String(k), t.n]), '0')}</div>
    <label class="row small" for="fx" style="gap:8px;cursor:pointer"><input type="checkbox" id="fx"> Mostrar la intervención del gobierno</label>
    <div id="exp"></div>
    <div class="ctl"><span class="lbl">Desafío</span><div class="scen"><div class="mk">¿Qué tipo de externalidad es?</div><p id="cs"></p></div>
      <div class="opts" id="co" style="margin-top:8px"></div><div id="cfb"></div>
      <div class="row" style="margin-top:8px"><button class="btn sm" type="button" id="cn">Otro caso</button><span class="score" id="sco"></span></div></div>`;
  bindSeg(pan, 'ek', v => { S.k = +v; draw(); });
  $('#fx', pan).onchange = e => { S.fix = e.target.checked; draw(); };
  function draw() {
    const k = S.k, h = 24;
    const D = { a: 80, b: -0.6 }, O = { a: 10, b: 0.6 };
    let CMS = O, BMS = D;
    if (k === 0) CMS = { a: O.a + h, b: O.b }; if (k === 1) BMS = { a: D.a - h, b: D.b };
    if (k === 2) CMS = { a: O.a - h, b: O.b }; if (k === 3) BMS = { a: D.a + h, b: D.b };
    const P = Plot(svg, { yl: 'Costos y beneficios', xl: 'Cantidad' });
    const [qm, pm] = cross(D, O), [qs, ps] = cross(BMS, CMS);
    // triángulo de pérdida de bienestar
    if (k === 0) P.poly([[qs, ps], [qm, lineAt(CMS, qm)], [qm, pm]], 'a-dwl');
    if (k === 1) P.poly([[qs, ps], [qm, pm], [qm, lineAt(BMS, qm)]], 'a-dwl');
    if (k === 2) P.poly([[qm, pm], [qm, lineAt(CMS, qm)], [qs, ps]], 'a-dwl');
    if (k === 3) P.poly([[qm, lineAt(BMS, qm)], [qm, pm], [qs, ps]], 'a-dwl');
    P.line(D, 'c-d', k === 1 || k === 3 ? 'D = BMP' : 'D = BMP = BMS');
    P.line(O, 'c-s', k === 0 || k === 2 ? 'O = CMP' : 'O = CMP = CMS');
    if (k === 0 || k === 2) P.line(CMS, 'c-soc', 'CMS');
    if (k === 1 || k === 3) P.line(BMS, 'c-soc', 'BMS');
    P.guide(qm, pm, 'Qm', 'Pm', { qdx: qm < qs ? -8 : 8 }); P.guide(qs, ps, 'Q*', 'P*', { qdx: qm < qs ? 8 : -8, pdy: Math.abs(ps - pm) < 5 ? (ps > pm ? -6 : 8) : 0 });
    P.dot(qm, pm, ''); P.dot(qs, ps, '');
    if (S.fix) {
      // la intervención lleva al mercado a Q*
      let nl;
      if (k === 0) nl = { a: CMS.a, b: CMS.b };
      else if (k === 1) nl = { a: lineAt(D, qs) - O.b * qs, b: O.b }; // impuesto: oferta sube hasta cortar D en Q*
      else if (k === 2) nl = { a: CMS.a, b: CMS.b };
      else nl = { a: lineAt(D, qs) - O.b * qs, b: O.b }; // subsidio: oferta baja hasta cortar D en Q*
      P.line(nl, 'c-new', k === 1 ? 'O + impuesto' : k === 3 ? 'O + subsidio' : null);
      if (k === 0 || k === 2) P.text(qs, ps, k === 0 ? 'O + impuesto = CMS' : 'O + subsidio = CMS', 'pl t-new', 'end').setAttribute('dy', k === 0 ? '-12' : '20');
      const [qn, pn] = cross(D, nl); P.dot(qn, pn, '');
    }
    const T = EXT_T[k];
    $('#exp', pan).innerHTML = `<div class="fb info"><b class="h">${T.n}</b>Ejemplo: ${T.ex}<br>${T.curve}. El mercado produce Qm y lo óptimo es Q*: hay <b>${T.res}</b> de recursos y pérdida de bienestar (triángulo azul).${S.fix ? `<br><b>Intervención:</b> ${T.fix} En el diagrama, la nueva curva lleva la cantidad a Q*.` : ''}</div>`;
    leg.innerHTML = `<span><span class="sw" style="background:var(--k-d)"></span>BMP (demanda)</span><span><span class="sw" style="background:var(--k-s)"></span>CMP (oferta)</span><span><span class="sw" style="background:var(--k-soc)"></span>Curva social</span><span>${sw('--f-dwl')}Pérdida de bienestar</span>${S.fix ? '<span><span class="sw" style="background:var(--k-new)"></span>Con intervención</span>' : ''}`;
  }
  function newCase() {
    let c; do { c = pick(EXT_CASES); } while (S.ch && c[0] === S.ch[0]);
    S.ch = c; $('#cs', pan).textContent = c[0]; $('#cfb', pan).innerHTML = '';
    $('#co', pan).innerHTML = EXT_T.map((t, k) => `<button class="opt" type="button" data-k="${k}"><span class="l">${'ABCD'[k]}</span><span>${t.n}</span></button>`).join('');
    pan.querySelectorAll('#co .opt').forEach(b => b.onclick = () => {
      const k = +b.dataset.k, right = k === S.ch[1];
      pan.querySelectorAll('#co .opt').forEach(x => { x.disabled = true; if (+x.dataset.k === S.ch[1]) x.classList.add('right'); });
      if (!right) b.classList.add('wrong');
      st.n++; if (right) st.ok++; saveProg();
      $('#cfb', pan).innerHTML = `<div class="fb ${right ? 'ok' : 'no'}"><b class="h">${right ? 'Correcto' : 'No es correcto'}</b>Es una externalidad ${EXT_T[S.ch[1]].n.toLowerCase()}. El diagrama ya muestra ese caso.</div>`;
      S.k = S.ch[1]; pan.querySelectorAll('#ek button').forEach(x => x.setAttribute('aria-pressed', String(+x.dataset.v === S.k))); draw();
      $('#sco', pan).textContent = `Aciertos: ${st.ok}/${st.n}`;
    });
    $('#sco', pan).textContent = `Aciertos: ${st.ok}/${st.n}`;
  }
  $('#cn', pan).onclick = newCase;
  draw(); newCase();
}

/* =============== examen rápido =============== */
const EX = { sel: TOPICS.map(t => t.id), qs: null, i: 0, ans: [], n: 10 };
function renderExam() {
  if (EX.qs && EX.i < EX.qs.length) return examQ();
  if (EX.qs && EX.i >= EX.qs.length) return examResult();
  app.innerHTML = `<div class="eyebrow">Autoevaluación</div><h1>Examen rápido</h1>
    <p class="lede">Preguntas al azar de los subtemas que elijas. No verás la corrección hasta el final, como en una prueba. Los cálculos tienen datos nuevos en cada intento.</p>
    <div class="essentials" style="display:grid;gap:14px">
      <div><span class="lbl muted small" style="font-weight:700;letter-spacing:.06em;text-transform:uppercase">Unidades</span><div class="choice-chips" id="uc" style="margin-top:6px">${Object.keys(UNITS).map(u => { const ids = TOPICS.filter(t => t.u === +u).map(t => t.id); const on = ids.every(i => EX.sel.includes(i)); return `<button type="button" data-u="${u}" aria-pressed="${on}">Unidad ${u} · ${UNITS[u]}</button>`; }).join('')}</div></div>
      <div><span class="lbl muted small" style="font-weight:700;letter-spacing:.06em;text-transform:uppercase">Subtemas</span><div class="choice-chips" id="tc" style="margin-top:6px">${TOPICS.map(t => `<button type="button" data-id="${t.id}" aria-pressed="${EX.sel.includes(t.id)}">${t.code || t.id}</button>`).join('')}</div></div>
      <div><span class="lbl muted small" style="font-weight:700;letter-spacing:.06em;text-transform:uppercase">Cantidad de preguntas</span><div style="margin-top:6px">${segBtns('nq', [['5', '5'], ['10', '10'], ['15', '15']], String(EX.n))}</div></div>
      <div class="row"><button class="btn primary" type="button" id="go">Comenzar</button>${PROG.exam ? `<span class="muted small">Mejor resultado: ${PROG.exam.best} de ${PROG.exam.of}</span>` : ''}</div>
    </div>`;
  app.querySelectorAll('#tc button').forEach(b => b.onclick = () => { const id = b.dataset.id; EX.sel = EX.sel.includes(id) ? EX.sel.filter(x => x !== id) : EX.sel.concat(id); renderExam(); });
  app.querySelectorAll('#uc button').forEach(b => b.onclick = () => { const ids = TOPICS.filter(t => t.u === +b.dataset.u).map(t => t.id); const on = ids.every(i => EX.sel.includes(i)); EX.sel = on ? EX.sel.filter(x => !ids.includes(x)) : [...new Set(EX.sel.concat(ids))]; renderExam(); });
  $('#go').disabled = !EX.sel.length;
  bindSeg(app, 'nq', v => EX.n = +v);
  $('#go').onclick = () => {
    const pool = [];
    TOPICS.filter(t => EX.sel.includes(t.id)).forEach(t => t.items.forEach(it => { if (it.t !== 'sort') pool.push([t.id, it]); }));
    EX.qs = shuffle(pool).slice(0, EX.n).map(([id, it]) => {
      let q = it.t === 'gen' ? Object.assign({ t: 'gen' }, GEN[it.g](it.arg)) : it.t === 'genmc' ? GEN[it.g]() : it;
      return { id, q };
    });
    EX.i = 0; EX.ans = []; examQ();
  };
}
function examQ() {
  const { id, q } = EX.qs[EX.i];
  app.innerHTML = `<div class="eyebrow">Examen rápido · Subtema ${tcode(id)}</div><h2 style="margin-top:4px">Pregunta ${EX.i + 1} de ${EX.qs.length}</h2>
    <div class="bar" style="max-width:820px;margin:8px 0 16px"><i style="width:${EX.i / EX.qs.length * 100}%"></i></div>
    <div class="card"><div class="card-b" id="eb"></div><div class="card-f"><button class="btn sm" type="button" id="quit">Abandonar</button><button class="btn primary" type="button" id="nx" disabled>${EX.i === EX.qs.length - 1 ? 'Ver resultados' : 'Siguiente →'}</button></div></div>`;
  const host = $('#eb');
  let cur = null;
  if (q.t === 'mc') mountMC(host, q, null, 0, () => { }, { exam: k => { cur = k; $('#nx').disabled = false; } });
  else mountGen(host, q, () => { }, () => { }, { exam: v => { cur = v; $('#nx').disabled = !String(v).trim(); } });
  $('#quit').onclick = () => { EX.qs = null; renderExam(); };
  $('#nx').onclick = () => { EX.ans[EX.i] = cur; EX.i++; window.scrollTo(0, 0); EX.i < EX.qs.length ? examQ() : examResult(); };
}
function examResult() {
  let ok = 0;
  const rev = EX.qs.map(({ id, q }, k) => {
    const a = EX.ans[k];
    let right, yours, corr;
    if (q.t === 'mc') { right = a === q.a; yours = a == null ? '—' : q.o[a]; corr = q.o[q.a]; }
    else { const v = parseNum(a); right = !isNaN(v) && Math.abs(v - q.ans) <= (q.tol || 0) + 1e-9; yours = a || '—'; corr = fmt(q.ans, Number.isInteger(q.ans) ? 0 : 2) + ' ' + (q.unit || ''); }
    if (right) ok++;
    return `<div class="it ${right ? '' : 'no'}"><div class="muted small">${tcode(id)} · ${right ? 'Correcta' : 'Incorrecta'}</div><div style="margin:4px 0">${q.q}</div>${right ? '' : `<div>Tu respuesta: ${esc(yours)}</div>`}<div><b>Respuesta correcta:</b> ${corr}</div><div class="small muted" style="margin-top:4px">${q.t === 'mc' ? (q.e || '') : q.sol}</div></div>`;
  });
  const n = EX.qs.length;
  if (!PROG.exam || ok / n > PROG.exam.best / PROG.exam.of) { PROG.exam = { best: ok, of: n }; saveProg(); }
  const band = ok / n >= .85 ? 'Excelente dominio.' : ok / n >= .6 ? 'Buen nivel: repasa las incorrectas.' : 'Conviene volver a “Lo esencial” de los subtemas con errores.';
  app.innerHTML = `<div class="eyebrow">Examen rápido · Resultado</div><h1>${ok} de ${n}</h1><p class="lede">${band}</p>
    <div class="row" style="margin-bottom:18px"><button class="btn primary" type="button" id="again">Hacer otro examen</button><button class="btn" type="button" data-go="inicio">Volver a los temas</button></div>
    <div class="review">${rev.join('')}</div>`;
  $('#again').onclick = () => { EX.qs = null; renderExam(); };
}

/* =============== tarjetas =============== */
const FC = { f: 0, order: null, i: 0, flip: false };
function renderCards() {
  const list = CARDS.map((c, k) => k).filter(k => !FC.f || CARDS[k][0] === FC.f);
  if (!FC.order || FC.order.some(k => !list.includes(k)) || FC.order.length !== list.length) { FC.order = list; FC.i = 0; }
  const k = FC.order[FC.i], c = CARDS[k];
  const known = PROG.known.filter(x => list.includes(x)).length;
  app.innerHTML = `<div class="eyebrow">Repaso de conceptos</div><h1>Tarjetas</h1>
    <p class="lede">Lee el concepto, intenta definirlo en voz alta y luego da vuelta la tarjeta.</p>
    <div class="row" style="margin-bottom:14px">${segBtns('ff', [['0', 'Todas'], ['1', 'Unidad 1'], ['2', 'Unidad 2'], ['3', 'Unidad 3'], ['4', 'Unidad 4']], String(FC.f))}<button class="btn sm" type="button" id="mix">Mezclar</button><span class="muted small">Ya las sé: ${known} de ${list.length}</span></div>
    <button class="flash" type="button" id="card" aria-live="polite">
      <span class="cue">${FC.flip ? 'Definición' : 'Unidad ' + c[0] + ' · Toca para ver la definición'}</span>
      <span class="term">${c[1]}</span>${FC.flip ? `<span class="def">${c[2]}</span>` : ''}
    </button>
    <div class="row" style="margin-top:14px;max-width:620px;justify-content:space-between">
      <span class="muted small" style="font-variant-numeric:tabular-nums">${FC.i + 1} / ${FC.order.length}${PROG.known.includes(k) ? ' · ✓ la sé' : ''}</span>
      <div class="row"><button class="btn sm" type="button" id="pv">← Anterior</button><button class="btn sm" type="button" id="rv">Repasar más</button><button class="btn sm primary" type="button" id="kn">La sé →</button></div>
    </div>`;
  bindSeg(app, 'ff', v => { FC.f = +v; FC.order = null; FC.flip = false; renderCards(); });
  $('#card').onclick = () => { FC.flip = !FC.flip; renderCards(); };
  $('#mix').onclick = () => { FC.order = shuffle(FC.order); FC.i = 0; FC.flip = false; renderCards(); };
  const nxt = () => { FC.i = (FC.i + 1) % FC.order.length; FC.flip = false; renderCards(); };
  $('#pv').onclick = () => { FC.i = (FC.i - 1 + FC.order.length) % FC.order.length; FC.flip = false; renderCards(); };
  $('#rv').onclick = () => { PROG.known = PROG.known.filter(x => x !== k); saveProg(); nxt(); };
  $('#kn').onclick = () => { if (!PROG.known.includes(k)) PROG.known.push(k); saveProg(); nxt(); };
}

render();
</script>

</body>
</html>
