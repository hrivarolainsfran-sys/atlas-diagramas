  { n: 'Positiva de consumo', ex: 'Vacunarse contra la influenza.', fix: 'Subsidio, provisión gratuita, campañas de información u obligatoriedad.', res: 'subasignación', curve: 'BMS por encima de BMP' }
];
const EXT_CASES = [
  ['Una curtiembre vierte residuos en un arroyo de Limpio.', 0], ['Quema de pastizales para limpiar campos.', 0], ['Una fábrica de cemento genera polvo sobre las casas vecinas.', 0],
  ['Fumar en una parada de colectivo.', 1], ['Escuchar música a todo volumen en la calle de madrugada.', 1], ['Tirar botellas plásticas al arroyo después de tomar una gaseosa.', 1],
  ['Un apicultor cuyas abejas polinizan los cultivos vecinos.', 2], ['Una empresa capacita técnicos que luego trabajan en otras firmas.', 2], ['Una fábrica construye un camino que también usan los vecinos.', 2],
  ['Vacunarse contra la influenza.', 3], ['Completar la educación secundaria.', 3], ['Eliminar criaderos de mosquitos del dengue en el patio.', 3]
];
function labExt(svg, pan, leg) {
  const S = { k: 0, fix: false, ch: null, chAns: null };
  const st = PROG.labs.ext = PROG.labs.ext || { ok: 0, n: 0 };
  pan.innerHTML = `
    <div class="ctl"><span class="lbl">Tipo de externalidad</span>${segBtns('ek', EXT_T.map((t, k) => [String(k), t.n]), '0')}</div>
    <label class="row small" for="fx" style="gap:8px;cursor:pointer"><input type="checkbox" id="fx"> Mostrar la intervención del gobierno</label>
    <div id="exp"></div>
    <div class="ctl"><span class="lbl">Desafío</span><div class="scen"><div class="mk">¿Qué tipo de externalidad es?</div><p id="cs"></p></div>
      <div class="opts" id="co" style="margin-top:8px"></div><div id="cfb"></div>
      <div class="row" style="margin-top:8px"><button class="btn sm" type="button" id="cn">Otro caso</button><span class="score" id="sco"></span></div></div>`;
  bindSeg(pan, 'ek', v => { S.k = +v; draw(); });
  $('#fx', pan).onchange = e => { S.fix = e.target.checked; draw(); };
  function draw() {
    const k = S.k, h = 24;
    const D = { a: 80, b: -0.6 }, O = { a: 10, b: 0.6 };
    let CMS = O, BMS = D;
    if (k === 0) CMS = { a: O.a + h, b: O.b }; if (k === 1) BMS = { a: D.a - h, b: D.b };
    if (k === 2) CMS = { a: O.a - h, b: O.b }; if (k === 3) BMS = { a: D.a + h, b: D.b };
    const P = Plot(svg, { yl: 'Costos y beneficios', xl: 'Cantidad' });
    const [qm, pm] = cross(D, O), [qs, ps] = cross(BMS, CMS);
    // triángulo de pérdida de bienestar
    if (k === 0) P.poly([[qs, ps], [qm, lineAt(CMS, qm)], [qm, pm]], 'a-dwl');
    if (k === 1) P.poly([[qs, ps], [qm, pm], [qm, lineAt(BMS, qm)]], 'a-dwl');
    if (k === 2) P.poly([[qm, pm], [qm, lineAt(CMS, qm)], [qs, ps]], 'a-dwl');
    if (k === 3) P.poly([[qm, lineAt(BMS, qm)], [qm, pm], [qs, ps]], 'a-dwl');
    P.line(D, 'c-d', k === 1 || k === 3 ? 'D = BMP' : 'D = BMP = BMS');
    P.line(O, 'c-s', k === 0 || k === 2 ? 'O = CMP' : 'O = CMP = CMS');
    if (k === 0 || k === 2) P.line(CMS, 'c-soc', 'CMS');
    if (k === 1 || k === 3) P.line(BMS, 'c-soc', 'BMS');
    P.guide(qm, pm, 'Qm', 'Pm', { qdx: qm < qs ? -8 : 8 }); P.guide(qs, ps, 'Q*', 'P*', { qdx: qm < qs ? 8 : -8, pdy: Math.abs(ps - pm) < 5 ? (ps > pm ? -6 : 8) : 0 });
    P.dot(qm, pm, ''); P.dot(qs, ps, '');
    if (S.fix) {
      // la intervención lleva al mercado a Q*
      let nl;
      if (k === 0) nl = { a: CMS.a, b: CMS.b };
      else if (k === 1) nl = { a: lineAt(D, qs) - O.b * qs, b: O.b }; // impuesto: oferta sube hasta cortar D en Q*
      else if (k === 2) nl = { a: CMS.a, b: CMS.b };
      else nl = { a: lineAt(D, qs) - O.b * qs, b: O.b }; // subsidio: oferta baja hasta cortar D en Q*
      P.line(nl, 'c-new', k === 1 ? 'O + impuesto' : k === 3 ? 'O + subsidio' : null);
      if (k === 0 || k === 2) P.text(qs, ps, k === 0 ? 'O + impuesto = CMS' : 'O + subsidio = CMS', 'pl t-new', 'end').setAttribute('dy', k === 0 ? '-12' : '20');
      const [qn, pn] = cross(D, nl); P.dot(qn, pn, '');
    }
    const T = EXT_T[k];
    $('#exp', pan).innerHTML = `<div class="fb info"><b class="h">${T.n}</b>Ejemplo: ${T.ex}<br>${T.curve}. El mercado produce Qm y lo óptimo es Q*: hay <b>${T.res}</b> de recursos y pérdida de bienestar (triángulo azul).${S.fix ? `<br><b>Intervención:</b> ${T.fix} En el diagrama, la nueva curva lleva la cantidad a Q*.` : ''}</div>`;
    leg.innerHTML = `<span><span class="sw" style="background:var(--k-d)"></span>BMP (demanda)</span><span><span class="sw" style="background:var(--k-s)"></span>CMP (oferta)</span><span><span class="sw" style="background:var(--k-soc)"></span>Curva social</span><span>${sw('--f-dwl')}Pérdida de bienestar</span>${S.fix ? '<span><span class="sw" style="background:var(--k-new)"></span>Con intervención</span>' : ''}`;
  }
  function newCase() {
    let c; do { c = pick(EXT_CASES); } while (S.ch && c[0] === S.ch[0]);
    S.ch = c; $('#cs', pan).textContent = c[0]; $('#cfb', pan).innerHTML = '';
    $('#co', pan).innerHTML = EXT_T.map((t, k) => `<button class="opt" type="button" data-k="${k}"><span class="l">${'ABCD'[k]}</span><span>${t.n}</span></button>`).join('');
    pan.querySelectorAll('#co .opt').forEach(b => b.onclick = () => {
      const k = +b.dataset.k, right = k === S.ch[1];
      pan.querySelectorAll('#co .opt').forEach(x => { x.disabled = true; if (+x.dataset.k === S.ch[1]) x.classList.add('right'); });
      if (!right) b.classList.add('wrong');
      st.n++; if (right) st.ok++; saveProg();
      $('#cfb', pan).innerHTML = `<div class="fb ${right ? 'ok' : 'no'}"><b class="h">${right ? 'Correcto' : 'No es correcto'}</b>Es una externalidad ${EXT_T[S.ch[1]].n.toLowerCase()}. El diagrama ya muestra ese caso.</div>`;
      S.k = S.ch[1]; pan.querySelectorAll('#ek button').forEach(x => x.setAttribute('aria-pressed', String(+x.dataset.v === S.k))); draw();
      $('#sco', pan).textContent = `Aciertos: ${st.ok}/${st.n}`;
    });
    $('#sco', pan).textContent = `Aciertos: ${st.ok}/${st.n}`;
  }
  $('#cn', pan).onclick = newCase;
  draw(); newCase();
}

  $('#go').disabled = !EX.sel.length;

function examQ() {
  const { id, q } = EX.qs[EX.i];
  app.innerHTML = `<div class="eyebrow">Examen rápido · Subtema ${tcode(id)}</div><h2 style="margin-top:4px">Pregunta ${EX.i + 1} de ${EX.qs.length}</h2>

  const host = $('#eb');
  let cur = null;
  if (q.t === 'mc') mountMC(host, q, null, 0, () => { }, { exam: k => { cur = k; $('#nx').disabled = false; } });
  else mountGen(host, q, () => { }, () => { }, { exam: v => { cur = v; $('#nx').disabled = !String(v).trim(); } });

function examResult() {
  let ok = 0;
  const rev = EX.qs.map(({ id, q, idx }, k) => {
    const a = EX.ans[k];
    let right, yours, corr;
    if (q.t === 'mc') { right = a === q.a; yours = a == null ? '—' : q.o[a]; corr = q.o[q.a]; }
    else { const v = parseNum(a); right = !isNaN(v) && Math.abs(v - q.ans) <= (q.tol || 0) + 1e-9; yours = a || '—'; corr = fmt(q.ans, Number.isInteger(q.ans) ? 0 : 2) + ' ' + (q.unit || ''); }
    if (right) ok++;
    logResult(id, idx, right);
    return `<div class="it ${right ? '' : 'no'}"><div class="muted small">${tcode(id)} · ${right ? 'Correcta' : 'Incorrecta'}</div><div style="margin:4px 0">${q.q}</div>${right ? '' : `<div>Tu respuesta: ${esc(yours)}</div>`}<div><b>Respuesta correcta:</b> ${corr}</div><div class="small muted" style="margin-top:4px">${q.t === 'mc' ? (q.e || '') : q.sol}</div></div>`;
  });
  const n = EX.qs.length;
  if (!PROG.exam || ok / n > PROG.exam.best / PROG.exam.of) { PROG.exam = { best: ok, of: n }; saveProg(); }
  const band = ok / n >= .85 ? 'Excelente dominio.' : ok / n >= .6 ? 'Buen nivel: repasa las incorrectas.' : 'Conviene volver a “Lo esencial” de los subtemas con errores.';
  app.innerHTML = `<div class="eyebrow">Examen rápido · Resultado</div><h1>${ok} de ${n}</h1><p class="lede">${band}</p>
    <div class="row" style="margin-bottom:18px"><button class="btn primary" type="button" id="again">Hacer otro examen</button><button class="btn" type="button" data-go="inicio">Volver a los temas</button></div>
    <div class="review">${rev.join('')}</div>`;
  $('#again').onclick = () => { EX.qs = null; renderExam(); };
}

      <div><h3 class="ph">Tu orden</h3><ol class="clist cord">${pick.map((s, k) => `<li><button type="button" class="cstep ${checked ? (s.i === k ? 'right' : 'wrong') : ''}" data-cp="${k}">${esc(s.s)}</button></li>`).join('') || '<li class="small muted nob">Toca los eslabones en orden.</li>'}</ol></div></div>

    host.querySelectorAll('[data-cs]').forEach(x => x.onclick = () => { if (checked) return; const s = pool.find(y => y.i === +x.dataset.cs); pool = pool.filter(y => y !== s); pick.push(s); draw(); });

    const ck = $('#ock', host), rs = $('#ors', host);
    if (rs) rs.onclick = () => { pool = shuffle(S); pick = []; checked = false; draw(); };
    if (ck) ck.onclick = () => { checked = true; const ok = pick.every((s, k) => s.i === k); draw(); if (!ok) { $('#ofb', host).innerHTML = '<div class="fb no">Hay eslabones fuera de lugar (en rojo). Recuerda: causa → mecanismo → desplazamiento → nuevo equilibrio.</div>'; const r2 = $('#ors', host); if (r2) r2.onclick = () => { pool = shuffle(S); pick = []; checked = false; draw(); }; } onDone(ok); };
  }
  draw();
}

/* ---- Evaluar ---- */
const EVA_STEPS = ['Pros y contras', 'Plazo y partes interesadas', 'Párrafo F-E-I-J', 'Elegir la conclusión', 'Escribir y revisar'];
const FOCUS = '<div class="focus"><b>Enfoca tu evaluación en tres dimensiones de CLASPP:</b> <span>Pros y contras</span><span>Corto y largo plazo</span><span>Partes interesadas</span></div>';
function renderEval(c) {
  const W = evaState(c), save = () => wset(c.id, W);
  const kind = c.u <= 2 ? 'micro' : 'macro';
  const doneFlags = [W.s1 === true, W.s2 === true, W.s3 === true, W.s4 === true, W.done];
  app.innerHTML = `<button class="crumb" type="button" data-go="escribir-evaluar">← Preguntas de «Evaluar»</button>
    <div class="eyebrow" style="margin-top:12px">${uLabel(c.u)} · Subtema ${tcode(c.st)} · 15 puntos</div>
    <h2 class="qtitle">${esc(c.q)}</h2>
    ${FOCUS}
    ${stepper(EVA_STEPS, W.step, doneFlags)}
    <div class="card wcard"><div class="card-b" id="wb"></div>
    <div class="card-f"><button class="btn sm" type="button" id="wp" ${W.step === 0 ? 'disabled' : ''}>← Anterior</button><button class="btn primary" type="button" id="wn">${W.step === EVA_STEPS.length - 1 ? 'Volver a las preguntas' : 'Siguiente paso →'}</button></div></div>`;
  ejDrawer(app, { sts: [c.st], txt: c.q, mix: 1, note: 'Un ejemplo real desarrollado respalda la <b>explicación</b> de un factor en tu párrafo F-E-I-J y te acerca a las bandas altas.' });
  app.querySelectorAll('[data-step]').forEach(b => b.onclick = () => { W.step = +b.dataset.step; save(); renderEval(c); });
  $('#wp').onclick = () => { W.step--; save(); renderEval(c); window.scrollTo(0, 0); };
  $('#wn').onclick = () => { if (W.step === EVA_STEPS.length - 1) return go('escribir-evaluar'); W.step++; save(); renderEval(c); window.scrollTo(0, 0); };
  const b = $('#wb');
  const after = (key, ok) => { W[key] = ok; save(); };
  if (W.step === 0) {
    mountSort(b, { q: '<b>Pros y contras.</b> Clasifica cada argumento: ¿apoya la eficacia de la política (pro) o la limita (contra)?', bins: ['Pros', 'Contras'], items: c.args.map(a => [a[0], a[1] === 'pro' ? 0 : 1]), e: 'Una evaluación equilibrada necesita pros y contras antes del juicio final.' }, null, 0, ok => after('s1', ok));
  } else if (W.step === 1) {
    const bins = ['Corto y largo plazo', 'Partes interesadas', 'Otra dimensión'];
    mountSort(b, { q: '<b>Corto y largo plazo · Partes interesadas.</b> ¿Qué mira cada argumento: el plazo, quién gana o pierde, u otra dimensión (supuestos, prioridades, contexto)?', bins, items: c.args.map(a => [a[0], a[2] === 'L' ? 0 : a[2] === 'S' ? 1 : 2]), e: 'En tu respuesta, desarrolla en párrafos propios los pros y contras, el corto y el largo plazo, y las partes interesadas. Las otras dimensiones sirven como apoyo dentro de esos párrafos.' }, null, 0, ok => after('s2', ok));
  } else if (W.step === 2) {
    mountSort(b, { q: 'Arma un párrafo de evaluación: ubica cada oración en su parte de F-E-I-J.', bins: ['Factor', 'Explicación', 'Implicación', 'Juicio'], items: c.feij.map((s, i) => [s, i]), e: `<br><b>Párrafo completo:</b> <i>Sin embargo, ${c.feij[0].charAt(0).toLowerCase() + c.feij[0].slice(1)} ${c.feij.slice(1).join(' ')}</i>` }, null, 0, ok => after('s3', ok));
  } else if (W.step === 3) {
    const perm = shuffle(c.concl.map((_, i) => i));
    b.innerHTML = `<p class="q">¿Cuál es la <b>mejor conclusión</b> para esta evaluación?</p><div class="opts">${perm.map((k, j) => `<button class="opt" type="button" data-k="${k}"><span class="l">${'ABCD'[j]}</span><span>${esc(c.concl[k][0])}</span></button>`).join('')}</div><div id="fbx"></div>`;
    b.querySelectorAll('.opt').forEach(x => x.onclick = () => {
      const k = +x.dataset.k, ok = !!c.concl[k][1];
      b.querySelectorAll('.opt').forEach(y => { y.disabled = true; if (c.concl[+y.dataset.k][1]) y.classList.add('right'); });
      if (!ok) x.classList.add('wrong');
      $('#fbx').innerHTML = `<div class="fb ${ok ? 'ok' : 'no'}"><b class="h">${ok ? 'Correcto' : 'No es la mejor'}</b>${c.concl[k][2]}${ok ? '' : '<div class="row" style="margin-top:8px"><button class="btn sm" type="button" id="re">Intentar de nuevo</button></div>'}</div>`;
      const re = $('#re'); if (re) re.onclick = () => renderEval(c);
      after('s4', ok);
    });
  } else {
    const items = CK_EVA[kind], best = c.concl.find(x => x[1])[0];
    b.innerHTML = `<p class="q">Escribe <b>un párrafo F-E-I-J</b> sobre el <b>corto y largo plazo</b> o sobre las <b>partes interesadas</b>, con un argumento distinto al del paso 3, y cierra con <b>tu conclusión</b> pesando pros y contras. Usa conectores de contraste.</p>
      <div class="conns">${CONN_EVAL.slice(0, 10).map(x => `<button type="button" class="chipx sm" data-c="${x}">${x}</button>`).join('')}</div>
      <textarea id="ta" rows="9" placeholder="Factor… Esto ocurre porque… Esto implica que… Por lo tanto… En definitiva…">${esc(W.txt)}</textarea>
      <p class="small" id="cc"></p>
      <div class="row" style="margin:6px 0 16px"><button class="btn primary sm" type="button" id="cp">Copiar mi texto</button></div>
      <h3>Lista de cotejo</h3>${checklistHtml(items, W.ck, 'ckx')}
      <details class="model"><summary>Ver conclusión modelo</summary><p>${esc(best)}</p></details>`;
    const ta = $('#ta'), cc = () => { const f = foundConn(ta.value, CONN_EVAL); $('#cc').innerHTML = `Conectores de evaluación usados: <b>${f.length}</b>${f.length ? ' (' + f.join(', ') + ')' : ''}. ${f.some(x => ['sin embargo', 'no obstante', 'si bien', 'por el contrario', 'a pesar de', 'por otra parte'].includes(x)) ? 'Hay contraste.' : 'Falta un conector de contraste (sin embargo, no obstante, si bien…).'}`; };
    ta.oninput = () => { W.txt = ta.value; if (W.txt.trim().length > 200) W.done = true; save(); cc(); };
    b.querySelectorAll('[data-c]').forEach(x => x.onclick = () => insertAtCursor(ta, x.dataset.c.charAt(0).toUpperCase() + x.dataset.c.slice(1)));
    $('#cp').onclick = e => copyText(ta.value, e.currentTarget);
    bindChecklist(b, 'ckx', items, W.ck, save);
    cc();
  }
}

function mcPool(u, fn) {
  const out = [];
  TOPICS.forEach(t => {
    if (u !== 'all' && t.u !== +u) return;
    t.items.forEach((it, idx) => { if (it.t === 'mc' && it.o && it.o.length >= 3 && (!fn || fn(it, idx, t))) out.push({ q: it.q, o: it.o, a: it.a, e: it.e, h: it.h, tid: t.id, idx, t, nIt: t.items.length }); });
  });
  return out;
}
function drillPool() {
  const out = [];
  [DRILLS.cmd, DRILLS.err].forEach(d => d.items.forEach((it, idx) => { if (it.t === 'mc') out.push({ q: it.q, o: it.o, a: it.a, e: it.e, h: it.h, tid: d.id, idx, t: d }); }));
  return out;
}
function cardQs(u, n) {
  const pool = CARDS.filter(c => u === 'all' || c[0] === +u);
  return shuffle(pool).slice(0, n).map(c => {
    const same = pool.filter(x => x !== c && x[0] === c[0]);
    const dist = shuffle(same.length >= 3 ? same : CARDS.filter(x => x !== c)).slice(0, 3).map(x => x[1]);
    return { q: `¿Qué término corresponde a esta definición?<br><i>«${esc(c[2])}»</i>`, o: [c[1], ...dist], a: 0, e: `<b>${esc(c[1])}</b>: ${esc(c[2])}`, card: c };
  });
}

function relojPlay() {
  app.innerHTML = `${gameCrumb}<div class="rl-top"><span class="rl-time" id="rlT">60</span><div class="bar rl-bar"><i id="rlB" style="width:100%"></i></div><span class="rl-sc">Aciertos <b id="rlS">${RL.score}</b></span></div>
    <div class="card gcard"><div class="card-b"><p class="q" id="rlQ"></p><div class="opts" id="rlO"></div></div></div>`;
  const tick = () => {
    const left = Math.max(0, RL.end - Date.now()), T = $('#rlT');
    if (!T) return stopGameTimers();
    T.textContent = Math.ceil(left / 1000); $('#rlB').style.width = (left / 600) + '%';
    T.classList.toggle('low', left < 10000);
    if (left <= 0) { stopGameTimers(); RL.st = 'end'; relojEnd(); }
  };
  const show = () => {
    if (RL.i >= RL.deck.length) { RL.deck = shuffle(RL.deck); RL.i = 0; }
    const q = RL.deck[RL.i];
    $('#rlQ').innerHTML = q.q;
    $('#rlO').innerHTML = q.o.map((o, k) => `<button class="opt" type="button" data-k="${k}"><span class="l">${LET[k]}</span><span>${o}</span></button>`).join('');
    $('#rlO').querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.k));
  };
  const answer = k => {
    if (RL.lock || RL.st !== 'play') return;
    const q = RL.deck[RL.i], ok = k === q.a; RL.lock = true; RL.n++;
    const bs = $('#rlO').querySelectorAll('.opt');
    bs.forEach(b => b.disabled = true);
    bs[q.a].classList.add('right'); if (!ok) bs[k].classList.add('wrong');
    if (ok) { RL.score++; $('#rlS').textContent = RL.score; } else { RL.end -= 3000; RL.miss.push(q); }
    if (q.tid) logResult(q.tid, q.idx, ok);
    setTimeout(() => { RL.lock = false; RL.i++; if (RL.st === 'play' && $('#rlQ')) show(); }, ok ? 450 : 1100);
  };
  document.onkeydown = e => { const k = +e.key - 1; if (k >= 0 && k < 4 && RL.st === 'play') answer(k); };
  show(); tick(); GAME_TIMER = setInterval(tick, 100);
}
function relojEnd() {
  const prev = GAMES.reloj[RL.u], isRec = prev === undefined || RL.score > prev;

  app.innerHTML = `${gameCrumb}<div class="eyebrow" style="margin-top:12px">Contrarreloj · ${UNIT_OPTS[RL.u]}</div>

  if (MM.st === 'play') return memoriaPlay();
  const best = GAMES.memoria[MM.u];
  app.innerHTML = `${gameCrumb}<div class="eyebrow" style="margin-top:12px">Juego 2 · Individual</div><h1>Memoria</h1>

    MM.cards = shuffle(pairs.flatMap((c, p) => [{ p, k: 'T', txt: c[1] }, { p, k: 'D', txt: c[2] }]));

}
function memoriaPlay() {
  app.innerHTML = `${gameCrumb}<div class="eyebrow" style="margin-top:12px">Memoria · ${UNIT_OPTS[MM.u]}</div>
    <div class="row mm-top"><span>Jugadas <b id="mmMv">${MM.mv}</b></span><span>Parejas <b id="mmP">${MM.done.size}</b>/6</span><span>Tiempo <b id="mmS">0</b> s</span><button class="btn sm" type="button" id="mmNew">Nueva partida</button></div>
    <div class="mm-grid" id="mmG">${MM.cards.map((c, i) => `<button class="mm-card" type="button" data-i="${i}" aria-label="Carta ${i + 1}"><span class="mm-back">?</span><span class="mm-face"><small>${c.k === 'T' ? 'Término' : 'Definición'}</small>${esc(c.txt)}</span></button>`).join('')}</div>
    <div id="mmEnd"></div>`;
  const G = $('#mmG');
  const paint = () => G.querySelectorAll('.mm-card').forEach(b => { const i = +b.dataset.i, c = MM.cards[i]; b.classList.toggle('up', MM.open.includes(i) || MM.done.has(c.p)); b.classList.toggle('ok', MM.done.has(c.p)); b.classList.toggle('t', c.k === 'T'); b.disabled = MM.done.has(c.p); });
  paint();
  GAME_TIMER = setInterval(() => { const s = $('#mmS'); if (!s) return stopGameTimers(); s.textContent = Math.round((Date.now() - MM.t0) / 1000); }, 500);
  $('#mmNew').onclick = () => { MM.st = 'setup'; renderMemoria(); $('#mmGo').click(); };
  G.querySelectorAll('.mm-card').forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    if (MM.lock || MM.open.includes(i) || MM.done.has(MM.cards[i].p)) return;
    MM.open.push(i); paint();
    if (MM.open.length < 2) return;
    MM.mv++; $('#mmMv').textContent = MM.mv;
    const [x, y] = MM.open.map(j => MM.cards[j]);
    if (x.p === y.p) { MM.done.add(x.p); MM.open = []; paint(); $('#mmP').textContent = MM.done.size; if (MM.done.size === 6) memoriaEnd(); }
    else { MM.lock = true; G.querySelectorAll('.mm-card').forEach(z => { if (MM.open.includes(+z.dataset.i)) z.classList.add('no'); }); setTimeout(() => { MM.open = []; MM.lock = false; G.querySelectorAll('.no').forEach(z => z.classList.remove('no')); paint(); }, 1700); }
  });
}
function memoriaEnd() {
  stopGameTimers();
  const s = Math.round((Date.now() - MM.t0) / 1000), best = GAMES.memoria[MM.u];
  const isRec = !best || MM.mv < best.mv || (MM.mv === best.mv && s < best.s);
  if (isRec) { GAMES.memoria[MM.u] = { mv: MM.mv, s }; saveGames(); }
  $('#mmEnd').innerHTML = `<div class="fb ok" style="margin-top:16px"><b class="h">¡Completaste las 6 parejas!</b>${MM.mv} jugadas en ${s} segundos.${isRec ? ' Es tu mejor partida en este contenido.' : ` Tu mejor marca: ${best.mv} jugadas.`} El mínimo posible es 6 jugadas.</div>
    <div class="row" style="margin-top:10px"><button class="btn primary" type="button" id="mmAgain">Jugar otra vez</button></div>`;
  $('#mmAgain').onclick = () => { MM.st = 'setup'; renderMemoria(); $('#mmGo').click(); };
}

/* ---------- 3 · ¿Quién quiere ser economista? ---------- */
const MILL_PTS = [100, 200, 300, 500, 1000, 2000, 4000, 8000, 16000, 32000, 64000, 125000, 250000, 500000, 1000000];
const MILL_SAFE = [4, 9];
const ML = { u: store.get('gU', 'all'), st: 'setup' };
function millBuild(u) {
  const easy = cardQs(u, 8);
  const early = shuffle(mcPool(u, (it, idx, t) => idx < t.items.length / 2 && plain(it.q).length < 320));
  const late = shuffle(mcPool(u, (it, idx, t) => idx >= t.items.length / 2));
  const dr = shuffle(drillPool());
  const tiers = [easy.slice(0, 5), early.slice(0, 5), shuffle([...late.slice(0, 3), ...dr.slice(0, 2)])];
  ML.res = [easy.slice(5), early.slice(5, 9), [...late.slice(3, 6), ...dr.slice(2, 4)]];
  ML.qs = tiers.flat().map(shufQ);
}
function renderMill() {
  stopGameTimers();
  if (ML.st === 'play') return millPlay();
  const best = GAMES.mill[ML.u];
  app.innerHTML = `${gameCrumb}<div class="eyebrow" style="margin-top:12px">Juego 3 · Individual</div><h1>¿Quién quiere ser economista?</h1>
    <div class="essentials gset">
      <p><b>15 preguntas</b> de dificultad creciente: conceptos, luego aplicación y al final preguntas de examen. Los niveles <b>1.000</b> y <b>32.000</b> son seguros: si fallas, conservas el último nivel seguro que alcanzaste. Puedes retirarte en cualquier momento.</p>
      <p>Comodines (uno de cada uno): <b>50:50</b>, <b>Pista</b> y <b>Cambiar pregunta</b>.</p>
      <div><span class="lbl2">Contenido</span>${unitSeg(ML.u, 'mlU')}</div>
      <p class="small muted">${best !== undefined ? `Tu mejor resultado en ${UNIT_OPTS[ML.u].toLowerCase()}: <b>${fmt(best)} puntos</b>.` : 'Todavía no jugaste con este contenido.'}</p>
      <div class="row"><button class="btn primary" type="button" id="mlGo">Empezar</button></div>
    </div>`;
  bindUnitSeg('mlU', u => { ML.u = u; store.set('gU', u); renderMill(); });
  $('#mlGo').onclick = () => { millBuild(ML.u); Object.assign(ML, { st: 'play', i: 0, sel: null, life: { f: 1, h: 1, c: 1 }, hid: [], hint: null, phase: 'ask', over: null }); renderMill(); };
}
function millSafe(i) { let s = 0; MILL_SAFE.forEach(k => { if (i > k) s = MILL_PTS[k]; }); return s; }
function millHint(q) {
  if (q.card) { const w = q.card[1]; return `El término empieza con «${w[0]}» y tiene ${w.replace(/\s/g, '').length} letras${/\s/.test(w) ? ` (${w.split(/\s+/).length} palabras)` : ''}.`; }
  return autoHint(q.t, q) || 'Descarta primero las opciones que confunden causa con efecto.';
}
function millPlay() {
  const q = ML.qs[ML.i], tier = ML.i < 5 ? 0 : ML.i < 10 ? 1 : 2;
  const ladder = MILL_PTS.map((p, k) => `<li class="${k === ML.i ? 'cur' : ''} ${k < ML.i ? 'past' : ''} ${MILL_SAFE.includes(k) ? 'safe' : ''}"><span>${k + 1}</span><b>${fmt(p)}</b></li>`).reverse().join('');
  const over = ML.over;
  app.innerHTML = `${gameCrumb}
    <div class="ml-wrap">
      <div>
        <div class="row ml-top"><span class="tag">${['Conceptos', 'Aplicación', 'Examen'][tier]}</span><span class="ml-now">Pregunta ${ML.i + 1} de 15 · por <b>${fmt(MILL_PTS[ML.i])}</b> puntos</span></div>
        <div class="card gcard"><div class="card-b">
          <p class="q">${q.q}</p>
          <div class="opts" id="mlO">${q.o.map((o, k) => `<button class="opt ${ML.sel === k ? 'sel' : ''} ${ML.hid.includes(k) ? 'elim' : ''}" type="button" data-k="${k}" ${ML.hid.includes(k) || ML.phase !== 'ask' ? 'disabled' : ''}><span class="l">${LET[k]}</span><span>${o}</span></button>`).join('')}</div>
          <div class="hints">${ML.hint ? `<p class="hint1">${ML.hint}</p>` : ''}</div>
          <div id="mlF"></div>
        </div>
        <div class="card-f">
          <div class="row">${ML.phase === 'ask' ? `<button class="btn sm" type="button" data-l="f" ${ML.life.f ? '' : 'disabled'}>50:50</button><button class="btn sm" type="button" data-l="h" ${ML.life.h ? '' : 'disabled'}>Pista</button><button class="btn sm" type="button" data-l="c" ${ML.life.c ? '' : 'disabled'}>Cambiar pregunta</button>` : ''}</div>
          <div class="row">${ML.phase === 'ask' ? `<button class="btn" type="button" id="mlQuit">Retirarme con ${fmt(ML.i ? MILL_PTS[ML.i - 1] : 0)}</button><button class="btn primary" type="button" id="mlOk" ${ML.sel === null ? 'disabled' : ''}>Respuesta final</button>` : over ? `<button class="btn primary" type="button" id="mlAgain">Jugar otra vez</button>` : `<button class="btn primary" type="button" id="mlNext">Siguiente pregunta →</button>`}</div>
        </div></div>
      </div>
      <ol class="ml-ladder" aria-label="Escalera de puntos">${ladder}</ol>
    </div>`;
  const F = $('#mlF');
  if (ML.phase !== 'ask') {
    const bs = $('#mlO').querySelectorAll('.opt');
    bs[q.a].classList.add('right'); if (ML.sel !== q.a && ML.sel !== null) bs[ML.sel].classList.add('wrong');
    F.innerHTML = over
      ? `<div class="fb ${over.win ? 'ok' : over.quit ? 'info' : 'no'}"><b class="h">${over.win ? '¡Ganaste el millón de puntos!' : over.quit ? 'Te retiraste' : 'Respuesta incorrecta'}</b>${over.quit ? '' : (q.e || '')}<p style="margin:8px 0 0"><b>Resultado: ${fmt(over.pts)} puntos.</b>${over.rec ? ' Es tu mejor resultado en este contenido.' : ''}</p></div>`
      : `<div class="fb ok"><b class="h">¡Correcto!</b>${q.e || ''}</div>`;
  }
  $('#mlO').querySelectorAll('.opt').forEach(b => b.onclick = () => { ML.sel = +b.dataset.k; millPlay(); });
  app.querySelectorAll('[data-l]').forEach(b => b.onclick = () => {
    const l = b.dataset.l; if (!ML.life[l]) return; ML.life[l] = 0;
    if (l === 'f') { ML.hid = shuffle(q.o.map((_, k) => k).filter(k => k !== q.a)).slice(0, 2); if (ML.hid.includes(ML.sel)) ML.sel = null; }
    if (l === 'h') ML.hint = millHint(q);
    if (l === 'c') { const r = ML.res[tier].shift(); if (r) { ML.qs[ML.i] = shufQ(r); ML.sel = null; ML.hid = []; ML.hint = null; } }
    millPlay();
  });
  const finish = (pts, extra) => { const prev = GAMES.mill[ML.u], rec = prev === undefined || pts > prev; if (rec) { GAMES.mill[ML.u] = pts; saveGames(); } ML.over = Object.assign({ pts, rec }, extra); ML.phase = 'done'; millPlay(); };
  const ok = $('#mlOk');
  if (ok) ok.onclick = () => {
    const right = ML.sel === q.a;
    if (q.tid) logResult(q.tid, q.idx, right);
    if (!right) return finish(millSafe(ML.i), {});
    if (ML.i === 14) return finish(MILL_PTS[14], { win: true });
    ML.phase = 'right'; millPlay();
  };
  const quit = $('#mlQuit'); if (quit) quit.onclick = () => finish(ML.i ? MILL_PTS[ML.i - 1] : 0, { quit: true });
  const nx = $('#mlNext'); if (nx) nx.onclick = () => { ML.i++; Object.assign(ML, { sel: null, hid: [], hint: null, phase: 'ask' }); millPlay(); };
  const ag = $('#mlAgain'); if (ag) ag.onclick = () => { ML.st = 'setup'; renderMill(); };
}

/* ---------- 4 · Jeopardy de la clase ---------- */
let JP = store.get('jp', null);
const saveJP = () => store.set('jp', JP);
const JP_POOLS = { u12: 'Unidades 1 y 2', 3: 'Unidad 3', 4: 'Unidad 4', all: 'Todo el curso' };
function jpBuild(pool, names) {
  const ok = t => (pool === 'all' || (pool === 'u12' ? t.u <= 2 : t.u === +pool)) && t.items.filter(i => i.t === 'mc').length >= 4;
  const cats = shuffle(TOPICS.filter(ok)).slice(0, 5).sort((a, b) => TOPICS.indexOf(a) - TOPICS.indexOf(b)).map(t => {
    const mcs = t.items.map((it, idx) => ({ it, idx })).filter(x => x.it.t === 'mc');
    const pickIdx = [0, 1, 2, 3].map(k => mcs[Math.round(k * (mcs.length - 1) / 3)].idx);
    return { tid: t.id, qs: pickIdx.map(idx => { const ord = shuffle([0, 1, 2, 3].slice(0, t.items[idx].o.length)); return { idx, ord, used: false }; }) };
  });
  JP = { pool, teams: names.map(n => ({ n, s: 0 })), cats, open: null };
  saveJP();
}
function renderJeopardy() {
  stopGameTimers();
  if (!JP || !JP.cats) return jpSetup();
  if (JP.open) return jpQuestion();
  const left = JP.cats.reduce((s, c) => s + c.qs.filter(q => !q.used).length, 0);
  app.innerHTML = `${gameCrumb}<div class="row jp-head"><h1 style="margin:8px 0">Jeopardy · ${JP_POOLS[JP.pool]}</h1><span class="muted small">${left} preguntas por jugar</span></div>
    ${jpScores()}
    ${left ? `<div class="jp-board" style="--cols:${JP.cats.length}">${JP.cats.map(c => `<div class="jp-cat">${tcode(c.tid)}<span>${TOPICS.find(t => t.id === c.tid).name}</span></div>`).join('')}
      ${[0, 1, 2, 3].map(r => JP.cats.map((c, ci) => { const q = c.qs[r]; return `<button class="jp-cell" type="button" data-c="${ci}" data-r="${r}" ${q.used ? 'disabled' : ''}>${q.used ? '' : (r + 1) * 100}</button>`; }).join('')).join('')}</div>`
      : jpPodium()}
    <div class="row" style="margin-top:16px"><button class="btn" type="button" id="jpNew">Nuevo tablero</button><button class="btn" type="button" id="jpFs">Pantalla completa</button></div>`;
  app.querySelectorAll('.jp-cell').forEach(b => b.onclick = () => { JP.open = { c: +b.dataset.c, r: +b.dataset.r, rev: false }; saveJP(); renderJeopardy(); });
  $('#jpNew').onclick = () => { JP = null; saveJP(); renderJeopardy(); };
  $('#jpFs').onclick = () => { const d = document.documentElement; (d.requestFullscreen || d.webkitRequestFullscreen || (() => { })).call(d); };
}
function jpScores() { return `<div class="jp-scores">${JP.teams.map(t => `<div class="jp-team"><span>${esc(t.n)}</span><b>${fmt(t.s)}</b></div>`).join('')}</div>`; }
function jpPodium() {
  const r = JP.teams.slice().sort((a, b) => b.s - a.s);
  const tie = r.length > 1 && r[0].s === r[1].s;
  return `<div class="fb ok jp-end"><b class="h">${tie ? '¡Empate en el primer puesto!' : `¡Ganó ${esc(r[0].n)}!`}</b>${r.map((t, i) => `${i + 1}.º ${esc(t.n)}: ${fmt(t.s)} puntos`).join('<br>')}</div>`;
}
function jpSetup() {
  const S = SESS.jpSet = SESS.jpSet || { pool: 'u12', n: 3, names: ['Equipo 1', 'Equipo 2', 'Equipo 3', 'Equipo 4'] };
  app.innerHTML = `${gameCrumb}<div class="eyebrow" style="margin-top:12px">Juego 4 · Por equipos</div><h1>Jeopardy de la clase</h1>
    <div class="essentials gset">
      <p>Proyecta esta página. Cada equipo elige una categoría y un valor; el profesor muestra la pregunta, revela la respuesta y suma o resta los puntos. Las preguntas de 100 son las más simples del subtema y las de 400, las más exigentes.</p>
      <div><span class="lbl2">Contenido</span>${unitSeg(S.pool, 'jpU', JP_POOLS)}</div>
      <div><span class="lbl2">Cantidad de equipos</span><div class="seg" role="group" id="jpN">${[2, 3, 4].map(n => `<button type="button" data-n="${n}" aria-pressed="${S.n === n}">${n}</button>`).join('')}</div></div>
      <div class="jp-names">${S.names.slice(0, S.n).map((n, i) => `<label><span class="lbl2">Equipo ${i + 1}</span><input class="inp" data-tn="${i}" value="${esc(n)}" maxlength="24"></label>`).join('')}</div>
      <div class="row"><button class="btn primary" type="button" id="jpGo">Armar el tablero</button></div>
    </div>`;
  bindUnitSeg('jpU', u => { S.pool = u; jpSetup(); });
  app.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { S.n = +b.dataset.n; jpSetup(); });
  app.querySelectorAll('[data-tn]').forEach(i => i.oninput = () => { S.names[+i.dataset.tn] = i.value; });

function jpQuestion() {
  const { c, r, rev } = JP.open, cat = JP.cats[c], cell = cat.qs[r], t = TOPICS.find(x => x.id === cat.tid), it = t.items[cell.idx], val = (r + 1) * 100;
  const a = cell.ord.indexOf(it.a);

      ${rev ? `<div class="fb ok"><b class="h">Respuesta: ${LET[a]}</b>${it.e || ''}</div>` : ''}
    </div>
    <div class="card-f">${rev ? `<div class="jp-award">${JP.teams.map((tm, i) => `<div class="row"><span class="nm">${esc(tm.n)}</span><button class="btn sm" type="button" data-pt="${i}" data-v="${val}">+${val}</button><button class="btn sm" type="button" data-pt="${i}" data-v="${-val}">−${val}</button></div>`).join('')}</div>
      <button class="btn primary" type="button" id="jpBack">Volver al tablero</button>`
      : `<button class="btn" type="button" id="jpBack">Volver sin jugar</button><button class="btn primary" type="button" id="jpRev">Mostrar respuesta</button>`}</div></div>`;
  const rv = $('#jpRev'); if (rv) rv.onclick = () => { JP.open.rev = true; cell.used = true; saveJP(); jpQuestion(); };
  app.querySelectorAll('[data-pt]').forEach(b => b.onclick = () => { JP.teams[+b.dataset.pt].s += +b.dataset.v; saveJP(); jpQuestion(); });

      { k: 'a1', lbl: '(a) (i)', t: 'def', pts: 2, q: 'Defina el término <b>inflación</b> (párrafo 2).', model: 'Aumento sostenido del nivel general de precios de una economía durante un período. Se mide normalmente con el índice de precios al consumidor (IPC).', ck: ['Habla del <b>nivel general</b> de precios, no del precio de un bien', 'Indica que el aumento es <b>sostenido</b> o en un período'] },
      { k: 'a2', lbl: '(a) (ii)', t: 'def', pts: 2, q: 'Defina el término <b>meta de inflación</b> (párrafo 3).', model: 'Régimen en el que el banco central anuncia una tasa de inflación objetivo, con un rango, y ajusta la tasa de interés para alcanzarla.', ck: ['Menciona que el banco central <b>anuncia un objetivo</b> de inflación', 'Indica que usa la <b>tasa de interés</b> para cumplirlo'] },
      { k: 'b1', lbl: '(b) (i)', t: 'calc', pts: 2, q: 'Usando la Tabla 1, calcule en cuántos <b>puntos porcentuales</b> aumentó la TPM entre agosto de 2021 y septiembre de 2022.', ans: 7.75, tol: 0.01, unit: 'puntos porcentuales', hint: 'Es una resta entre los dos niveles de la tabla, no una variación porcentual.', sol: '8,50 − 0,75 = <b>7,75 puntos porcentuales</b>.' },
      { k: 'b2', lbl: '(b) (ii)', t: 'calc', pts: 3, q: 'Suponga que una canasta de bienes costaba Gs. 2.000.000 en abril de 2021. Usando la inflación interanual de abril de 2022, calcule cuánto costaba la misma canasta en abril de 2022 (en guaraníes).', ans: 2236000, tol: 600, unit: 'guaraníes', hint: 'Multiplica el costo inicial por (1 + inflación ÷ 100).', sol: '2.000.000 × (1 + 11,8 ÷ 100) = 2.000.000 × 1,118 = <b>Gs. 2.236.000</b>.' },
      { k: 'c', lbl: '(c)', t: 'dia', pts: 4, q: 'Usando un diagrama de DA/OA, explique cómo el aumento del precio internacional de los combustibles (párrafo 2) pudo elevar el nivel general de precios en Paraguay.', dia: { m: 'adas', key: 'OACP', dir: -1, why: 'Los combustibles son un costo de producción y de transporte para las empresas.' }, model: 'Los combustibles son un costo de producción y de transporte. Cuando sube su precio internacional, aumentan los costos de las empresas y la OACP se desplaza a la izquierda (de OACP₀ a OACP₁). El nivel general de precios sube de P₀ a P₁ y el PIB real baja de Y₀ a Y₁: es inflación de costos.', ck: ['Identifica los combustibles como un <b>costo</b> de producción', 'La <b>OACP</b> se desplaza a la izquierda', 'Sube el nivel general de precios y baja el PIB real', 'Lo llama <b>inflación de costos</b>'] },
      { k: 'd', lbl: '(d)', t: 'dia', pts: 4, q: 'Usando un diagrama de DA/OA, explique cómo la suba de la TPM del BCP (párrafo 1) ayuda a reducir la inflación.', dia: { m: 'adas', key: 'DA', dir: -1, why: 'Una tasa más alta encarece el crédito: bajan el consumo y la inversión.' }, model: 'Una TPM más alta encarece el crédito y hace más atractivo ahorrar, así que bajan el consumo (C) y la inversión (I). La DA se desplaza a la izquierda (de DA₀ a DA₁): el nivel general de precios baja o crece menos (de P₀ a P₁) y el PIB real baja de Y₀ a Y₁.', ck: ['La TPM más alta <b>encarece el crédito</b> o premia el ahorro', 'Bajan el <b>consumo y la inversión</b>', 'La <b>DA</b> se desplaza a la izquierda', 'Menor presión sobre el nivel de precios, con menor PIB real'] },
      { k: 'e', lbl: '(e)', t: 'dia', pts: 4, q: 'Usando un diagrama del mercado del guaraní, explique cómo una TPM más alta puede apreciar el guaraní.', dia: { m: 'fx', key: 'D', dir: 1, why: 'Tasas más altas en guaraníes atraen ahorro e inversión financiera.' }, model: 'Con tasas de interés más altas en guaraníes, invertir en Paraguay se vuelve más atractivo. Para hacerlo, los inversores necesitan comprar guaraníes, así que aumenta la demanda de guaraníes (de D₀ a D₁). El valor del guaraní sube (se aprecia) y eso abarata las importaciones, lo que ayuda a bajar la inflación importada.', ck: ['Tasas más altas atraen <b>inversión financiera</b> o ahorro del exterior', 'Aumenta la <b>demanda de guaraníes</b>', 'El guaraní <b>se aprecia</b>', 'Vincula la apreciación con importaciones más baratas'] },
      { k: 'f', lbl: '(f)', t: 'dia', pts: 4, q: 'Usando un diagrama de oferta y demanda, explique por qué subió el precio de los panificados en Paraguay (párrafo 2).', dia: { m: 'micro', key: 'O', dir: -1, why: 'El trigo y la harina son insumos del pan.' }, model: 'El trigo y la harina son insumos del pan. Al subir su precio internacional, aumentan los costos de las panaderías y la oferta se desplaza a la izquierda (de O₀ a O₁). Al precio inicial hay exceso de demanda, por lo que el precio sube de P₀ a P₁ y la cantidad baja de Q₀ a Q₁.', ck: ['Identifica el trigo como <b>insumo</b> (costo)', 'La <b>oferta</b> se desplaza a la izquierda', 'Exceso de demanda al precio inicial', 'Sube el precio y baja la cantidad'] },
      { k: 'g', lbl: '(g)', t: 'eval', pts: 15, q: 'Usando información del texto y sus conocimientos de economía, <b>evalúe</b> la eficacia de la política monetaria del BCP para controlar la inflación en Paraguay.', ind: ['Define política monetaria contractiva y meta de inflación.', 'Explica con un diagrama DA/OA cómo la suba de la TPM reduce la DA.', 'Usa datos del texto: TPM de 0,75 % a 8,50 %; inflación de 11,8 % (abril de 2022) a 3,7 % (2023) y 3,8 % (2024).', '<b>Pro:</b> la inflación volvió a la meta y el régimen de metas ayuda a anclar las expectativas.', '<b>Contra:</b> buena parte de la inflación de 2022 fue de costos e importada (combustibles, trigo); la TPM actúa sobre la demanda, no sobre esos precios.', '<b>Contra:</b> dolarización e informalidad debilitan la transmisión (párrafo 4).', '<b>Corto y largo plazo:</b> menor crecimiento y empleo en el corto plazo a cambio de estabilidad de precios en el largo plazo; la baja de 2023 también pudo deberse a la normalización de precios internacionales.', '<b>Partes interesadas:</b> deudores, ahorristas, empresas, exportadores y hogares de bajos ingresos.', 'Conclusión con un juicio justificado, por ejemplo: eficaz en parte, sobre todo para anclar expectativas.'] }
    ]

  {
    id: 'pobreza', u: 'Unidad 3', title: 'Pobreza y desigualdad en Paraguay', yrs: '2023–2024',
    text: [
      'Según el Instituto Nacional de Estadística (INE), con datos de la Encuesta Permanente de Hogares Continua, la pobreza total bajó de <b>22,3 %</b> de la población en 2023 a <b>20,1 %</b> en 2024, el nivel más bajo desde que se aplica la metodología actual (1997/98). En zonas urbanas pasó de 18,7 % a 16,6 % y en zonas rurales de 28,1 % a 25,9 %.',
      'La pobreza extrema también bajó: en zonas urbanas, de 2,2 % a 1,9 %, y en zonas rurales, de 8,8 % a 7,9 %.',
      'El INE estimó que, sin los programas de transferencias del Estado, en 2024 la pobreza total habría sido de 24,0 % y la pobreza extrema de 6,6 %.',
      'La desigualdad sigue siendo alta. En 2024, el 10 % más rico de la población recibió el <b>35,2 %</b> del ingreso total y el 10 % más pobre, el <b>1,9 %</b>. El ingreso mensual por persona del 10 % más pobre fue de unos Gs. 382.000, frente a unos Gs. 7.214.000 del 10 % más rico.',
      'Según cifras revisadas del BCP, la economía creció 5,3 % en 2023 y 4,7 % en 2024. En 2024 el principal motor fue el consumo privado, que aumentó 6,1 %, acompañado por un aumento de la inversión de 12,4 %.'
    ],
    tables: [
      { cap: 'Tabla 1. Pobreza monetaria (% de la población)', head: ['', '2023', '2024'], rows: [['Pobreza total, país', '22,3', '20,1'], ['Pobreza total, urbana', '18,7', '16,6'], ['Pobreza total, rural', '28,1', '25,9'], ['Pobreza extrema, urbana', '2,2', '1,9'], ['Pobreza extrema, rural', '8,8', '7,9']] },
      { cap: 'Tabla 2. Distribución del ingreso, 2024', head: ['Grupo', '% del ingreso total', 'Ingreso mensual por persona'], rows: [['10 % más pobre', '1,9', 'Gs. 382.000'], ['10 % más rico', '35,2', 'Gs. 7.214.000']] }
    ],
    src: [['Xinhua, 29/03/2025: «Pobreza total en Paraguay se reduce 2,2 % en 2024, según datos de INE»', 'https://spanish.news.cn/20250329/6e75a57699674056883f87e1b4120191/c.html'], ['MarketData: «Pobreza monetaria en Paraguay: ¿por qué la pobreza extrema baja, pero la desigualdad persiste?»', 'https://marketdata.com.py/laboratorio/pobreza-monetaria-en-paraguay-por-que-la-pobreza-extrema-baja-pero-la-desigualdad-persiste-140683/'], ['INE: Pobreza monetaria EPHC 2024', 'https://www.ine.gov.py/Publicaciones/Biblioteca/documento/271/Pobreza%20Monetaria_%20EPHC%202024_INE.pdf'], ['Última Hora, 03/12/2025: «BCP ajusta estimación y sitúa el crecimiento del 2024 en 4,7»', 'https://www.ultimahora.com/bcp-ajusta-estimacion-y-situa-el-crecimiento-del-2024-en-4-7']],
    parts: [
      { k: 'a1', lbl: '(a) (i)', t: 'def', pts: 2, q: 'Defina el término <b>pobreza extrema</b> (párrafo 2).', model: 'Situación de las personas cuyo ingreso no alcanza para cubrir el costo de una canasta básica de alimentos, es decir, sus necesidades mínimas de alimentación.', ck: ['Relaciona el ingreso con un <b>umbral</b> (línea de pobreza)', 'El umbral es la <b>canasta básica de alimentos</b>'] },
      { k: 'a2', lbl: '(a) (ii)', t: 'def', pts: 2, q: 'Defina el término <b>transferencias</b> del Estado (párrafo 3).', model: 'Pagos del gobierno a personas o familias sin recibir a cambio un bien o un servicio, como pensiones o subsidios monetarios a hogares pobres. Redistribuyen el ingreso.', ck: ['Pago del gobierno <b>sin contrapartida</b> de bienes o servicios', 'Da un ejemplo o menciona que <b>redistribuye</b> el ingreso'] },
      { k: 'b1', lbl: '(b) (i)', t: 'calc', pts: 2, q: 'Usando la Tabla 2, calcule cuántas veces es mayor el ingreso mensual por persona del 10 % más rico que el del 10 % más pobre.', ans: 18.88, tol: 0.1, unit: 'veces', hint: 'Divide el ingreso del grupo más rico por el del más pobre.', sol: '7.214.000 ÷ 382.000 ≈ <b>18,9 veces</b>.' },
      { k: 'b2', lbl: '(b) (ii)', t: 'calc', pts: 3, q: 'Usando la Tabla 1, calcule la <b>variación porcentual</b> de la pobreza total del país entre 2023 y 2024.', ans: -9.87, tol: 0.12, abs: true, unit: '%', hint: 'Variación porcentual = (valor final − valor inicial) ÷ valor inicial × 100. No es lo mismo que la resta en puntos porcentuales.', sol: '(20,1 − 22,3) ÷ 22,3 × 100 ≈ <b>−9,9 %</b>. La baja en <b>puntos porcentuales</b> es de 2,2 puntos (la resta); la variación porcentual compara esa baja con el nivel inicial.' },
      { k: 'c', lbl: '(c)', t: 'paper', pts: 4, q: 'Usando una curva de Lorenz, explique qué indican los datos del párrafo 4 sobre la distribución del ingreso en Paraguay.', link: ['lab-lorenz', 'Practicar en el laboratorio de la curva de Lorenz'], dck: ['Ejes: % acumulado de la población (horizontal) y % acumulado del ingreso (vertical), de 0 a 100', 'Diagonal rotulada como <b>línea de igualdad perfecta</b>', 'Curva de Lorenz <b>bien por debajo</b> de la diagonal', 'Marca que el 10 % más pobre recibe solo 1,9 % del ingreso'], model: 'Si el ingreso estuviera repartido de forma igual, el 10 % más pobre recibiría el 10 % del ingreso. Recibe solo 1,9 %, mientras el 10 % más rico recibe 35,2 %. Por eso la curva de Lorenz queda lejos de la línea de igualdad perfecta: la desigualdad es alta, lo que se reflejaría en un coeficiente de Gini elevado.', ck: ['Compara con la <b>igualdad perfecta</b> (10 % de la población → 10 % del ingreso)', 'Usa los datos: <b>1,9 %</b> y <b>35,2 %</b>', 'Concluye que la desigualdad es alta (curva lejos de la diagonal o Gini alto)'] },
      { k: 'd', lbl: '(d)', t: 'dia', pts: 4, q: 'Usando un diagrama de DA/OA, explique cómo el aumento del consumo privado (párrafo 5) contribuyó al crecimiento económico.', dia: { m: 'adas', key: 'DA', dir: 1, why: 'El consumo es un componente de la demanda agregada.' }, model: 'El consumo privado es el mayor componente de la DA (C + I + G + X − M). Cuando aumenta, la DA se desplaza a la derecha (de DA₀ a DA₁) y el PIB real sube de Y₀ a Y₁: hay crecimiento económico. El nivel general de precios también puede subir de P₀ a P₁.', ck: ['El consumo es un <b>componente de la DA</b>', 'La <b>DA</b> se desplaza a la derecha', 'Sube el <b>PIB real</b> (crecimiento)', 'Menciona el efecto sobre el nivel de precios'] },
      { k: 'e', lbl: '(e)', t: 'dia', pts: 4, q: 'Usando un diagrama de DA/OA, explique cómo invertir en la educación y la salud de los hogares pobres puede aumentar el producto potencial de Paraguay a largo plazo.', dia: { m: 'adas', key: 'OALP', dir: 1, why: 'Más educación y salud mejoran la calidad del factor trabajo.' }, model: 'La educación y la salud mejoran la calidad del factor trabajo (capital humano): los trabajadores producen más con los mismos recursos. La OALP se desplaza a la derecha (de OALP₀ a OALP₁) y aumenta el producto potencial. El efecto llega en el largo plazo, porque formar capital humano lleva años.', ck: ['Lo vincula con el <b>capital humano</b> y la productividad', 'La <b>OALP</b> se desplaza a la derecha', 'Aumenta el <b>producto potencial</b>', 'Aclara que es un efecto de <b>largo plazo</b>'] },
      { k: 'f', lbl: '(f)', t: 'dia', pts: 4, q: 'Usando un diagrama de oferta y demanda, explique cómo un subsidio a los productores de alimentos de la canasta básica afectaría su precio.', dia: { m: 'micro', key: 'O', dir: 1, why: 'El subsidio reduce los costos de producción.' }, model: 'El subsidio es un pago del gobierno a los productores por unidad producida, que reduce sus costos. La oferta se desplaza a la derecha (de O₀ a O₁): el precio baja de P₀ a P₁ y la cantidad sube de Q₀ a Q₁. Beneficia a los hogares pobres, que gastan una gran parte de su ingreso en alimentos.', ck: ['El subsidio <b>reduce los costos</b> de los productores', 'La <b>oferta</b> se desplaza a la derecha', 'Baja el precio y sube la cantidad', 'Lo vincula con los hogares pobres'] },
      { k: 'g', lbl: '(g)', t: 'eval', pts: 15, q: 'Usando información del texto y sus conocimientos de economía, <b>evalúe</b> el uso de los programas de transferencias para reducir la pobreza y la desigualdad en Paraguay.', ind: ['Define pobreza, desigualdad y transferencias.', 'Explica con la curva de Lorenz cómo las transferencias redistribuyen el ingreso.', 'Usa datos del texto: sin transferencias, la pobreza habría sido 24,0 % en vez de 20,1 % y la extrema 6,6 %.', '<b>Pro:</b> alivio inmediato y focalizado; si exigen asistencia escolar y controles de salud, forman capital humano.', '<b>Contra:</b> costo fiscal y costo de oportunidad; errores de focalización; la informalidad dificulta identificar a quién ayudar.', '<b>Contra:</b> no atacan las causas de fondo (empleo, productividad). El crecimiento de 5,3 % y 4,7 % también explica la baja.', '<b>Corto y largo plazo:</b> alivio hoy; los efectos sobre capital humano tardan años.', '<b>Partes interesadas:</b> hogares pobres, contribuyentes, gobierno y zonas rurales, donde la pobreza (25,9 %) supera a la urbana (16,6 %).', 'La desigualdad sigue alta (35,2 % frente a 1,9 %): conclusión con un juicio justificado.'] }

      'La sequía de la zafra 2021/22 redujo la cosecha de soja a <b>4,3 millones de toneladas</b>, cuando al inicio de la campaña se esperaban 10 millones. Las exportaciones de soja cayeron de 6.329.425 toneladas en 2021 a 2.334.309 toneladas en 2022, y Paraguay bajó del 4.º al 6.º lugar entre los exportadores mundiales. Pese a la suba de los precios internacionales, los ingresos por exportaciones del complejo soja cayeron en poco más de US$ 2.000 millones.',

/* Pegue aquí el «enlace prellenado» del formulario, con las respuestas 1, 2, 3 y 4 en este orden:

const REPORTE_FORM_LINK = 'https://docs.google.com/forms/d/e/1FAIpQLSfrLcfHX1nKQ1NSHA1JaTP-949Um7VT5nVaPn-LVJpIcBveFg/viewform?usp=pp_url&entry.1752115616=1&entry.1516863016=2&entry.1810766453=3&entry.621917576=4';
function formConf() {
  const m = REPORTE_FORM_LINK.match(/^(https?:\/\/[^?]+)\/viewform\?(.*)$/);
  if (!m) return null;
  const ent = {}; m[2].split('&').forEach(kv => { const [k, v] = kv.split('='); if (/^entry\.\d+$/.test(k)) ent[decodeURIComponent((v || '').replace(/\+/g, ' ')).trim()] = k; });
  if (!ent['1'] || !ent['2'] || !ent['3'] || !ent['4']) return null;

}

  const f = document.createElement('form'); f.method = 'POST'; f.action = F.action; f.target = 'sendFrame'; f.hidden = true;
  [[F.nombre, name], [F.curso, curso], [F.resumen, reportSummary()], [F.reporte, reportText()]].forEach(([k, v]) => { const i = document.createElement('input'); i.type = 'hidden'; i.name = k; i.value = v; f.appendChild(i); });
  document.body.appendChild(f);

function eiReview(u, B) {

  const full = cover + '\n\n' + (w.txt.intro || '') + '\n\n[Diagrama: ' + (w.diaT || 'sin título') + ']\n\n' + (w.txt.exp || '') + '\n\n' + (w.txt.eva || '') + '\n\n' + eiDeclText(w);
  B.innerHTML = `<h3 style="margin-top:0">Revisión automática</h3><ul class="autofb">${fb.map(([cl, m]) => `<li class="${cl}">${m}</li>`).join('')}</ul>

    <div class="row" style="margin-top:12px"><button class="btn primary" type="button" id="eiDoc">Descargar en Word (.docx)</button><button class="btn" type="button" id="eiCp">Copiar el comentario con su portada</button></div>
    <p class="small muted">El Word incluye la portada, el texto, el diagrama y la declaración. Ábrelo en Word o súbelo a Google Docs para el formato final.</p>
    ${padUsed(w.dia) ? '<h4>Tu diagrama</h4><div id="eiRO"></div>' : ''}`;

/* =============== 13 · EI: respaldo, Word, planificador, declaración, validador y modelos =============== */
/* Fechas límite fijadas por el profesor (formato 'AAAA-MM-DD'). Si quedan vacías, cada alumno pone las suyas. */
const EI_FECHAS = { 2: '', 3: '', 4: '' };
let DOCX_P = null;
function loadDocx() {
  if (window.docx) return Promise.resolve(window.docx);
  if (!DOCX_P) DOCX_P = new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'vendor/docx-8.5.0.min.js'; s.onload = () => res(window.docx); s.onerror = () => { DOCX_P = null; rej(new Error('No se pudo cargar el generador de Word')); }; document.head.appendChild(s); });
  return DOCX_P;
}
function padPNG(ops, width = 900) {
  const box = document.createElement('div'); box.style.cssText = `position:absolute;left:-10000px;top:0;width:${width}px`;
  document.body.appendChild(box); sketchPad(box, ops, null, { readOnly: true });
  const cv = box.querySelector('canvas'), url = cv.toDataURL('image/png'), h = Math.round(width * .62); box.remove();
  const bin = atob(url.split(',')[1]), bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return { bytes, w: width, h };
}
function saveBlob(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
const fileSafe = s => String(s || '').trim().replace(/[^\wáéíóúñÁÉÍÓÚÑ -]+/g, '').replace(/\s+/g, '-').slice(0, 40);
function eiDeclText(w) {
  const d = w.decl || {};
  if (!d.ok) return 'Declaración de autoría: pendiente.';
  let t = 'Declaración de autoría: declaro que este comentario es mi trabajo original, que elegí el artículo y que cité todas las fuentes que utilicé.';
  t += d.ai === 'si' ? ` Uso de inteligencia artificial: sí. Herramienta: ${d.tool || '—'}. Para: ${(d.uses || []).join(', ') || '—'}. ${d.how ? 'Detalle: ' + d.how : ''}` : ' Uso de inteligencia artificial: no utilicé herramientas de IA.';
  return t;
}
async function eiDocx(u, btn) {
  const w = eiSlot(u), o = btn.textContent; btn.disabled = true; btn.textContent = 'Generando…';
  try {
    const D = await loadDocx();
    const { Document, Packer, Paragraph, TextRun, ImageRun, Table, TableRow, TableCell, WidthType, AlignmentType, HeadingLevel, BorderStyle } = D;
    const words = eiWords(w);
    const row = (k, v) => new TableRow({ children: [new TableCell({ width: { size: 34, type: WidthType.PERCENTAGE }, children: [new Paragraph({ children: [new TextRun({ text: k, bold: true, size: 20 })] })] }), new TableCell({ width: { size: 66, type: WidthType.PERCENTAGE }, children: [new Paragraph({ children: [new TextRun({ text: v || '—', size: 20 })] })] })] });
    const para = t => String(t || '').split(/\n+/).filter(x => x.trim()).map(x => new Paragraph({ spacing: { after: 160, line: 300 }, children: [new TextRun({ text: x.trim(), size: 24 })] }));
    const kids = [
      new Paragraph({ heading: HeadingLevel.HEADING_1, children: [new TextRun({ text: `Comentario de Evaluación Interna · Unidad ${u}: ${EI_UNITS[u]}`, bold: true })] }),
      new Table({ width: { size: 100, type: WidthType.PERCENTAGE }, rows: [row('Título del artículo', w.title), row('Fuente', w.source + (w.url ? ` (${w.url})` : '')), row('Fecha de publicación', w.pub), row('Fecha de consulta', w.acc), row('Fecha de redacción del comentario', w.red), row('Cómputo de palabras', String(words)), row('Unidad del programa', `Unidad ${u} · ${EI_UNITS[u]}`), row('Concepto clave', w.kc ? KC[w.kc] : '')] }),
      new Paragraph({ text: '' }),
      ...para(w.txt.intro)
    ];
    if (padUsed(w.dia)) {
      const img = padPNG(w.dia, 900);
      kids.push(new Paragraph({ alignment: AlignmentType.CENTER, spacing: { before: 120 }, children: [new TextRun({ text: w.diaT || 'Diagrama', bold: true, size: 22 })] }));
      kids.push(new Paragraph({ alignment: AlignmentType.CENTER, children: [new ImageRun({ data: img.bytes, transformation: { width: 560, height: Math.round(560 * .62) } })] }));
    }
    kids.push(...para(w.txt.exp), ...para(w.txt.eva));
    kids.push(new Paragraph({ border: { top: { style: BorderStyle.SINGLE, size: 6, color: '999999', space: 8 } }, spacing: { before: 240 }, children: [new TextRun({ text: eiDeclText(w), italics: true, size: 18 })] }));
    const doc = new Document({ creator: store.get('alumno', '') || 'Alumno', title: `EI Unidad ${u}`, styles: { default: { document: { run: { font: 'Calibri' } } } }, sections: [{ children: kids }] });
    const blob = await Packer.toBlob(doc);
    saveBlob(blob, `EI-Unidad-${u}${store.get('alumno', '') ? '-' + fileSafe(store.get('alumno', '')) : ''}.docx`);
    btn.textContent = 'Descargado ✓';
  } catch (e) { btn.textContent = 'No se pudo generar: revisa tu conexión'; }
  setTimeout(() => { btn.disabled = false; btn.textContent = o; }, 3000);
}
/* Respaldo de todo el Taller (progreso, simulacros y la carpeta de la EI) */
function backupAll() {
  const data = {}; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith('tallerEco.')) data[k] = localStorage.getItem(k); }
  let d; try { d = new Date().toISOString().slice(0, 10); } catch (e) { d = 'hoy'; }
  saveBlob(new Blob([JSON.stringify({ app: 'taller-economia-ib', v: 1, fecha: d, data }, null, 1)], { type: 'application/json' }), `respaldo-taller-economia-${fileSafe(store.get('alumno', '')) || 'alumno'}-${d}.json`);
}
function restoreAll(file, out) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result);
      if (j.app !== 'taller-economia-ib' || !j.data) throw new Error('formato');
      Object.entries(j.data).forEach(([k, v]) => { if (k.startsWith('tallerEco.')) localStorage.setItem(k, v); });
      out.innerHTML = `<div class="fb ok"><b class="h">Respaldo recuperado</b>Se restauraron tus datos del ${esc(j.fecha || '')}. La página se recarga en un momento.</div>`;

}

function formRun(k) {
  const F = FORMS.find(x => x.k === k), o = {}; let miss = false;
  F.in.forEach(([id]) => { const v = parseNum((app.querySelector(`[data-fk="${k}"][data-fi="${id}"]`) || {}).value || ''); o[id] = v; if (isNaN(v) && !(F.opt || []).includes(id)) miss = true; });
  const out = $('#fo-' + k); if (!out) return;
  if (miss) { out.innerHTML = '<span class="muted small">Completa todos los datos con números.</span>'; return; }
  const [r, st] = F.run(o);
  out.innerHTML = /NaN|Infinity/.test(r + st) ? '<span class="muted small">Revisa los datos: hay una división por cero.</span>' : `<b>${r}</b><div class="sol small" style="margin-top:4px">${st}</div>`;
}

const DEFST = store.get('defs', {});
const saveDefs = () => store.set('defs', DEFST);
const defKey = d => d[1];
function defCheck(d, txt) {
  const t = normTxt(txt), groups = d[3].split(';').map(g => g.trim()).filter(Boolean);
  const hit = groups.map(g => g.split('|').some(alt => { try { return new RegExp(alt.trim()).test(t); } catch (e) { return t.includes(alt.trim()); } }));
  const n = hit.filter(Boolean).length, r = n / groups.length;
  return { hit, groups, n, pts: r >= 0.99 ? 2 : r >= 0.5 ? 1 : 0 };
}
function defHL(d) { // resalta en la definición modelo las palabras clave
  let h = esc(d[2]);
  d[3].split(';').forEach(g => g.split('|').forEach(alt => { alt = alt.trim(); if (alt.length < 3 || /[.*()?%]/.test(alt)) return; const re = new RegExp('(?<![a-zñáéíóú])(' + alt.split('').map(ch => ({ a: '[aá]', e: '[eé]', i: '[ií]', o: '[oó]', u: '[uúü]', n: '[nñ]' })[ch] || ch.replace(/[\\^$+[\]{}]/g, '\\$&')).join('') + '[a-zñáéíóú]*)', 'i'); h = h.replace(re, '<mark>$1</mark>'); }));
  return h;
}
const defTag = d => { const s = DEFST[defKey(d)]; return s ? `${s.best}/2` : ''; };
function renderDefHome() {

  const done = DEFS.filter(d => DEFST[defKey(d)]), full = done.filter(d => DEFST[defKey(d)].best === 2).length;
  const weak = DEFS.filter(d => DEFST[defKey(d)] && DEFST[defKey(d)].best < 2);
  app.innerHTML = `<div class="eyebrow">Escribir como en el examen</div><h1>Definiciones · Prueba 2 (a)</h1>${writeTabs('escribir-def')}
    <p class="lede">La parte (a) de la Prueba 2 pide definir dos términos: 2 puntos cada uno. Escribe la definición con tus palabras; el Taller busca las ideas clave y te muestra la definición modelo.</p>
    <details class="essentials"><summary><b>Cómo se gana el punto completo</b></summary><ul>
      <li><b>2 puntos:</b> definición precisa, con todas las ideas clave. <b>1 punto:</b> definición vaga o incompleta.</li>

    <div class="row" style="margin:16px 0 10px;justify-content:space-between"><div class="seg" role="group" aria-label="Unidad">${[['all', 'Todas'], ['1', 'U1'], ['2', 'U2'], ['3', 'U3'], ['4', 'U4']].map(([v, l]) => `<button type="button" data-du="${v}" aria-pressed="${!DS && U === v}">${l}</button>`).join('')}</div>

    <div class="seg" role="group" aria-label="Modo" style="margin-bottom:14px">${[['prac', 'Practicar'], ['serie', 'Serie de 10'], ['fail', `Repasar las flojas (${weak.length})`], ['list', 'Estudiar la lista']].map(([v, l]) => `<button type="button" data-dm="${v}" aria-pressed="${M === v}">${l}</button>`).join('')}</div>
    <div id="dBody"></div>`;
  app.querySelectorAll('[data-du]').forEach(b => b.onclick = () => { SESS.dU = b.dataset.du; SESS.dSt = null; SESS.dQ = null; renderDefHome(); });
  const dx = $('#dStX'); if (dx) dx.onclick = () => { SESS.dSt = null; SESS.dQ = null; renderDefHome(); };

    <div class="row" style="margin-top:10px">${r ? `<button class="btn primary" type="button" id="dNx">${Q.i + 1 < Q.items.length ? 'Siguiente término' : 'Ver resultado'}</button>` : '<button class="btn primary" type="button" id="dOk">Comprobar</button><button class="btn" type="button" id="dSk">No la sé: ver el modelo</button>'}</div>
    <div id="dFb" style="margin-top:12px"></div></div>`;
  const show = res => {
    const c = res.chk;

  };
  if (r) { show(r); $('#dNx').onclick = () => { Q.i++; renderDefHome(); }; return; }

    const txt = $('#dTx').value.trim();
    if (!skip && txt.split(/\s+/).length < 4) { $('#dFb').innerHTML = '<div class="fb info">Escribe una definición completa (al menos una oración).</div>'; return; }

  };
  $('#dOk').onclick = () => finish(false); $('#dSk').onclick = () => finish(true);
}

function ejCard(x) {
  return `<article class="fcard ejc"><div class="fh"><span class="fu">${x.st}</span><h3>${x.t}</h3></div>
    <p class="small muted" style="margin:4px 0 8px">${x.w}${x.py ? ' · <b>Paraguay</b>' : ''}</p>
    <p style="margin:0 0 6px"><b>Qué pasó:</b> ${x.h}</p>
    <ul class="ejd">${x.d.map(v => `<li>${v}</li>`).join('')}</ul>
    <p class="small"><b>Diagrama:</b> ${x.g}</p>
    <p class="small"><b>Conceptos clave:</b> ${x.k}</p>
    <div class="trap small" style="background:var(--paper);border-color:var(--rule);color:var(--ink)"><b>Para evaluar:</b> ${x.e}</div>
    <p class="small muted" style="margin:8px 0 0">Fuente: ${x.f}</p>
    <div class="row" style="margin-top:8px"><button class="btn sm" type="button" data-ejc="${esc(x.t)}">Copiar como ejemplo</button></div></article>`;
}
function renderEjemplos() {
  const U = SESS.eU = SESS.eU || 'all', Q = SESS.eQ || '', PY = !!SESS.ePY;
  const nq = normTxt(Q), list = EJ.filter(x => (U === 'all' || x.st[0] === U) && (!PY || x.py) && (!nq || normTxt([x.st, x.t, x.w, x.h, x.d.join(' '), x.k, EJ_ST[x.st]].join(' ')).includes(nq)));
  const by = {}; list.forEach(x => (by[x.st] = by[x.st] || []).push(x));
  app.innerHTML = `<div class="eyebrow">Escribir como en el examen</div><h1>Ejemplos del mundo real</h1>${writeTabs('escribir-ej')}
    <p class="lede">Para llegar a las bandas altas de la Prueba 1 (b) y la Prueba 2 (g) necesitas un ejemplo real <b>desarrollado</b>: país, año, un dato y por qué ilustra la teoría. Aquí tienes ${EJ.length} ejemplos ordenados por subtema, con su diagrama y un punto para evaluar.</p>
    <details class="essentials"><summary><b>Cómo usar un ejemplo (regla C-A-D-I)</b></summary><ul>
      <li><b>C</b>ontexto: dónde ocurrió. <b>A</b>ño: cuándo. <b>D</b>ato: una cifra concreta. <b>I</b>mpacto: qué efecto económico tuvo.</li>
      <li>El ejemplo va <b>después</b> de la teoría y el diagrama: los ilustra, no los reemplaza.</li>
      <li>No lo nombres solamente: explica por qué muestra la teoría («Esto ocurrió porque…»).</li>
      <li>Con un ejemplo bien desarrollado alcanza; dos ejemplos superficiales valen menos que uno explicado.</li></ul></details>
    <div class="fctl"><input class="inp" id="eq" type="search" placeholder="Buscar: arancel, inflación, Paraguay…" value="${esc(Q)}" aria-label="Buscar ejemplo">
      <div class="seg" role="group" aria-label="Unidad">${[['all', 'Todas'], ['2', 'U2'], ['3', 'U3'], ['4', 'U4']].map(([v, l]) => `<button type="button" data-eu="${v}" aria-pressed="${U === v}">${l}</button>`).join('')}</div>
      <button type="button" class="btn sm" id="epy" aria-pressed="${PY}">${PY ? '✓ ' : ''}Solo Paraguay</button></div>
    <div id="elist">${list.length ? Object.keys(by).sort((a, b) => a.localeCompare(b, 'es', { numeric: true })).map(st => `<h2 class="wgroup">${st} · ${EJ_ST[st] || ''}</h2><div class="fgrid">${by[st].map(ejCard).join('')}</div>`).join('') : '<p class="muted">No hay ejemplos con esa búsqueda.</p>'}</div>
    <p class="small muted" style="margin-top:18px">Basado en la <i>Guía de ejemplos del mundo real</i> del Prof. Econ. Hugo Rivarola. Datos revisados con sus fuentes en octubre de 2026; si encuentras un dato desactualizado, avísale a tu profesor.</p>`;
  const eq = $('#eq');
  eq.oninput = () => { SESS.eQ = eq.value; const pos = eq.selectionStart; renderEjemplos(); const n = $('#eq'); n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) { } };
  app.querySelectorAll('[data-eu]').forEach(b => b.onclick = () => { SESS.eU = b.dataset.eu; renderEjemplos(); });
  $('#epy').onclick = () => { SESS.ePY = !PY; renderEjemplos(); };
  bindEjCopy(app);
}

const ejCopyTxt = x => `Un ejemplo del mundo real es ${x.t.charAt(0).toLowerCase() + x.t.slice(1)} (${x.w}). ${x.h} ${x.d[0]} Esto ilustra la teoría porque…`;
function bindEjCopy(root) { root.querySelectorAll('[data-ejc]').forEach(b => b.onclick = () => { const x = EJ.find(y => y.t === b.dataset.ejc); if (x) copyText(ejCopyTxt(x), b); }); }
function renderTopicRes(t, B) {
  const R = topicRes(t.id), sec = (h, n, body) => `<section class="rsec"><h2 class="wgroup">${h}<span>${n}</span></h2>${body}</section>`;
  const parts = [];
  if (R.atl.length) parts.push(sec('Diagramas en el Atlas', `${R.atl.length} fichas con el diagrama paso a paso`, `<div class="rlinks">${R.atl.map(([, id, n]) => `<a class="btn sm" href="${ATLAS}#${id}">${n}</a>`).join('')}</div>`));
  if (R.defs.length) parts.push(sec('Definiciones · Prueba 2 (a)', `${R.defs.length} términos de este subtema`, `<div class="rdefs">${R.defs.map(d => `<details><summary>${d[1]} ${defTag(d) || ''}</summary><p>${defHL(d)}</p></details>`).join('')}</div>
    <div class="row" style="margin-top:10px"><button class="btn primary sm" type="button" id="rDefP">Practicar estas ${R.defs.length} definiciones</button></div>`));
  if (R.ej.length) parts.push(sec('Ejemplos del mundo real', `${R.ej.length} para la Prueba 1 (b) y la Prueba 2 (g)`, `<div class="fgrid">${R.ej.map(ejCard).join('')}</div>`));
  if (R.forms.length) parts.push(sec('Fórmulas', `${R.forms.length} con ejemplo y calculadora`, `<div class="fgrid">${R.forms.map(formCard).join('')}</div>`));
  if (R.calc.length) parts.push(sec('Banco de cálculos · Prueba 2', `${R.calc.length} tipos con números nuevos`, `<div class="rlinks">${R.calc.map(c => `<button class="btn sm" type="button" data-go="calc-${c.k}">${c.n}</button>`).join('')}</div>`));
  B.innerHTML = parts.length ? parts.join('') : '<p class="muted">Este subtema todavía no tiene recursos conectados.</p>';
  bindEjCopy(B);
  B.querySelectorAll('[data-fk]').forEach(i => i.oninput = () => formRun(i.dataset.fk));
  R.forms.forEach(F => { if (F.in) formRun(F.k); });
  const dp = $('#rDefP'); if (dp) dp.onclick = () => { SESS.dSt = t.id; SESS.dM = 'prac'; SESS.dQ = null; go('escribir-def'); };
}
const topicResN = id => { const R = topicRes(id); return R.atl.length + R.defs.length + R.ej.length + R.forms.length + R.calc.length; };

/* Cajón «Ejemplos reales» para los entrenadores y simulacros: subtema conocido o adivinado por palabras clave. */
const ST_KW = [
  ['2.1', /\bdemanda\b(?! agregada)|sustitut|complementari|preferencias/], ['2.2', /\boferta\b(?! agregada)|sequia|cosecha|costos de produccion/],
  ['2.3', /equilibrio de mercado|mecanismo de precios|excedente del|opep|petroleo/], ['2.5', /elasticidad precio de la demanda|\bepd\b|elasticidad ingreso|\beid\b|ingreso total|bienes de lujo|cigarrillo|tabaco/],
  ['2.6', /elasticidad precio de la oferta|\bepo\b|materias primas/], ['2.7', /impuesto indirecto|impuesto (al|a la|a los|sobre)|subvencion|subsidio|precio maximo|precio minimo|salario minimo|control(es)? de precios/],
  ['2.8', /externalidad|contamina|meritori|perjudicial|tabaco|cigarrillo|alcohol|carbono|deforestacion|uso comun|pigou|vacuna|sobrepesca/], ['2.9', /bienes? publicos?|polizon|alumbrado/],
  ['3.1', /\bpib\b|\binb\b|ingreso nacional|flujo circular|ciclo economico|recesion/], ['3.2', /demanda agregada|oferta agregada|\bda\b|\boacp\b|\boalp\b/],
  ['3.3', /desempleo|inflacion|deflacion|crecimiento economico/], ['3.4', /desigualdad|pobreza|gini|lorenz|transferencias|progresiv|regresiv|tekopora/],
  ['3.5', /politica monetaria|tasa de interes|banco central|\bbcp\b|\btpm\b/], ['3.6', /politica fiscal|gasto publico|deficit fiscal|deficit presupuestario|deuda publica|inversion publica|responsabilidad fiscal|estimulo/],
  ['3.7', /lado de la oferta|privatiza|desregula|infraestructura|capacitacion|educacion|reforma laboral/], ['4.1', /libre comercio|exportacion|importacion|comercio internacional|apertura comercial/],
  ['4.2', /protecci|arancel|cuota|dumping|guerra comercial/], ['4.4', /mercosur|union europea|bloque comercial|integracion|acuerdo comercial|union aduanera/],
  ['4.5', /tipo de cambio|depreciacion|apreciacion|devaluacion|\bdolar|remesas/], ['4.6', /balanza de pagos|cuenta corriente|cuenta financiera|\bied\b|inversion extranjera/],
  ['4.7', /sostenib|\bods\b|medio ambiente|cambio climatico|emisiones/], ['4.8', /\bidh\b|desarrollo humano|indicadores? de desarrollo/],
  ['4.9', /barreras? al desarrollo|trampa de la pobreza|informal|corrupcion|dependencia/], ['4.10', /microcredito|microfinanc|ayuda externa|ayuda oficial|diversifica|estrategias? de (crecimiento|desarrollo)|orientad[ao]s? al mercado|inversion extranjera|\bied\b/]
];
function guessSts(txt) {
  const t = normTxt(String(txt || '').replace(/<[^>]+>/g, ' '));
  const sc = ST_KW.map(([st, re]) => [st, (t.match(new RegExp(re.source, 'g')) || []).length]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]);
  return sc.slice(0, 2).map(x => x[0]).flatMap(stsOf);
}
function ejMini(x) {
  return `<article class="ejmini"><div><span class="fu">${x.st}</span> <b>${x.t}</b> <span class="small muted">· ${x.w}${x.py ? ' · Paraguay' : ''}</span></div>
    <p class="small" style="margin:6px 0 4px">${x.h}</p><ul class="ejd small">${x.d.map(v => `<li>${v}</li>`).join('')}</ul>
    <p class="small" style="margin:4px 0"><b>Diagrama:</b> ${x.g}</p><p class="small" style="margin:4px 0"><b>Para evaluar:</b> ${x.e}</p>
    <button class="btn sm" type="button" data-ejc="${esc(x.t)}">Copiar como ejemplo</button></article>`;
}
/* sts: subtemas conocidos; txt: texto para adivinar si no hay subtema; note: aclaración opcional. */
function ejDrawer(root, o) {
  if (!root) return;
  let S = (o.sts || []).flatMap(stsOf);
  if (o.txt && (o.mix || !S.length)) S = [...new Set([...S, ...guessSts(o.txt)])];
  let list = EJ.filter(x => S.includes(x.st));
  if (!list.length && o.u) list = EJ.filter(x => x.st[0] === String(o.u));
  if (!list.length) return;
  const lbl = [...new Set(list.map(x => x.st))].join(', ');
  root.insertAdjacentHTML(o.pos || 'beforeend', `<details class="ejdrw"${o.open ? ' open' : ''}><summary>Ver ejemplos reales relacionados <span class="tag">${list.length} · ${lbl}</span></summary>
    ${o.note ? `<p class="small muted" style="margin:8px 0 0">${o.note}</p>` : ''}<div class="ejmgrid">${list.map(ejMini).join('')}</div>
    <p class="small muted" style="margin:8px 0 0">Úsalo con la regla C-A-D-I: contexto, año, dato e impacto. <a href="#escribir-ej">Ver todos los ejemplos</a></p></details>`);
  bindEjCopy(/^(afterend|beforebegin)$/.test(o.pos || '') ? root.parentNode : root);
}

render();
