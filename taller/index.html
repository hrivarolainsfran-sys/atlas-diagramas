<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Taller de práctica interactivo de Economía IB: Unidades 1 a 4.">
<title>Taller de Economía IB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&family=STIX+Two+Text:ital,wght@0,500;1,500&display=swap">
<style>
/* Layout: barra superior azul marino + una sola columna de trabajo sobre papel milimetrado; las fichas de práctica son la única superficie con borde fuerte */
:root{
  --paper:#F4F6FA; --sheet:#FFFFFF; --grid:#E2E8F1; --ink:#14213D; --ink-2:#3C4A66; --muted:#66748E; --rule:#D5DDE8;
  --navy:#1B2F5B; --navy-2:#24407A; --navy-ink:#FFFFFF; --gold:#B8862B; --gold-soft:#F6EBD3;
  --ok:#1C7A38; --ok-bg:#E4F3E8; --bad:#B42318; --bad-bg:#FCE9E7; --warn-bg:#FFF4E5; --warn-bd:#E2A13B; --warn-ink:#6A3F00;
  --k-d:#1F4E9E; --k-s:#C0392B; --k-soc:#6B3FA0; --k-new:#1E8E3E;
  --f-con:rgba(240,186,30,.50); --f-pro:rgba(39,174,96,.36); --f-dwl:rgba(47,128,237,.40); --f-gov:rgba(142,68,173,.16); --f-tr:rgba(184,134,43,.26);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-math:"STIX Two Text",Cambria,"Times New Roman",serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1524; --sheet:#141D30; --grid:#1C283F; --ink:#E7EDF7; --ink-2:#B9C4D8; --muted:#8C99B1; --rule:#2A3853;
  --navy:#1A2B4F; --navy-2:#2B4A86; --navy-ink:#FFFFFF; --gold:#E0B25A; --gold-soft:#3A2F17;
  --ok:#5FD38A; --ok-bg:#163423; --bad:#FF8A80; --bad-bg:#3A1A1A; --warn-bg:#33240C; --warn-bd:#C98A2A; --warn-ink:#FFDDA6;
  --k-d:#7EA9F2; --k-s:#F28B7F; --k-soc:#C39BF0; --k-new:#5FD38A;
  --f-con:rgba(240,186,30,.38); --f-pro:rgba(60,200,120,.30); --f-dwl:rgba(90,160,255,.38); --f-gov:rgba(180,120,230,.20); --f-tr:rgba(224,178,90,.24);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0E1524; --sheet:#141D30; --grid:#1C283F; --ink:#E7EDF7; --ink-2:#B9C4D8; --muted:#8C99B1; --rule:#2A3853;
  --navy:#1A2B4F; --navy-2:#2B4A86; --navy-ink:#FFFFFF; --gold:#E0B25A; --gold-soft:#3A2F17;
  --ok:#5FD38A; --ok-bg:#163423; --bad:#FF8A80; --bad-bg:#3A1A1A; --warn-bg:#33240C; --warn-bd:#C98A2A; --warn-ink:#FFDDA6;
  --k-d:#7EA9F2; --k-s:#F28B7F; --k-soc:#C39BF0; --k-new:#5FD38A;
  --f-con:rgba(240,186,30,.38); --f-pro:rgba(60,200,120,.30); --f-dwl:rgba(90,160,255,.38); --f-gov:rgba(180,120,230,.20); --f-tr:rgba(224,178,90,.24);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
b,strong{font-weight:700}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--navy);color:var(--navy-ink);
  padding-block:10px;padding-inline:max(16px,calc((100% - 1120px)/2));display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.05;margin-right:auto;background:none;border:0;color:inherit;text-align:left;padding:0}
.brand b{font-family:var(--f-display);font-size:24px;letter-spacing:.02em}
.brand span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{background:transparent;border:0;color:var(--navy-ink);padding:6px 11px;border-radius:6px;font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.02em}
.nav button:hover{background:rgba(255,255,255,.10)}
.nav button[aria-current="page"]{background:var(--sheet);color:var(--ink)}

main{max-width:1120px;margin:0 auto;padding-block:22px 64px;padding-inline:16px}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,4.6vw,44px);line-height:1.02;margin:4px 0 8px;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.1;margin:0 0 10px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:19px;letter-spacing:.03em;margin:0 0 6px}
.lede{color:var(--ink-2);max-width:66ch;margin:0 0 14px}
.muted{color:var(--muted)}
.small{font-size:14px}

/* botones */
.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:7px;padding:9px 15px;font-weight:700;font-size:15px;color:var(--ink)}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--navy-2);border-color:var(--navy-2);color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 11px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* inicio */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px;align-items:end;margin-bottom:26px}
.meter{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px}
.meter .num{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--grid);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .3s}
.unit-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:26px 0 10px;border-bottom:2px solid var(--ink);padding-bottom:6px}
.unit-h h2{margin:0}
.unit-h span{color:var(--muted);font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tile{display:grid;grid-template-columns:max-content minmax(0,1fr);align-content:start;gap:4px 12px;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px;color:var(--ink)}
.tile:hover{border-color:var(--gold)}
.tile .code{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;color:var(--navy-2);grid-row:span 3;min-width:46px;font-variant-numeric:tabular-nums}
:root[data-theme="dark"] .tile .code{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tile .code{color:var(--gold)}}
.tile .nm{font-weight:700;line-height:1.25}
.tile .ds{font-size:13.5px;color:var(--muted);line-height:1.35}
.tile .ft{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.tile .ft .bar{flex:1}
.tile.lab{border-color:var(--gold);background:linear-gradient(var(--gold-soft),var(--gold-soft)) top/100% 4px no-repeat,var(--sheet)}
.tile.lab .code{font-size:22px;color:var(--gold)}

/* tema */
.crumb{background:none;border:0;padding:0;color:var(--muted);font-size:14px;text-decoration:underline}
.seg{display:inline-flex;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 13px;border-radius:6px;font-weight:700;font-size:14.5px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--navy-2);color:#fff}
.essentials{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:18px 20px;max-width:780px}
.essentials ul{margin:0;padding-left:20px;display:grid;gap:8px}
.essentials .trap{margin-top:14px;background:var(--warn-bg);border:1px solid var(--warn-bd);color:var(--warn-ink);border-radius:6px;padding:10px 12px;font-size:15px}
.formula{font-family:var(--f-math);font-size:17px;background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:2px 8px;display:inline-block}

/* ficha de práctica */
.card{background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r);max-width:820px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--rule)}
.card-h .k{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--rule);border-radius:99px;padding:2px 9px;color:var(--ink-2)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots button{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--rule);background:var(--sheet);font-size:11px;font-weight:700;color:var(--muted);padding:0;font-variant-numeric:tabular-nums}
.dots button.cur{border-color:var(--ink);color:var(--ink)}
.dots button.ok{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.dots button.no{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.card-b{padding:18px 18px 8px}
.q{font-size:17px;margin:0 0 14px;max-width:68ch}
.q table{border-collapse:collapse;margin-top:10px;font-size:15px;font-variant-numeric:tabular-nums}
.q th,.q td{border:1px solid var(--rule);padding:5px 12px;text-align:center}
.q th{background:var(--paper)}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;text-align:left;background:var(--paper);border:1.5px solid var(--rule);border-radius:7px;padding:10px 12px;font-size:15.5px;color:var(--ink)}
.opt .l{font-family:var(--f-display);font-weight:700;font-size:17px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--muted);line-height:1}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt.sel{border-color:var(--navy-2)}
.opt.right{background:var(--ok-bg);border-color:var(--ok)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{margin:14px 0 4px;border-radius:7px;padding:11px 14px;font-size:15px;line-height:1.5}
.fb.ok{background:var(--ok-bg);border:1px solid var(--ok)}
.fb.no{background:var(--bad-bg);border:1px solid var(--bad)}
.fb.info{background:var(--paper);border:1px solid var(--rule)}
.fb b.h{display:block;font-family:var(--f-display);font-size:18px;letter-spacing:.03em;margin-bottom:2px}
.fb.ok b.h{color:var(--ok)} .fb.no b.h{color:var(--bad)}
.card-f{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 16px 16px}

/* clasificar */
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:46px;padding:10px;border:1.5px dashed var(--rule);border-radius:7px;margin-bottom:12px}
.pool:empty::after{content:"Todas las tarjetas están ubicadas. Presiona “Comprobar”.";color:var(--muted);font-size:14px;align-self:center}
.chipx{border:1.5px solid var(--rule);background:var(--paper);border-radius:6px;padding:7px 10px;font-size:14.5px;text-align:left;line-height:1.3;color:var(--ink);max-width:100%}
.chipx.sel{border-color:var(--gold);background:var(--gold-soft);box-shadow:0 0 0 2px var(--gold)}
.chipx.right{border-color:var(--ok);background:var(--ok-bg)}
.chipx.wrong{border-color:var(--bad);background:var(--bad-bg)}
.chipx .fix{display:block;font-size:12px;color:var(--bad);margin-top:2px}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.bin{border:1.5px solid var(--ink-2);border-radius:7px;padding:8px;min-height:90px;background:var(--sheet);display:flex;flex-direction:column;gap:6px;text-align:left}
.bin.armed{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft)}
.bin.over{background:var(--gold-soft)}
.bin h4{margin:0 0 2px;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-2)}
.hint{font-size:13.5px;color:var(--muted);margin:-6px 0 10px}

/* cálculo */
.calc{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.calc input{width:160px;max-width:100%;border:1.5px solid var(--ink-2);background:var(--sheet);border-radius:7px;padding:9px 11px;font-size:17px;font-variant-numeric:tabular-nums}
.sol{font-size:15px;line-height:1.6}
.sol .formula{margin:2px 0}

/* laboratorios */
.lab{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
.figure{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:8px}
.figure svg{display:block;width:100%;height:auto;touch-action:manipulation}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:16px;display:grid;gap:14px;min-width:0}
.ctl label,.ctl .lbl{display:block;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.ctl input[type=range]{width:100%;accent-color:var(--gold)}
.readout{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.readout td{border-bottom:1px solid var(--rule);padding:6px 4px}
.readout td:last-child{text-align:right;font-weight:700}
.sw{display:inline-block;width:13px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px;border:1px solid var(--rule)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink-2);padding:6px 6px 2px}
.scen{background:var(--gold-soft);border:1px solid var(--gold);border-radius:7px;padding:12px 14px}
.scen .mk{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
.scen p{margin:4px 0 0;font-size:17px;font-weight:700}
.pick{display:grid;gap:10px}
.pick .ctl .seg{width:100%}
.pick .ctl .seg button{flex:1}
.score{font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}

/* svg */
svg text{font-family:var(--f-math)}
.ax{stroke:var(--ink);stroke-width:1.6;fill:none}
.gd{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4;fill:none}
.cv{fill:none;stroke-width:2.6;stroke-linecap:round}
.cv.old{stroke-dasharray:7 5;stroke-width:2}
.c-d{stroke:var(--k-d)} .c-s{stroke:var(--k-s)} .c-soc{stroke:var(--k-soc)} .c-new{stroke:var(--k-new)} .c-ink{stroke:var(--ink)} .c-gold{stroke:var(--gold)}
.t-d{fill:var(--k-d)} .t-s{fill:var(--k-s)} .t-soc{fill:var(--k-soc)} .t-new{fill:var(--k-new)} .t-ink{fill:var(--ink)} .t-gold{fill:var(--gold)}
.a-con{fill:var(--f-con)} .a-pro{fill:var(--f-pro)} .a-dwl{fill:var(--f-dwl)} .a-gov{fill:var(--f-gov);stroke:var(--k-soc);stroke-dasharray:5 4;stroke-width:1.2} .a-tr{fill:var(--f-tr)}
.cl{font-size:15px;font-style:italic;font-weight:500;paint-order:stroke;stroke:var(--sheet);stroke-width:4px;stroke-linejoin:round}
.tk{font-size:12.5px;fill:var(--ink);font-style:italic;paint-order:stroke;stroke:var(--sheet);stroke-width:3px}
.axl{font-size:12.5px;fill:var(--ink-2);font-family:var(--f-body)!important}
.pt{fill:var(--ink)}
.pl{font-size:13px;fill:var(--ink);font-weight:500;paint-order:stroke;stroke:var(--sheet);stroke-width:3px}
.mark-in{fill:var(--bad)} .mark-on{fill:var(--ok)} .mark-out{fill:var(--gold)}
.ah{fill:var(--ink-2)}

/* tarjetas */
.flash{max-width:620px;min-height:240px;background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r);padding:26px 24px;display:flex;flex-direction:column;justify-content:center;gap:10px;text-align:left;width:100%;color:var(--ink)}
.flash .term{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,5vw,38px);line-height:1.05}
.flash .def{font-size:17px;max-width:56ch}
.flash .cue{font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}

/* examen */
.choice-chips{display:flex;flex-wrap:wrap;gap:6px}
.choice-chips button{border:1.5px solid var(--rule);background:var(--sheet);border-radius:99px;padding:5px 12px;font-size:14px;font-weight:700;color:var(--ink-2)}
.choice-chips button[aria-pressed="true"]{border-color:var(--navy-2);background:var(--navy-2);color:#fff}
.review{display:grid;gap:10px;max-width:820px}
.review .it{background:var(--sheet);border:1px solid var(--rule);border-left:5px solid var(--ok);border-radius:6px;padding:10px 14px;font-size:15px}
.review .it.no{border-left-color:var(--bad)}
.foot{color:var(--muted);font-size:13px;margin-top:40px;border-top:1px solid var(--rule);padding-top:12px}

@media (max-width:860px){
  .hero{grid-template-columns:1fr}
  .lab{grid-template-columns:1fr}
  .top{gap:6px}
  .nav{width:100%;flex-wrap:wrap;gap:2px}
  .nav button{font-size:15px;padding:5px 8px;white-space:nowrap}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<header class="top">
  <button class="brand" type="button" data-go="inicio"><b>Economía IB</b><span>Taller de práctica</span></button>
  <nav class="nav" aria-label="Secciones">
    <button type="button" data-go="inicio">Temas</button>
    <button type="button" data-go="labs">Laboratorios</button>
    <button type="button" data-go="examen">Examen rápido</button>
    <button type="button" data-go="tarjetas">Tarjetas</button>
  </nav>
</header>
<main id="app"></main>

<script>
'use strict';
/* =============== utilidades =============== */
const $ = (s, r = document) => r.querySelector(s);
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = (n, d = 0) => { const s = Math.abs(n).toFixed(d); let [i, f] = s.split('.'); i = i.replace(/\B(?=(\d{3})+(?!\d))/g, '.'); return (n < 0 && Number(s) !== 0 ? '−' : '') + i + (f ? ',' + f : ''); };
const gs = n => 'Gs. ' + fmt(n);
const r2 = n => Math.round(n * 100) / 100;
function parseNum(s) {
  s = String(s).trim().replace(/\s/g, '').replace('−', '-');
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  return Number(s);
}
const store = {
  get(k, d) { try { const v = localStorage.getItem('tallerEco.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('tallerEco.' + k, JSON.stringify(v)); } catch (e) { } }
};
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

/* =============== generadores de cálculo =============== */
const GEN = {
  cpp() {
    const [X, Y] = pick([['soja', 'carne'], ['bienes de capital', 'bienes de consumo'], ['maíz', 'algodón'], ['computadoras', 'muebles']]);
    const d = [ri(2, 5)]; for (let i = 1; i < 4; i++) d.push(d[i - 1] + ri(2, 5));
    const tot = d.reduce((a, b) => a + b, 0);
    const y = [tot]; d.forEach(v => y.push(y[y.length - 1] - v));
    const x = [0, 10, 20, 30, 40], L = ['A', 'B', 'C', 'D', 'E'];
    const i = ri(0, 3);
    const tbl = `<table><tr><th>Punto</th>${L.map(l => `<th>${l}</th>`).join('')}</tr><tr><th>${X}</th>${x.map(v => `<td>${v}</td>`).join('')}</tr><tr><th>${Y}</th>${y.map(v => `<td>${v}</td>`).join('')}</tr></table>`;
    return {
      q: `La tabla muestra puntos sobre la CPP de una economía (unidades por año). ¿Cuál es el <b>costo de oportunidad</b> de pasar del punto <b>${L[i]}</b> al punto <b>${L[i + 1]}</b>? Responde en unidades de ${Y}.${tbl}`,
      ans: d[i], tol: 0, unit: `unidades de ${Y}`,
      sol: `Al pasar de ${L[i]} a ${L[i + 1]}, la producción de ${X} sube de ${x[i]} a ${x[i + 1]} y la de ${Y} baja de ${y[i]} a ${y[i + 1]}.<br><span class="formula">${y[i]} − ${y[i + 1]} = ${d[i]}</span> unidades de ${Y}.<br>Los tramos cuestan ${d.join(', ')}: cada 10 unidades de ${X} cuestan más que las anteriores. Es el <b>costo de oportunidad creciente</b> que da a la CPP su forma cóncava.`
    };
  },
  dsum(kind) {
    const names = ['Lucía', 'Mateo', 'Sofía'];
    const prod = kind === 'd' ? pick(['chipas por semana', 'pasajes de colectivo por semana', 'botellas de agua por semana']) : pick(['bolsas de mandioca por semana', 'docenas de huevos por semana', 'kilos de tomate por semana']);
    const who = kind === 'd' ? names : ['Granja Ña Rosa', 'Huerta San José', 'Finca Itá'];
    const P = [3000, 5000, 7000];
    const rows = who.map(() => { const top = ri(6, 14), st = ri(1, 3); return kind === 'd' ? [top, top - st, top - 2 * st] : [top - 2 * st, top - st, top]; });
    const j = ri(0, 2);
    const ans = rows.reduce((s, r) => s + r[j], 0);
    const tbl = `<table><tr><th>Precio</th>${who.map(n => `<th>${n}</th>`).join('')}</tr>${P.map((p, k) => `<tr><th>${gs(p)}</th>${rows.map(r => `<td>${r[k]}</td>`).join('')}</tr>`).join('')}</table>`;
    return {
      q: `${kind === 'd' ? 'Demanda individual' : 'Oferta individual'} de ${prod} en un mercado pequeño. ¿Cuál es la <b>cantidad ${kind === 'd' ? 'demandada' : 'ofrecida'} del mercado</b> a un precio de <b>${gs(P[j])}</b>?${tbl}`,
      ans, tol: 0, unit: 'unidades',
      sol: `La ${kind === 'd' ? 'demanda' : 'oferta'} de mercado es la <b>suma horizontal</b>: se suman las cantidades de todos a un mismo precio.<br><span class="formula">${rows.map(r => r[j]).join(' + ')} = ${ans}</span>`
    };
  },
  table(prices) {
    const e = ri(1, 3), s0 = ri(10, 20), ss = ri(8, 12), sd = ri(8, 14);
    const Qs = prices.map((_, k) => s0 + k * ss);
    const Qd = prices.map((_, k) => Qs[e] + (e - k) * sd);
    return { e, Qs, Qd };
  },
  eqmc() {
    const P = [4000, 6000, 8000, 10000, 12000];
    const { e, Qs, Qd } = GEN.table(P);
    const prod = pick(['termos', 'remeras de la Albirroja', 'kilos de queso Paraguay', 'tortas para cumpleaños']);
    const tbl = `<table><tr><th>Precio</th><th>Qd</th><th>Qo</th></tr>${P.map((p, k) => `<tr><td>${gs(p)}</td><td>${Qd[k]}</td><td>${Qs[k]}</td></tr>`).join('')}</table>`;
    return {
      t: 'mc', q: `Mercado de ${prod} (cantidades por semana). ¿Cuál es el <b>precio de equilibrio</b>?${tbl}`,
      o: P.slice(0, 4).map(gs).concat([]), a: e,
      e: `En ${gs(P[e])} la cantidad demandada (${Qd[e]}) es igual a la ofrecida (${Qs[e]}). Por encima hay exceso de oferta; por debajo, exceso de demanda.`
    };
  },
  excess() {
    const P = [4000, 6000, 8000, 10000, 12000];
    const { e, Qs, Qd } = GEN.table(P);
    let j; do { j = ri(0, 4); } while (j === e);
    const prod = pick(['termos', 'mochilas escolares', 'helados', 'entradas al cine']);
    const tbl = `<table><tr><th>Precio</th><th>Qd</th><th>Qo</th></tr>${P.map((p, k) => `<tr><td>${gs(p)}</td><td>${Qd[k]}</td><td>${Qs[k]}</td></tr>`).join('')}</table>`;
    const ex = Qd[j] - Qs[j];
    return {
      q: `Mercado de ${prod}. Si el precio fuera <b>${gs(P[j])}</b>, ¿de cuántas unidades sería el desequilibrio (exceso de demanda u oferta)?${tbl}`,
      ans: Math.abs(ex), tol: 0, unit: 'unidades',
      sol: `A ${gs(P[j])}: Qd = ${Qd[j]} y Qo = ${Qs[j]}. <span class="formula">|${Qd[j]} − ${Qs[j]}| = ${Math.abs(ex)}</span><br>${ex > 0 ? '<b>Exceso de demanda</b> (escasez): el precio está por debajo del equilibrio y tiende a <b>subir</b>.' : '<b>Exceso de oferta</b> (excedente): el precio está por encima del equilibrio y tiende a <b>bajar</b>.'} El equilibrio está en ${gs(P[e])}.`
    };
  },
  ceiling() {
    const P = [1500000, 2000000, 2500000, 3000000, 3500000];
    const { e, Qs, Qd } = GEN.table(P);
    const j = ri(0, e - 1);
    const tbl = `<table><tr><th>Alquiler mensual</th><th>Qd</th><th>Qo</th></tr>${P.map((p, k) => `<tr><td>${gs(p)}</td><td>${Qd[k]}</td><td>${Qs[k]}</td></tr>`).join('')}</table>`;
    return {
      q: `Mercado de departamentos en alquiler en una ciudad (datos hipotéticos, en cientos de departamentos). El gobierno fija un <b>precio máximo</b> de <b>${gs(P[j])}</b>. ¿De cuánto es la escasez (exceso de demanda)?${tbl}`,
      ans: Qd[j] - Qs[j], tol: 0, unit: 'cientos de departamentos',
      sol: `El equilibrio está en ${gs(P[e])}; el precio máximo está <b>por debajo</b>, así que es vinculante.<br>A ${gs(P[j])}: Qd = ${Qd[j]}, Qo = ${Qs[j]}. <span class="formula">${Qd[j]} − ${Qs[j]} = ${Qd[j] - Qs[j]}</span><br>Solo se alquilan ${Qs[j]} (la cantidad ofrecida). Pueden surgir listas de espera y mercados paralelos.`
    };
  },
  ped() {
    const items = [['porciones de chipa', 5000], ['pasajes de colectivo', 3400], ['kilos de carne vacuna', 45000], ['litros de nafta', 8000], ['entradas de cine', 40000], ['planes de datos móviles', 50000]];
    const [prod, P1] = pick(items);
    const pp = pick([5, 10, 20, 25]), up = Math.random() < .6;
    const target = pick([0.2, 0.4, 0.5, 0.6, 0.8, 1.2, 1.5, 2, 2.5]);
    const Q1 = pick([200, 400, 500, 800, 1000, 1200, 2000]);
    const P2 = Math.round(P1 * (1 + (up ? 1 : -1) * pp / 100));
    const Q2 = Math.round(Q1 * (1 - (up ? 1 : -1) * target * pp / 100));
    const dq = (Q2 - Q1) / Q1 * 100, dp = (P2 - P1) / P1 * 100;
    const v = Math.abs(dq / dp);
    const cls = v > 1 ? 'elástica (EPD > 1)' : v < 1 ? 'inelástica (EPD < 1)' : 'de elasticidad unitaria';
    return {
      q: `El precio de los ${prod} ${up ? 'sube' : 'baja'} de <b>${gs(P1)}</b> a <b>${gs(P2)}</b>, y la cantidad demandada ${up ? 'baja' : 'sube'} de <b>${fmt(Q1)}</b> a <b>${fmt(Q2)}</b> por día. Calcula la <b>EPD</b> (valor absoluto, 2 decimales).`,
      ans: r2(v), tol: 0.015, unit: '',
      sol: `<span class="formula">%ΔQd = (${fmt(Q2)} − ${fmt(Q1)}) ÷ ${fmt(Q1)} × 100 = ${fmt(dq, 1)}%</span><br><span class="formula">%ΔP = (${fmt(P2)} − ${fmt(P1)}) ÷ ${fmt(P1)} × 100 = ${fmt(dp, 1)}%</span><br><span class="formula">EPD = |${fmt(dq, 1)} ÷ ${fmt(dp, 1)}| = ${fmt(v, 2)}</span><br>La demanda es <b>${cls}</b>.`
    };
  },
  yed() {
    const groups = {
      lux: [['cenas en restaurantes', [1.5, 2, 2.5]], ['viajes al exterior', [1.5, 2, 3]]],
      nec: [['kilos de arroz', [0.2, 0.3, 0.5]], ['litros de leche', [0.3, 0.5, 0.8]]],
      inf: [['pasajes de colectivo', [-0.5, -1, -1.5]], ['paquetes de fideos de marca económica', [-0.5, -1]]]
    };
    const g = pick(['lux', 'nec', 'inf']);
    const [prod, ts] = pick(groups[g]);
    const target = pick(ts);
    const Y1 = pick([3000000, 4000000, 5000000]), pct = pick([10, 20, 25]);
    const Y2 = Y1 * (1 + pct / 100);
    const Q1 = pick([200, 400, 500, 1000]);
    const Q2 = Math.round(Q1 * (1 + target * pct / 100));
    const dq = (Q2 - Q1) / Q1 * 100;
    const v = dq / pct;
    const cls = v < 0 ? 'un <b>bien inferior</b> (YED negativa)' : v > 1 ? 'un <b>bien normal de lujo</b> (YED > 1)' : 'un <b>bien normal de primera necesidad</b> (0 < YED < 1)';
    return {
      q: `El ingreso mensual promedio de los hogares de una ciudad sube de <b>${gs(Y1)}</b> a <b>${gs(Y2)}</b>. La cantidad demandada de ${prod} pasa de <b>${fmt(Q1)}</b> a <b>${fmt(Q2)}</b> (miles por mes). Calcula la <b>YED</b> (con su signo, 2 decimales).`,
      ans: r2(v), tol: 0.015, unit: '',
      sol: `<span class="formula">%ΔQd = (${fmt(Q2)} − ${fmt(Q1)}) ÷ ${fmt(Q1)} × 100 = ${fmt(dq, 1)}%</span><br><span class="formula">%ΔY = ${pct}%</span><br><span class="formula">YED = ${fmt(dq, 1)} ÷ ${pct} = ${fmt(v, 2)}</span><br>Es ${cls}. En la YED el signo importa: no se usa valor absoluto.`
    };
  },
  pes() {
    const items = [['kilos de tomate', 6000], ['remeras estampadas', 40000], ['bolsas de cemento', 60000], ['docenas de huevos', 20000]];
    const [prod, P1] = pick(items);
    const pp = pick([10, 20, 25]), up = Math.random() < .7;
    const target = pick([0.3, 0.5, 0.8, 1.5, 2, 2.5]);
    const Q1 = pick([400, 500, 800, 1000, 2000]);
    const P2 = Math.round(P1 * (1 + (up ? 1 : -1) * pp / 100));
    const Q2 = Math.round(Q1 * (1 + (up ? 1 : -1) * target * pp / 100));
    const dq = (Q2 - Q1) / Q1 * 100, dp = (P2 - P1) / P1 * 100, v = dq / dp;
    return {
      q: `El precio de las ${prod} ${up ? 'sube' : 'baja'} de <b>${gs(P1)}</b> a <b>${gs(P2)}</b> y la cantidad ofrecida ${up ? 'sube' : 'baja'} de <b>${fmt(Q1)}</b> a <b>${fmt(Q2)}</b> por semana. Calcula la <b>EPO</b> (2 decimales).`,
      ans: r2(v), tol: 0.015, unit: '',
      sol: `<span class="formula">%ΔQo = ${fmt(dq, 1)}%</span> &nbsp; <span class="formula">%ΔP = ${fmt(dp, 1)}%</span><br><span class="formula">EPO = ${fmt(dq, 1)} ÷ ${fmt(dp, 1)} = ${fmt(v, 2)}</span><br>La oferta es <b>${v > 1 ? 'elástica (EPO > 1)' : 'inelástica (EPO < 1)'}</b>. La EPO es positiva porque precio y cantidad ofrecida se mueven en la misma dirección.`
    };
  },
  trmc() {
    const prod = pick(['entradas a un parque acuático', 'pasajes Asunción–Encarnación', 'cortes de pelo en una barbería', 'kilos de yerba de una marca']);
    const kind = pick(['el', 'el', 'in', 'in', 'un']);
    const v = kind === 'el' ? pick([1.5, 2, 2.4]) : kind === 'in' ? pick([0.2, 0.4, 0.7]) : 1;
    const up = Math.random() < .5;
    const ans = kind === 'un' ? 2 : ((kind === 'in') === up ? 0 : 1);
    const why = kind === 'un' ? 'Con EPD = 1, el cambio porcentual de la cantidad compensa exactamente el del precio: el ingreso total no cambia.'
      : kind === 'in' ? `Con demanda inelástica (EPD = ${fmt(v, 1)}), la cantidad cambia proporcionalmente menos que el precio, así que domina el efecto precio: el ingreso total se mueve en la <b>misma dirección que el precio</b>.`
        : `Con demanda elástica (EPD = ${fmt(v, 1)}), la cantidad cambia proporcionalmente más que el precio, así que domina el efecto cantidad: el ingreso total se mueve en la <b>dirección contraria al precio</b>.`;
    return {
      t: 'mc', q: `La EPD de los ${prod} es <b>${fmt(v, 1)}</b>. Si la empresa <b>${up ? 'sube' : 'baja'}</b> el precio un 10%, ¿qué ocurre con su ingreso total?`,
      o: ['Aumenta', 'Disminuye', 'No cambia'], a: ans, fixed: true, e: why
    };
  },
  tax() {
    const prod = pick([['paquetes de cigarrillos', 15000], ['botellas de cerveza', 10000], ['litros de gaseosa', 8000]]);
    const P0 = prod[1], t = pick([1000, 2000, 3000]), c = pick([0.2, 0.4, 0.6, 0.8]);
    const Pc = P0 + Math.round(c * t), Pp = Pc - t, Qt = pick([20, 30, 40, 50, 60]);
    const mode = pick(['prod', 'rev', 'cons']);
    const base = `Mercado de ${prod[0]} (datos hipotéticos). Antes del impuesto: precio <b>${gs(P0)}</b>. El gobierno aplica un impuesto específico de <b>${gs(t)}</b> por unidad. En el nuevo equilibrio el consumidor paga <b>${gs(Pc)}</b> y se venden <b>${Qt} mil</b> unidades.`;
    if (mode === 'prod') return {
      q: base + ' ¿Cuánto del impuesto <b>por unidad</b> soporta el productor (en Gs.)?', ans: P0 - Pp, tol: 0, unit: 'Gs. por unidad',
      sol: `El productor recibe el precio pagado menos el impuesto: <span class="formula">${fmt(Pc)} − ${fmt(t)} = ${fmt(Pp)}</span>.<br>Antes recibía ${fmt(P0)}, así que su incidencia es <span class="formula">${fmt(P0)} − ${fmt(Pp)} = ${fmt(P0 - Pp)}</span> Gs. por unidad (área verde en el diagrama). El consumidor soporta ${fmt(Pc - P0)} Gs. (área amarilla).`
    };
    if (mode === 'rev') return {
      q: base + ' ¿Cuánto <b>recauda</b> el gobierno? Responde en <b>millones de Gs.</b>', ans: t * Qt * 1000 / 1e6, tol: 0, unit: 'millones de Gs.',
      sol: `Recaudación = impuesto por unidad × cantidad vendida después del impuesto.<br><span class="formula">${fmt(t)} × ${fmt(Qt * 1000)} = ${fmt(t * Qt * 1000)}</span> Gs. = <b>${fmt(t * Qt / 1000, 0)} millones</b>.<br>Se usa la cantidad <b>después</b> del impuesto, no la original.`
    };
    return {
      q: base + ' ¿Cuál es la <b>incidencia total sobre los consumidores</b>? Responde en <b>millones de Gs.</b>', ans: r2((Pc - P0) * Qt * 1000 / 1e6), tol: 0.001, unit: 'millones de Gs.',
      sol: `Incidencia por unidad del consumidor: <span class="formula">${fmt(Pc)} − ${fmt(P0)} = ${fmt(Pc - P0)}</span> Gs.<br>Total: <span class="formula">${fmt(Pc - P0)} × ${fmt(Qt * 1000)} = ${fmt((Pc - P0) * Qt * 1000)}</span> Gs. = <b>${fmt(c * t * Qt / 1000, 0)} millones</b> (área amarilla).`
    };
  },
  growth() {
    const Y1 = pick([40, 42.5, 45, 50, 56]), g = pick([-2, -1.5, 1.5, 2, 3.5, 4, 4.5, 5]);
    const Y2 = Math.round(Y1 * (1 + g / 100) * 10) / 10;
    const v = (Y2 - Y1) / Y1 * 100;
    return {
      q: `El PIB real de una economía pasa de <b>US$ ${fmt(Y1, 1)} mil millones</b> a <b>US$ ${fmt(Y2, 1)} mil millones</b> en un año. Calcula la <b>tasa de crecimiento económico</b> (%, con 1 decimal).`,
      ans: Math.round(v * 10) / 10, tol: 0.051, unit: '%',
      sol: `<span class="formula">(${fmt(Y2, 1)} − ${fmt(Y1, 1)}) ÷ ${fmt(Y1, 1)} × 100 = ${fmt(v, 1)}%</span><br>${v < 0 ? 'Es un crecimiento <b>negativo</b>: si se repite dos trimestres seguidos, la economía está en recesión.' : 'El PIB real aumentó: hay crecimiento económico.'} Se usa el PIB <b>real</b> para que la inflación no infle el resultado.`
    };
  },
  percap() {
    const pop = pick([4, 5, 6, 8]), pc = pick([3000, 4500, 6000, 7500, 9000, 12000]);
    const Y = pc * pop / 1000;
    return {
      q: `Un país tiene un PIB de <b>US$ ${fmt(Y, 0)} mil millones</b> y una población de <b>${pop} millones</b> de habitantes. Calcula el <b>PIB per cápita</b> en dólares.`,
      ans: pc, tol: 1, unit: 'US$ por habitante',
      sol: `<span class="formula">${fmt(Y * 1e9)} ÷ ${fmt(pop * 1e6)} = ${fmt(pc)}</span> dólares por habitante.<br>El per cápita es un promedio: no muestra cómo se reparte el ingreso entre las personas.`
    };
  }
};

      { t: 'sort', q: 'Clasifica cada rasgo según el sistema económico.', bins: ['Libre mercado', 'Planificación central'], items: [['Un organismo estatal fija las metas de producción', 1], ['Empresas privadas buscan obtener ganancias', 0], ['Los bienes se reparten según la capacidad de pago', 0], ['El Estado es dueño de los factores de producción', 1], ['La soberanía del consumidor decide qué se produce', 0], ['Los precios los fija el gobierno', 1]], e: 'En el libre mercado decide el mecanismo de precios; en la planificación central, el Estado. Las economías reales, como la paraguaya, son mixtas.' },
      { t: 'mc', q: 'En una <b>economía mixta</b> como la paraguaya…', o: ['Conviven empresas privadas y la provisión estatal de algunos bienes y servicios', 'El Estado fija todos los precios', 'No existe ninguna intervención del gobierno', 'Solo producen empresas públicas'], a: 0, e: 'Ejemplo: empresas privadas en el agro y el comercio, junto con ANDE en electricidad y escuelas y hospitales públicos.' },
      { t: 'gen', g: 'cpp' },
      { t: 'mc', q: 'Las tres preguntas económicas básicas que responde todo sistema son:', o: ['¿Qué producir?, ¿cómo producir? y ¿para quién producir?', '¿Cuánto cuesta?, ¿quién paga? y ¿cuándo se cobra?', '¿Qué exportar?, ¿qué importar? y ¿a qué precio?', '¿Quién gobierna?, ¿quién vota? y ¿quién decide?'], a: 0, e: 'Toda sociedad debe decidir qué bienes producir, con qué métodos y recursos, y cómo distribuirlos.' }

  {
    id: '1.2', u: 1, name: '¿Cómo abordan los economistas el mundo?', ds: 'Economía positiva y normativa, método, ceteris paribus y pensamiento económico', labs: [],
    ess: [
      'La economía es una <b>ciencia social</b>: estudia el comportamiento humano y no puede hacer experimentos controlados de laboratorio. Prueba sus teorías con <b>evidencia empírica</b> (datos y observación).',
      '<b>Afirmación positiva</b>: se puede comprobar como verdadera o falsa con datos. <b>Afirmación normativa</b>: es un juicio de valor; suele incluir “debería”, “es injusto”, “es mejor”.',
      '<b>Ceteris paribus</b>: “todo lo demás constante”. Permite aislar el efecto de una variable sobre otra.',
      '<b>Modelos</b> (como la CPP o el flujo circular): simplifican la realidad para explicar y predecir.',
      '<b>Pensadores</b>: Adam Smith (mercados libres), Marx (crítica del capitalismo), Keynes (intervención del gobierno en las crisis), Friedman (monetarismo), Thaler (economía conductual, nudges), Raworth (economía de la dona).'
    ],
    trap: 'Una afirmación <b>falsa</b> puede ser positiva: “Subir el precio aumenta las ventas” es positiva porque se puede comprobar (y refutar) con datos.',
    items: [
      { t: 'sort', q: '¿Afirmación positiva o normativa?', bins: ['Positiva', 'Normativa'], items: [['Si sube el precio de la nafta, baja la cantidad demandada de nafta', 0], ['El gobierno debería subir el salario mínimo', 1], ['Un impuesto a las bebidas azucaradas reducirá su consumo', 0], ['Es injusto que los futbolistas ganen tanto', 1], ['La educación debería ser gratuita en todos los niveles', 1], ['Bajar la tasa de interés aumentará el crédito a las empresas', 0], ['Paraguay debería exportar menos soja y más productos industrializados', 1], ['Subir el precio de la chipa aumentará la cantidad vendida', 0]], e: 'Las positivas se pueden comprobar con datos, aunque resulten falsas (la última lo es). Las normativas expresan juicios de valor y no se pueden demostrar con evidencia.' },
      { t: 'mc', q: '“Si sube el precio del pasaje de colectivo, menos personas viajarán en colectivo, <i>ceteris paribus</i>”. ¿Qué significa <i>ceteris paribus</i> aquí?', o: ['Que los demás factores (ingresos, precio de la nafta, etc.) se mantienen constantes', 'Que el resultado está garantizado', 'Que es una opinión del economista', 'Que la relación solo vale en Paraguay'], a: 0, e: 'Ceteris paribus aísla la relación precio–cantidad suponiendo que nada más cambia al mismo tiempo.' },
      { t: 'mc', q: '¿Por qué la economía no puede probar sus teorías como la física o la química?', o: ['Estudia el comportamiento humano y no puede hacer experimentos controlados; usa evidencia empírica y observación', 'Porque no usa datos', 'Porque todas sus afirmaciones son normativas', 'Porque los economistas no usan modelos'], a: 0, e: 'No se puede “encerrar” una economía en un laboratorio. Se observa lo que pasó y se analizan datos (por ejemplo, qué ocurrió con las ventas tras una baja de precio).' },
      { t: 'sort', q: 'Une cada idea con su economista.', bins: ['Adam Smith', 'Karl Marx', 'J. M. Keynes', 'Milton Friedman', 'Richard Thaler', 'Kate Raworth'], items: [['Mercados libres (laissez-faire) e intercambio sin restricciones', 0], ['Crítica del capitalismo y de la acumulación de riqueza de los industriales', 1], ['Mayor papel del gobierno para salir de una depresión', 2], ['La oferta monetaria determina la inflación', 3], ['Los “empujones” (nudges) influyen en las decisiones', 4], ['Satisfacer las necesidades sociales sin superar los límites del planeta', 5]], e: 'Smith: Riqueza de las Naciones (1776). Marx: crítico del capitalismo. Keynes: Teoría general (1936). Friedman: monetarismo. Thaler: Nobel 2017 por economía conductual. Raworth: economía de la dona.' },
      { t: 'mc', q: 'La <b>economía conductual</b> se diferencia del pensamiento clásico porque…', o: ['Acepta que las personas no siempre deciden de forma racional y estudia por qué', 'Supone que todos maximizan su utilidad sin errores', 'Solo estudia a los gobiernos', 'Rechaza el uso de datos'], a: 0, e: 'Combina economía y psicología. Ejemplo: ubicar dulces junto a la caja del supermercado para aumentar las compras impulsivas.' },
      { t: 'mc', q: '¿Cuál es una afirmación <b>positiva</b>?', o: ['Si el IVA sube del 10% al 12%, los precios al consumidor aumentarán', 'El IVA debería bajar para ayudar a las familias', 'Es injusto cobrar IVA a los alimentos', 'El gobierno tendría que gastar más en salud'], a: 0, e: 'La primera se puede comprobar observando los precios. Las demás contienen juicios de valor (“debería”, “injusto”, “tendría que”).' },
      { t: 'mc', q: '¿Para qué sirve un modelo económico como la CPP?', o: ['Simplifica la realidad para explicar y predecir relaciones entre variables', 'Describe la economía con todos sus detalles', 'Reemplaza la necesidad de datos', 'Sirve solo para economías planificadas'], a: 0, e: 'Un modelo deja fuera detalles a propósito (supuestos) para enfocarse en una relación central.' },
      { t: 'mc', q: 'En la <b>economía de la dona</b> de Kate Raworth, el anillo exterior (techo ecológico) representa…', o: ['Los límites ambientales que la actividad económica no debería sobrepasar', 'El PIB máximo que puede alcanzar un país', 'El nivel de pobreza', 'La recaudación de impuestos'], a: 0, e: 'El anillo interior es la base social (necesidades básicas). El espacio seguro y justo está entre ambos anillos.' },
      { t: 'mc', q: 'Según la <b>Ley de Say</b> (pensamiento clásico)…', o: ['La oferta crea su propia demanda', 'La demanda crea su propia oferta', 'Los precios nunca cambian', 'El Estado debe fijar la producción'], a: 0, e: 'Al producir se pagan ingresos, y esos ingresos se gastan en otros bienes. Ejemplo: una fábrica nueva da empleo y sus trabajadores compran en la ciudad.' }

  {

      '<b>Ley de la demanda</b>: relación inversa entre precio y cantidad demandada. Si sube el precio, baja la cantidad demandada.',
      '<b>Demanda de mercado</b> = suma horizontal de las demandas individuales a cada precio.',

    trap: '“Sube el precio, entonces baja la demanda” está mal dicho: baja la <b>cantidad demandada</b> (movimiento). La <b>demanda</b> (toda la curva) no se mueve por su propio precio.',
    items: [
      { t: 'mc', q: 'La <b>demanda</b> de un bien es…', o: ['La cantidad que los consumidores quieren y pueden comprar a cada precio en un período', 'Lo que los consumidores desean, aunque no puedan pagarlo', 'La cantidad efectivamente vendida en el mercado', 'El precio que fijan las empresas'], a: 0, e: 'Demanda = deseo + capacidad de pago, a distintos precios. Un deseo sin dinero no es demanda.' },
      { t: 'sort', q: 'Mercado de carne vacuna: ¿movimiento a lo largo de la curva de demanda o desplazamiento de la curva?', bins: ['Movimiento a lo largo', 'Desplazamiento'], items: [['Baja el precio de la carne vacuna', 0], ['Sube el precio del pollo', 1], ['Aumenta el ingreso de las familias', 1], ['Un estudio dice que la carne roja es dañina', 1], ['Sube el precio de la carne vacuna', 0], ['Se espera que la carne suba el mes que viene', 1]], e: 'Solo el precio del propio bien produce un movimiento a lo largo de la curva. Todo lo demás desplaza la curva completa.' },
      { t: 'mc', q: 'Sube el precio del pollo. ¿Qué ocurre en el mercado de la <b>carne vacuna</b>?', o: ['La demanda de carne vacuna se desplaza a la derecha', 'Hay un movimiento a lo largo de la demanda de carne vacuna', 'La demanda de carne vacuna se desplaza a la izquierda', 'Aumenta la oferta de carne vacuna'], a: 0, e: 'Son <b>sustitutos</b>: el pollo se encarece, parte de los consumidores pasa a la carne vacuna. Aumenta la demanda de carne vacuna a cada precio.' },
      { t: 'sort', q: '¿Sustitutos o complementarios?', bins: ['Sustitutos', 'Complementarios'], items: [['Yerba mate y termo', 1], ['Colectivo y viajes en app (Bolt, Uber)', 0], ['Celular y plan de datos', 1], ['Coca-Cola y Pepsi', 0], ['Auto y nafta', 1], ['Manteca y margarina', 0]], e: 'Sustitutos satisfacen la misma necesidad (si uno sube, aumenta la demanda del otro). Complementarios se consumen juntos (si uno sube, baja la demanda del otro).' },
      { t: 'mc', q: 'Las familias de Luque reciben un aumento de ingresos y compran <b>menos</b> fideos de marca económica. Para ellas esos fideos son…', o: ['Un bien inferior', 'Un bien normal', 'Un bien de lujo', 'Un bien complementario'], a: 0, e: 'Bien inferior: al subir el ingreso, baja su demanda (se reemplaza por marcas mejores).' },
      { t: 'mc', q: 'Se anuncia que el próximo mes subirá el precio de los televisores. ¿Qué pasa <b>hoy</b> con su demanda?', o: ['Aumenta: la curva se desplaza a la derecha', 'Disminuye: la curva se desplaza a la izquierda', 'No cambia, porque el precio aún no subió', 'Hay un movimiento a lo largo de la curva'], a: 0, e: 'Las <b>expectativas</b> de precios futuros más altos adelantan compras: aumenta la demanda actual.' },
      { t: 'gen', g: 'dsum', arg: 'd' },
      { t: 'mc', q: 'La población de adultos mayores crece en Paraguay. ¿Qué demanda tiende a aumentar más?', o: ['Servicios de salud y medicamentos', 'Útiles escolares', 'Pañales para bebés', 'Entradas a parques de diversiones'], a: 0, e: 'Los cambios <b>demográficos</b> desplazan la demanda de los bienes que usa el grupo que crece.' },
      { t: 'mc', q: 'Baja el precio de los celulares. ¿Qué ocurre con la demanda de <b>planes de datos móviles</b>?', o: ['Se desplaza a la derecha', 'Se desplaza a la izquierda', 'No cambia', 'Hay un movimiento hacia arriba sobre la curva'], a: 0, e: 'Son <b>complementarios</b>: celulares más baratos → más celulares → más demanda de planes de datos a cada precio.' }

      '<b>Oferta conjunta</b>: dos bienes salen del mismo proceso (carne y cuero). <b>Oferta competitiva</b>: compiten por los mismos recursos (soja o maíz en la misma tierra).',

      { t: 'mc', q: 'La <b>ley de la oferta</b> establece que…', o: ['Precio y cantidad ofrecida tienen una relación directa, ceteris paribus', 'Precio y cantidad ofrecida tienen una relación inversa', 'La oferta siempre es igual a la demanda', 'Las empresas producen lo mismo a cualquier precio'], a: 0, e: 'A mayor precio, mayor rentabilidad y mayor incentivo para producir y vender más.' },

      { t: 'mc', q: 'Sube el precio del gasoil, insumo clave para sembrar y transportar granos. ¿Qué ocurre con la oferta de soja?', o: ['Se desplaza a la izquierda', 'Se desplaza a la derecha', 'Hay un movimiento hacia arriba a lo largo de la curva', 'No cambia'], a: 0, e: 'Sube el costo de producción → a cada precio conviene producir menos → la oferta disminuye.' },
      { t: 'mc', q: 'La carne vacuna y el cuero se obtienen del mismo animal. Si aumenta la faena por una suba del precio de la carne, ¿qué pasa con la oferta de <b>cuero</b>?', o: ['Se desplaza a la derecha', 'Se desplaza a la izquierda', 'No cambia', 'Hay un movimiento a lo largo de la curva de cuero'], a: 0, e: '<b>Oferta conjunta</b>: más faena produce más carne y, al mismo tiempo, más cuero.' },

      { t: 'mc', q: 'El gobierno otorga un subsidio por kilo a los productores de yerba mate. ¿Qué ocurre con la oferta de yerba?', o: ['Se desplaza a la derecha (hacia abajo)', 'Se desplaza a la izquierda (hacia arriba)', 'No cambia porque el precio no cambió', 'Solo cambia la demanda'], a: 0, e: 'El subsidio reduce el costo por unidad: a cada precio se ofrece más.' },

      { t: 'gen', g: 'dsum', arg: 's' },
      { t: 'mc', q: 'Entran nuevos productores de tomate al mercado de Caaguazú. ¿Qué ocurre?', o: ['La oferta de tomate se desplaza a la derecha', 'La demanda de tomate se desplaza a la derecha', 'La oferta de tomate se desplaza a la izquierda', 'Movimiento a lo largo de la oferta'], a: 0, e: 'Más empresas → más cantidad ofrecida a cada precio.' }

      'Determinantes de la EPD: <b>número y cercanía de sustitutos</b>, <b>necesidad o lujo</b>, <b>proporción del ingreso</b> que se gasta, <b>tiempo</b> (a largo plazo es más elástica).',

      'En una demanda lineal, la EPD cambia: es elástica en la parte alta y inelástica en la parte baja (unitaria en el punto medio).',
      '<span class="formula">YED = %ΔQd ÷ %ΔY</span> (con signo). YED < 0 bien inferior; 0–1 normal de primera necesidad; > 1 normal de lujo. Los productos primarios suelen tener YED baja.'

    items: [
      { t: 'mc', q: 'El dólar pasa de Gs. 7.000 a Gs. 7.500. ¿Qué le pasó al guaraní?', o: ['Se depreció', 'Se apreció', 'No cambió', 'Se fijó'], a: 0, e: 'Ahora un dólar cuesta más guaraníes: el guaraní vale menos.' },

      { t: 'mc', q: 'Una ventaja de un tipo de cambio <b>fijo</b> es que…', o: ['Da certeza a exportadores, importadores e inversores', 'No requiere reservas', 'Permite una política monetaria totalmente independiente', 'Se ajusta solo a los shocks'], a: 0, e: 'Su costo es que exige reservas y limita la política monetaria.' },
      { t: 'mc', q: 'Una limitación de un tipo de cambio fijo es que…', o: ['El banco central necesita muchas reservas para defenderlo y pierde autonomía monetaria', 'Genera demasiada incertidumbre', 'Elimina el comercio', 'Siempre provoca deflación'], a: 0, e: 'Las tasas de interés deben usarse para sostener la paridad, no para otros objetivos.' },
      { t: 'mc', q: 'La inflación en Paraguay es mucho mayor que en sus socios. ¿Qué tiende a pasar con el guaraní?', o: ['Se deprecia: las exportaciones pierden competitividad y crecen las importaciones', 'Se aprecia', 'No cambia', 'Se fija automáticamente'], a: 0, e: 'Baja la demanda de guaraníes y aumenta su oferta.' }

  {

    ess: [
      'Registro de todas las transacciones de un país con el resto del mundo en un período.',

      'Para corregir un déficit corriente: reducir el gasto (políticas contractivas), cambiar el gasto hacia lo nacional (depreciación, proteccionismo) y mejorar la competitividad (políticas de oferta).'

    trap: 'Las remesas de familiares que viven afuera van al <b>ingreso secundario</b> de la cuenta corriente, no a la cuenta financiera.',

      { t: 'mc', q: 'Los intereses que Paraguay paga por su deuda externa se registran en…', o: ['El ingreso primario de la cuenta corriente', 'La cuenta de capital', 'La balanza de bienes', 'Los activos de reserva'], a: 0, e: 'Intereses, dividendos y salarios son ingreso primario.' },
      { t: 'mc', q: 'Un déficit de cuenta corriente…', o: ['Se financia con un superávit en las cuentas de capital y financiera', 'No necesita financiarse', 'Siempre indica una recesión', 'Se registra en la cuenta financiera'], a: 0, e: 'Por ejemplo, con inversión extranjera, préstamos o uso de reservas.' },
      { t: 'mc', q: 'Una depreciación busca reducir el déficit de cuenta corriente porque…', o: ['Abarata las exportaciones y encarece las importaciones', 'Encarece las exportaciones', 'Sube la tasa de interés', 'Reduce el ingreso primario'], a: 0, e: 'Es una política de cambio del gasto: desvía compras hacia la producción nacional.' },
      { t: 'mc', q: 'Una política de <b>reducción del gasto</b> para corregir un déficit corriente es…', o: ['Subir impuestos o tasas de interés para bajar la DA y con ella las importaciones', 'Depreciar la moneda', 'Subsidiar las importaciones', 'Bajar las tasas de interés'], a: 0, e: 'Su costo es menos crecimiento y más desempleo en el corto plazo.' },
      { t: 'mc', q: 'Un déficit de cuenta corriente persistente puede llevar a…', o: ['Mayor endeudamiento externo, venta de activos al exterior y presión a la depreciación', 'Apreciación permanente de la moneda', 'Superávit fiscal', 'Más reservas internacionales'], a: 0, e: 'Si los inversores pierden confianza, el financiamiento puede cortarse.' },
      { t: 'mc', q: 'A largo plazo, la forma más sostenible de mejorar la cuenta corriente es…', o: ['Mejorar la productividad y la competitividad de las exportaciones con políticas de oferta', 'Aplicar aranceles a todo', 'Fijar el tipo de cambio', 'Prohibir las remesas'], a: 0, e: 'Exportar más por ser más competitivo, no por cerrar la economía.' }
    ]

function instFor(t, S, i) {
  const it = t.items[i];
  if (it.t === 'gen') { if (!S.inst[i]) S.inst[i] = GEN[it.g](it.arg); return Object.assign({ t: 'gen' }, S.inst[i]); }
  if (it.t === 'genmc') { if (!S.inst[i]) S.inst[i] = GEN[it.g](); return S.inst[i]; }
  return it;
}
const TYPE_LABEL = { mc: 'Opción múltiple', genmc: 'Opción múltiple', sort: 'Clasificar', gen: 'Cálculo' };

function renderDeck(t, S) {
  const n = t.items.length, i = S.i;
  const it = t.items[i];
  const body = $('#tbody');
  const ok = Object.values(S.res).filter(v => v === true).length;
  body.innerHTML = `<div class="card">
    <div class="card-h"><span class="k">Ejercicio ${i + 1} de ${n} <span class="tag">${TYPE_LABEL[it.t]}</span></span>
      <div class="dots" aria-label="Ejercicios">${t.items.map((_, k) => `<button type="button" data-k="${k}" class="${k === i ? 'cur ' : ''}${S.res[k] === true ? 'ok' : S.res[k] === false ? 'no' : ''}" aria-label="Ejercicio ${k + 1}">${k + 1}</button>`).join('')}</div></div>
    <div class="card-b"><div id="ib"></div><div id="ib2"></div></div>
    <div class="card-f"><span class="muted small" style="align-self:center">Correctas en esta sesión: <b>${ok}</b> de ${n}</span>
      <div class="row"><button class="btn sm" type="button" id="prev" ${i === 0 ? 'disabled' : ''}>← Anterior</button><button class="btn sm primary" type="button" id="next">${i === n - 1 ? 'Terminar' : 'Siguiente →'}</button></div></div>
  </div>`;
  body.querySelectorAll('.dots button').forEach(b => b.onclick = () => { S.i = +b.dataset.k; renderDeck(t, S); });
  $('#prev').onclick = () => { S.i--; renderDeck(t, S); };
  $('#next').onclick = () => { if (i === n - 1) return deckSummary(t, S); S.i++; renderDeck(t, S); };
  const host = $('#ib');
  const done = correct => { S.res[i] = correct; if (correct) markDone(t.id, i); updateDots(); };
  function updateDots() {
    const b = body.querySelector(`.dots button[data-k="${i}"]`);
    b.className = 'cur ' + (S.res[i] === true ? 'ok' : S.res[i] === false ? 'no' : '');
    body.querySelector('.card-f .muted b').textContent = Object.values(S.res).filter(v => v === true).length;
  }
  const inst = instFor(t, S, i);
  if (inst.t === 'mc') mountMC(host, inst, S, i, done);
  else if (inst.t === 'sort') mountSort(host, inst, S, i, done);

}
function deckSummary(t, S) {
  const n = t.items.length, ok = Object.values(S.res).filter(v => v === true).length;

/* ---------- opción múltiple ---------- */
function mountMC(host, it, S, i, done, opts = {}) {
  const st = S && S.mc ? S.mc : null;
  const key = 'perm' + i;
  let perm;
  if (it.fixed) perm = it.o.map((_, k) => k);
  else if (S) { S.perm = S.perm || {}; perm = S.perm[key + '|' + it.q.length] = S.perm[key + '|' + it.q.length] || shuffle(it.o.map((_, k) => k)); }
  else perm = shuffle(it.o.map((_, k) => k));
  host.innerHTML = `<p class="q">${it.q}</p><div class="opts">${perm.map((k, j) => `<button class="opt" type="button" data-k="${k}"><span class="l">${'ABCD'[j]}</span><span>${it.o[k]}</span></button>`).join('')}</div><div id="fbx"></div>`;
  const prev = S && S.res && S.res[i];
  host.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const k = +b.dataset.k;
    if (opts.exam) { host.querySelectorAll('.opt').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); return opts.exam(k); }
    const right = k === it.a;
    host.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (+x.dataset.k === it.a) x.classList.add('right'); });
    if (!right) b.classList.add('wrong');
    $('#fbx', host).innerHTML = `<div class="fb ${right ? 'ok' : 'no'}"><b class="h">${right ? 'Correcto' : 'No es correcto'}</b>${it.e || ''}</div>${right ? '' : '<div class="row"><button class="btn sm" type="button" id="retry">Intentar de nuevo</button></div>'}`;
    if (!right) $('#retry', host).onclick = () => mountMC(host, it, S, i, done, opts);
    done(right);
  });
}

function mountGen(host, it, done, again, opts = {}) {
  host.innerHTML = `<p class="q">${it.q}</p>
    <form class="calc" id="cf"><input id="ans" inputmode="decimal" autocomplete="off" placeholder="Tu respuesta" aria-label="Tu respuesta"><span class="muted">${it.unit || ''}</span>
    ${opts.exam ? '' : '<button class="btn primary sm" type="submit">Comprobar</button>'}</form>
    <div id="fbx"></div>
    ${opts.exam ? '' : '<div class="row" style="margin-top:10px"><button class="btn sm" type="button" id="again">Otro ejercicio con datos nuevos</button></div>'}`;
  const inp = $('#ans', host);
  if (opts.exam) { inp.oninput = () => opts.exam(inp.value); $('#cf', host).onsubmit = e => e.preventDefault(); return; }
  let tries = 0;
  $('#again', host).onclick = again;
  $('#cf', host).onsubmit = e => {
    e.preventDefault();
    const v = parseNum(inp.value);
    if (isNaN(v)) { $('#fbx', host).innerHTML = '<div class="fb info">Escribe un número. Para decimales puedes usar coma o punto (por ejemplo 1,25).</div>'; return; }
    tries++;
    const right = Math.abs(v - it.ans) <= (it.tol || 0) + 1e-9;
    if (right) { $('#fbx', host).innerHTML = `<div class="fb ok"><b class="h">Correcto: ${fmt(it.ans, Number.isInteger(it.ans) ? 0 : 2)}</b><div class="sol">${it.sol}</div></div>`; done(true); }
    else {
      $('#fbx', host).innerHTML = `<div class="fb no"><b class="h">No es correcto</b>${tries < 2 ? 'Revisa el procedimiento e inténtalo otra vez, o mira la solución.' : ''}<div class="row" style="margin-top:8px"><button class="btn sm" type="button" id="show">Ver la solución</button></div></div>`;
      $('#show', host).onclick = () => { $('#fbx', host).innerHTML = `<div class="fb info"><b class="h">Respuesta: ${fmt(it.ans, Number.isInteger(it.ans) ? 0 : 2)}</b><div class="sol">${it.sol}</div></div>`; };
      done(false);
    }
  };
}

    <div class="ctl"><label for="cs">Producción de soja sobre la CPP: <span id="csv"></span></label><input type="range" id="cs" min="0" max="70" step="10" value="40"><div class="small" id="oc" style="margin-top:6px"></div></div>`;

  const newTask = () => { S.task = pick(TASKS.filter(t => !S.task || t[0] !== S.task[0])); $('#task', pan).innerHTML = 'Ubica ' + S.task[1] + '.'; };

    const sample = (sx, sy) => { const o = []; for (let i = 0; i <= 80; i++) { const x = XM * sx * i / 80; o.push([x, f(x, sx, sy)]); } return o; };

  newTask(); draw();

    <div class="fb info small">Referencia aproximada: los países nórdicos tienen Gini cercanos a 0,25–0,30; en América Latina suelen estar entre 0,40 y 0,55.</div>

  const share = (x, k) => 100 * Math.pow(x, k);

    P.text(82, share(.82, k) * 0.4, 'B', 'cl t-ink', 'middle');
